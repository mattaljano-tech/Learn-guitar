name: Synktjänst

# Lägger ut synktjänsten (sync/worker.js) på Cloudflare Workers.
# Kräver två hemligheter i repot: CLOUDFLARE_API_TOKEN och CLOUDFLARE_ACCOUNT_ID.
# Adressen till tjänsten skrivs till sync-url.json, som appen läser.
on:
  push:
    branches: [main]
    paths: ['sync/**', '.github/workflows/sync.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Finns Cloudflare-nycklarna?
        id: chk
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::Lägg in CLOUDFLARE_API_TOKEN och CLOUDFLARE_ACCOUNT_ID under Settings → Secrets and variables → Actions, och kör sedan det här arbetsflödet igen."
            echo "ok=0" >> $GITHUB_OUTPUT
          else echo "ok=1" >> $GITHUB_OUTPUT; fi
      - uses: actions/setup-node@v4
        if: steps.chk.outputs.ok == '1'
        with:
          node-version: 22
      - name: Lagring (KV) och utläggning
        if: steps.chk.outputs.ok == '1'
        working-directory: sync
        run: |
          set -e
          ID=$(npx -y wrangler@4 kv namespace list | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const a=JSON.parse(s.slice(s.indexOf('[')));const n=a.find(x=>x.title==='nylongitarr-sync');process.stdout.write(n?n.id:'')})")
          if [ -z "$ID" ]; then
            npx -y wrangler@4 kv namespace create nylongitarr-sync > kv.txt || true
            cat kv.txt
            ID=$(npx -y wrangler@4 kv namespace list | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const a=JSON.parse(s.slice(s.indexOf('[')));const n=a.find(x=>x.title==='nylongitarr-sync');process.stdout.write(n?n.id:'')})")
          fi
          test -n "$ID"
          cat > wrangler.toml <<TOML
          name = "nylongitarr-sync"
          main = "worker.js"
          compatibility_date = "2025-01-01"
          workers_dev = true
          [[kv_namespaces]]
          binding = "NG_SYNC"
          id = "$ID"
          TOML
          sed -i 's/^ *//' wrangler.toml
          npx -y wrangler@4 deploy | tee deploy.txt
          URL=$(grep -o 'https://[a-zA-Z0-9.-]*workers.dev' deploy.txt | head -1)
          test -n "$URL"
          echo "{\"url\":\"$URL\"}" > ../sync-url.json
          cat ../sync-url.json
      - name: Spara adressen i repot
        if: steps.chk.outputs.ok == '1'
        run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sync-url.json
          git diff --cached --quiet || (git commit -m "Synktjänstens adress" && git push)
