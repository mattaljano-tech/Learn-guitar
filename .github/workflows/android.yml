name: Android-app

# Bygger NylonGitarr som Android-app (APK) varje gång webbappen ändras på main,
# och lägger den under Releases. Senaste versionen finns alltid på:
# https://github.com/mattaljano-tech/Learn-guitar/releases/latest/download/NylonGitarr.apk
on:
  push:
    branches: [main]
    paths: ['index.html', 'audio/**', 'hand/**', 'video/**', 'icons/**', 'app/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Installera Capacitor
        run: npm install --no-audit --no-fund

      - name: Bygg webbdelen
        run: npm run www

      - name: Skapa Android-projektet
        run: |
          npx cap add android
          M=android/app/src/main/AndroidManifest.xml
          # mikrofonen (stämmaren, Jamma, inspelning)
          sed -i 's#<uses-permission android:name="android.permission.INTERNET" />#<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />#' $M
          grep -q RECORD_AUDIO $M
          # versionsnummer = byggnummer, så att varje ny APK räknas som en uppdatering
          G=android/app/build.gradle
          sed -i "s/versionCode [0-9]*/versionCode ${{ github.run_number }}/; s/versionName \"[^\"]*\"/versionName \"1.${{ github.run_number }}\"/" $G
          grep -n "versionCode\|versionName" $G

      - name: Ikoner och startbild
        run: npx @capacitor/assets generate --android --iconBackgroundColor '#06050e' --iconBackgroundColorDark '#06050e' --splashBackgroundColor '#06050e' --splashBackgroundColorDark '#06050e'

      - name: Synka in webbdelen
        run: npx cap sync android

      - name: Bygg APK
        working-directory: app/android
        run: ./gradlew --no-daemon assembleRelease

      - name: Signera
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_SECRET: ${{ secrets.ANDROID_KEYSTORE_PASS }}
        run: |
          # Egen nyckel i repot (personlig app). Lägg in secrets ANDROID_KEYSTORE_B64/PASS om appen ska spridas till andra.
          if [ -n "$KS_B64" ]; then echo "$KS_B64" | base64 -d > /tmp/ng.jks; export KS_PASS="$KS_SECRET"; else cp signing/nylongitarr.jks /tmp/ng.jks; export KS_PASS='39f612ec63d31e7152f0d7f6b1da77ee0969'; fi
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          IN=android/app/build/outputs/apk/release/app-release-unsigned.apk
          $BT/zipalign -f -p 4 $IN /tmp/aligned.apk
          $BT/apksigner sign --ks /tmp/ng.jks --ks-pass env:KS_PASS --ks-key-alias nylongitarr --key-pass env:KS_PASS --out NylonGitarr.apk /tmp/aligned.apk
          $BT/apksigner verify NylonGitarr.apk
          ls -la NylonGitarr.apk

      - name: Lägg upp under Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=app-${{ github.run_number }}
          gh release create $TAG NylonGitarr.apk --title "NylonGitarr 1.${{ github.run_number }}" --notes "Android-appen byggd från ${GITHUB_SHA::7}. Installera NylonGitarr.apk på telefonen." --latest
