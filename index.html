<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="description" content="Öva gitarr med kompband, 3D-grepp, skank-skola och stämmare.">
<meta name="theme-color" content="#100e0c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<meta name="apple-mobile-web-app-title" content="NylonGitarr">

<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">

<style>
:root{padding-top:var(--safe-area-inset-top,env(safe-area-inset-top,0px));padding-bottom:var(--safe-area-inset-bottom,env(safe-area-inset-bottom,0px))}
body{margin:0;font:14px system-ui,-apple-system,"Segoe UI",sans-serif}
img{max-width:100%}
[hidden]{display:none!important}
html{-webkit-tap-highlight-color:transparent}
/* Känns som en riktig app på telefonen */
html,body{overscroll-behavior-y:none;overflow-x:clip}
button,a,[role="tab"],.bar,.dg,.song,.chip{touch-action:manipulation;-webkit-user-select:none;user-select:none}
input,select,textarea{font-size:16px}
@media (display-mode: standalone){
  body{-webkit-user-select:none;user-select:none}
  input,textarea{-webkit-user-select:text;user-select:text}
}
.ladder-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:8px;font-size:13px}
.rec-sheet{grid-column:1/-1;display:grid;gap:10px}
.rec-sheet>.btn{justify-self:start}
.jsheet{display:grid;gap:12px;padding:12px;border-radius:14px;background:var(--surface-2)}
.js-rows{list-style:none;margin:0;padding:0;max-height:340px;overflow:auto;display:grid;gap:2px;position:relative}
.js-rows li{display:grid;grid-template-columns:42px 64px 1fr;gap:8px;align-items:center;padding:6px 8px;border-radius:10px;cursor:pointer}
.js-rows li.on{background:color-mix(in oklab,var(--ember) 18%,transparent)}
.js-t{font-size:12px;color:var(--muted)}.js-k{font-size:16px}
.js-st{display:flex;flex-wrap:wrap;gap:3px}
.js-st i{font-style:normal;font-weight:700;font-size:17px;width:18px;text-align:center;line-height:1.2;border-radius:5px}
.js-st i.d{color:var(--ember)}.js-st i.u{color:var(--sky)}.js-st i.q{color:var(--faint)}
.js-st i.hit{background:var(--text);color:var(--surface)}
.js-busy{display:grid;gap:6px;font-size:13px}.js-busy .bar{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden}.js-busy .bar i{display:block;height:100%;background:var(--ember)}
.linkbtn{background:none;border:0;padding:0;color:inherit;text-decoration:underline;cursor:pointer;font:inherit}
.jv-exp{grid-column:1/-1;display:grid;gap:8px;justify-items:start}
.trec{display:grid;gap:10px}.trec-list{display:flex;flex-wrap:wrap;gap:6px}.trec-card{display:grid;gap:8px;padding:12px;border-radius:14px;background:var(--surface-2)}.trec audio{width:100%}
.skin-tog{display:grid;grid-template-columns:minmax(0,1fr) auto;width:100%;background:none;border:0;border-top:1px solid var(--line);padding:12px 0 0;color:inherit;font:inherit;text-align:left;cursor:pointer;align-items:center;gap:10px}.skin-tog>div{flex:1}.skin-tog .st-r{display:flex;align-items:center;gap:10px}.skin-tog .sw{display:flex;gap:3px}.skin-tog .sw i{width:14px;height:14px;border-radius:50%;display:block;box-shadow:0 0 0 1px rgba(0,0,0,.12)}.skin-tog .chev{font-size:14px;color:var(--muted)}
.song-check{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:6px 0 2px;position:relative}
.sc-lab{font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px}.sc-lab.orig{background:color-mix(in oklab,var(--leaf) 20%,transparent)}.sc-lab.unk{background:var(--surface-2);color:var(--muted)}.sc-lab.simple{background:color-mix(in oklab,var(--brass) 22%,transparent)}
.sc-btn{font:inherit;font-size:12px;padding:3px 9px;border-radius:999px;border:1px dashed var(--faint);background:none;color:var(--muted);cursor:pointer}.sc-btn.done{border-style:solid;color:var(--text)}
.sc-pop{flex-basis:100%;display:grid;gap:8px;padding:12px;border-radius:14px;background:var(--surface-2)}.sc-what{display:flex;flex-wrap:wrap;gap:6px}
.sc-pop textarea{font:inherit;padding:8px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--text);resize:vertical}
.rep-list{list-style:none;margin:0;padding:0;display:grid;gap:6px}.rep-list li{display:grid;grid-template-columns:1fr auto;gap:6px;align-items:center}.rep-list li small{grid-column:1;color:var(--muted)}.rep-list li .rec-x{grid-row:1/span 2;grid-column:2}
.sc-capo{display:inline-flex;align-items:center;gap:5px;font:inherit;font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;border:1.5px solid var(--ember);background:none;color:var(--ember);cursor:pointer}.sc-capo svg{width:14px;height:14px}.sc-capo.on{background:var(--ember);color:#fff}
</style>
<title>NylonGitarr Studio</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500..700&family=Corinthia:wght@400;700&family=Outfit:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: sticky stage header over a two-column practice desk (song list | instrument), stacking to one column on phones */
:root{
  /* Grundvärden, temana nedan skriver över dem */
  --bg:#0c0a1a; --surface:#15122a; --surface-2:#1e1a3a; --surface-3:#29234c; --line:#332c5c;
  --text:#f4f1ff; --muted:#aba4d4; --faint:#706aa3;
  --brass:#ff5ca8; --brass-2:#ff9a5c; --brass-ink:#2a0418;
  --leaf:#2ee6b8; --leaf-2:#8af7d9; --leaf-ink:#03241a;
  --ember:#ff6b5a; --ember-ink:#2a0703; --sky:#5ab8ff;
  --f1:#5ab8ff; --f2:#2ee6b8; --f3:#ffd23f; --f4:#ff5ca8;
  --wood-1:#3a2418; --wood-2:#26160d; --bone:#f3ead6; --skin:#f2c6a2; --skin-2:#d99f78; --top-1:#d9a866; --top-2:#b9834a;
  --glow-1:#ff5ca8; --glow-2:#2ee6b8;
  --f-display:"Outfit",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-body:"Outfit",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --r:16px;
  color-scheme:dark;
}
:root[data-skin="ceder"]{
  /* Ceder: ljust papper, cedertopp och mörkt trä */
  --bg:#f6efe4; --surface:#fbf7f0; --surface-2:#ede3d3; --surface-3:#e1d4bf; --line:#d3c3ab;
  --text:#3b2a1e; --muted:#6b5646; --faint:#8a7563;
  --brass:#9a5426; --brass-2:#9a5426; --brass-ink:#fff8ef;
  --leaf:#7a5a2e; --leaf-2:#6a4c24; --leaf-ink:#fff8ef;
  --ember:#b5652e; --ember-ink:#fff8ef; --sky:#4b6478;
  --f1:#4b6478; --f2:#7a5a2e; --f3:#b8862b; --f4:#9a3f2a;
  --glow-1:#e7c9a4; --glow-2:#b5652e;
  --f-display:"Outfit",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-body:"Outfit",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"Outfit",system-ui,sans-serif;
  --r:14px;
  color-scheme:light;
  --wv-band:#ede3d3;
  --cv-bg:#3b2a1e; --cv-text:#f6efe4; --cv-btn:#b5652e; --cv-btn-text:#fff8ef;
  --vd-plate:#4a3526; --vd-line:#3b2a1e; --vd-rim:#22180f; --vd-dots:#c9a77c; --vd-disc:#1a130e; --vd-groove:#2e2219;
  --vd-label:#e7c9a4; --vd-ink:#3b2a1e; --vd-arm:#f6efe4; --vd-head:#b5652e; --vd-hole:#f6efe4; --vd-ring:transparent; --vd-ring-2:transparent; --vd-rays:transparent;
}
:root[data-skin="valnot"]{
  /* Valnöt: mörkt trä, mässing och ben */
  --bg:#1c1511; --surface:#241b16; --surface-2:#2e231c; --surface-3:#3a2d24; --line:#4a3a2e;
  --text:#f1e6d2; --muted:#c9b8a0; --faint:#9c8a74;
  --brass:#e3bd6e; --brass-2:#e3bd6e; --brass-ink:#2a1c08;
  --leaf:#e0cfa8; --leaf-2:#efe2c4; --leaf-ink:#2a1c08;
  --ember:#d4a24c; --ember-ink:#2a1c08; --sky:#8fb0c4;
  --f1:#8fb0c4; --f2:#e0cfa8; --f3:#e3bd6e; --f4:#d9734e;
  --glow-1:#d4a24c; --glow-2:#8fb0c4;
  --f-display:"Outfit",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-body:"Outfit",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"Outfit",system-ui,sans-serif;
  --r:14px;
  color-scheme:dark;
  --wv-band:#2e231c;
  --cv-bg:#2e231c; --cv-text:#f1e6d2; --cv-btn:#d4a24c; --cv-btn-text:#2a1c08;
  --vd-plate:#2a1f19; --vd-line:#1c1511; --vd-rim:#0e0a08; --vd-dots:#d4a24c; --vd-disc:#0e0a08; --vd-groove:#2a2520;
  --vd-label:#d4a24c; --vd-ink:#2a1c08; --vd-arm:#f1e6d2; --vd-head:#d9734e; --vd-hole:#f1e6d2; --vd-ring:transparent; --vd-ring-2:transparent; --vd-rays:transparent;
}
:root[data-skin="sol"]{
  /* Sol: mörkt rödbrunt, guld och rosa som en solnedgång */
  --bg:#0d0605; --surface:#1a0d0b; --surface-2:#261410; --surface-3:#331b15; --line:#45271d; --text:#fff1ea; --muted:#dcbcb0; --faint:#ae8a7f; --brass:#ffb84d; --brass-2:#ff3d80; --brass-ink:#2a1204; --leaf:#ff8a4c; --leaf-2:#ffc07a; --leaf-ink:#2a1204; --ember:#ff6a3d; --ember-ink:#1f0802; --sky:#ffd27a; --f1:#ffd27a; --f2:#ff8a4c; --f3:#ffb84d; --f4:#ff3d80; --glow-1:#ffb84d; --glow-2:#ff3d80; --wv-band:#261410; --cv-bg:#3a160f; --cv-text:#fff1ea; --cv-btn:#ffb84d; --cv-btn-text:#2a1204; --vd-plate:#2a110c; --vd-line:#140705; --vd-rim:#070303; --vd-dots:#ffb84d; --vd-disc:#0a0505; --vd-groove:#2e1a14; --vd-label:#ffb84d; --vd-ink:#2a1204; --vd-arm:#fff1ea; --vd-head:#ff3d80; --vd-hole:#fff1ea; --vd-ring:#ff3d80; --vd-ring-2:#ff8a4c; --vd-rays:#ffb84d;
  --f-display:"Outfit",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-body:"Outfit",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --r:16px;
  color-scheme:dark;
}
html,body{background:var(--bg);color:var(--text)}
body{background:radial-gradient(900px 520px at 85% -8%,color-mix(in oklab,var(--glow-1) 16%,transparent),transparent 65%),radial-gradient(800px 520px at -10% 30%,color-mix(in oklab,var(--glow-2) 10%,transparent),transparent 60%),var(--bg);background-attachment:fixed;min-height:100%}
body{font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:var(--safe-area-inset-top,env(safe-area-inset-top,0px));z-index:10;background:var(--bg)}
*{box-sizing:border-box}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px;border-radius:8px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
p{margin:0}
.wrap{max-width:1200px;margin:0 auto;padding-left:max(16px,var(--safe-area-inset-left,env(safe-area-inset-left,0px)));padding-right:max(16px,var(--safe-area-inset-right,env(safe-area-inset-right,0px)))}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.09em;color:var(--muted)}

/* Header */
header.top{position:sticky;top:var(--safe-area-inset-top,env(safe-area-inset-top,0px));z-index:20;background:color-mix(in oklab,var(--bg) 90%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.top-in{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;padding-block:12px}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto}
.brand h1{font-size:20px;font-weight:800}
.brand h1 span{color:var(--brass)}
.brand small{display:block;font-size:12px;color:var(--muted);font-family:var(--f-body)}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;max-width:100%}
.tabs button{padding:8px 13px;border-radius:10px;font-weight:600;font-size:14px;color:var(--muted);white-space:nowrap}
.tabs button:hover{color:var(--text);background:var(--surface)}
.tabs button[aria-selected="true"]{color:var(--brass-ink);background:linear-gradient(135deg,var(--brass),var(--brass-2))}
.quick{display:flex;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:13px;font-weight:600;color:var(--muted)}
.chip:hover{color:var(--text);border-color:var(--faint)}
.chip.on{color:var(--leaf);border-color:color-mix(in oklab,var(--leaf) 60%,transparent);background:color-mix(in oklab,var(--leaf) 12%,var(--surface))}
.chip.warn{color:var(--ember);border-color:color-mix(in oklab,var(--ember) 50%,transparent)}
.icon{width:16px;height:16px;flex:none}

main{padding-block:22px 64px;display:grid;gap:22px}
.card{background:color-mix(in oklab,var(--surface) 88%,transparent);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.card.flat{background:transparent}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.between{justify-content:space-between}
.muted{color:var(--muted)}

/* Play layout */
.desk{display:grid;grid-template-columns:250px minmax(0,1fr);gap:22px;align-items:start}
.songs{display:grid;gap:6px;position:sticky;top:84px;max-height:calc(100vh - 100px);overflow-y:auto;scrollbar-width:thin;padding-right:4px}
.tierhead{grid-column:1 / -1;padding:10px 4px 2px}
.tierhead:first-child{padding-top:0}
.song{display:block;width:100%;text-align:left;padding:11px 12px;border-radius:12px;border:1px solid transparent;position:relative}
.song:hover{background:var(--surface)}
.song.sel{background:var(--surface-2);border-color:var(--line)}
.song b{display:block;font-weight:700;font-size:14px;line-height:1.3;padding-right:20px}
.song i{display:block;font-style:normal;font-size:12px;color:var(--muted)}
.song .chords{font-family:var(--f-mono);font-size:11px;color:var(--brass);margin-top:3px}
.song .del{position:absolute;right:8px;top:9px;color:var(--faint);font-size:16px;line-height:1;padding:2px 5px;border-radius:6px}
.song .del:hover{color:var(--ember);background:var(--surface-3)}
.add{border:1px dashed var(--line);color:var(--brass);font-weight:600;font-size:13px;padding:10px;border-radius:12px;text-align:center}
.add:hover{border-color:var(--brass)}
.stage{display:grid;gap:18px;min-width:0}

.now{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:end}
.now h2{font-size:clamp(24px,3.4vw,34px);font-weight:800;line-height:1.1}
.now .meta{color:var(--muted);margin-top:4px;font-size:14px}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.tag{font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--surface-2);color:var(--muted)}
.chordnow{display:flex;align-items:flex-end;gap:14px}
.chordnow .big{font-family:var(--f-display);font-weight:800;font-size:64px;line-height:.9;background:linear-gradient(135deg,var(--brass),var(--brass-2));-webkit-background-clip:text;background-clip:text;color:transparent;min-width:1.4em;text-align:right}
.chordnow .next{font-size:12px;color:var(--muted);line-height:1.3;padding-bottom:6px}
.chordnow .next b{display:block;font-family:var(--f-display);font-size:24px;color:var(--text)}

/* Transport */
.transport{display:grid;gap:16px}
.tp-main{display:flex;flex-wrap:wrap;align-items:center;gap:14px}
.play{display:inline-flex;align-items:center;gap:10px;height:52px;padding:0 22px 0 18px;border-radius:999px;background:linear-gradient(135deg,var(--leaf),var(--leaf-2));color:var(--leaf-ink);font-weight:700;font-size:15px;box-shadow:0 6px 24px -10px var(--leaf)}
.play.stop{background:var(--ember);color:var(--ember-ink);box-shadow:0 6px 24px -10px var(--ember)}
.play svg{width:20px;height:20px}
.bpm{display:flex;align-items:center;gap:4px;background:var(--surface-2);border-radius:999px;padding:4px}
.bpm button{width:36px;height:36px;border-radius:50%;font-size:18px;font-weight:700;color:var(--muted)}
.bpm button:hover{background:var(--surface-3);color:var(--text)}
.bpm .val{min-width:74px;text-align:center;font-family:var(--f-mono);font-weight:700;font-size:18px}
.bpm .val small{font-size:10px;color:var(--muted);display:block;line-height:1;font-family:var(--f-body);font-weight:600;letter-spacing:.08em}
.tap{padding:0 14px!important;width:auto!important;border-radius:999px!important;font-size:12px!important;letter-spacing:.06em}
.seg{display:inline-flex;background:var(--surface-2);padding:3px;border-radius:12px;gap:2px;flex-wrap:wrap}
.seg button{padding:7px 12px;border-radius:9px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button:hover{color:var(--text)}
.seg button[aria-pressed="true"]{background:var(--surface-3);color:var(--text);box-shadow:inset 0 0 0 1px var(--line)}
.tp-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.mixer{display:grid;gap:8px}
.slider{display:grid;grid-template-columns:72px minmax(0,1fr) 38px;align-items:center;gap:10px;font-size:13px;color:var(--muted)}
.slider span:last-child{font-family:var(--f-mono);font-size:12px;text-align:right}
input[type=range]{width:100%;accent-color:var(--brass);height:20px}
.checks{display:grid;gap:8px;font-size:13px}
.checks label{display:flex;align-items:center;gap:9px;color:var(--muted);cursor:pointer}
.checks input{accent-color:var(--brass);width:16px;height:16px}

/* Beat strip */
.beats{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:6px}
.beats.b16 .beat:nth-child(4n+1){border-left:2px solid color-mix(in oklab,var(--brass) 45%,transparent)}
.beats.b16 .beat:not(.hit) .t{visibility:hidden}
.beat{border-radius:12px;padding:8px 2px 7px;text-align:center;background:var(--surface-2);border:1px solid transparent;transition:transform .06s,background .06s}
.beat .n{font-family:var(--f-mono);font-size:12px;color:var(--muted);font-weight:700}
.beat .a{height:22px;display:flex;align-items:center;justify-content:center;color:var(--text)}
.beat .a svg{width:18px;height:18px}
.beat .t{font-size:10px;font-weight:700;letter-spacing:.06em;color:var(--faint);text-transform:uppercase}
.beat.rest .a{color:var(--faint)}
.beat.hit{background:color-mix(in oklab,var(--brass) 14%,var(--surface-2));border-color:color-mix(in oklab,var(--brass) 35%,transparent)}
.beat.edit{cursor:pointer;border:1px dashed var(--brass)}
.beat.cur{background:linear-gradient(160deg,var(--brass),var(--brass-2));transform:scale(1.04)}
.beat.cur *{color:var(--brass-ink)!important}
.count{font-family:var(--f-display);font-weight:800;color:var(--brass);font-size:15px}

/* Fretboard */
.board{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 16px 12px}
.board-scroll{overflow-x:auto;margin-inline:-6px;padding-inline:6px}
.board svg{display:block;width:100%;height:auto;user-select:none}
.board-scroll svg{min-width:620px}
.str{cursor:pointer}
.str.vib .line{animation:vib .045s linear 8}
.str.vibx .line{animation:vibx .045s linear 8}
@keyframes vibx{0%{transform:translateX(0)}25%{transform:translateX(-1.3px)}75%{transform:translateX(1.3px)}100%{transform:translateX(0)}}
@keyframes vib{0%{transform:translateY(0)}25%{transform:translateY(-1.3px)}75%{transform:translateY(1.3px)}100%{transform:translateY(0)}}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:12px;color:var(--muted);margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.legend .dot{width:18px;height:18px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:#111;margin-right:6px;vertical-align:middle}

/* Chart */
.chart{display:grid;gap:14px}
.part{display:grid;gap:8px}
.part.dim{opacity:.45}
.part-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.loopchip{padding:4px 10px;font-size:12px}
.bars{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:6px}
.bar{position:relative;padding:12px 6px 8px;border-radius:10px;background:var(--surface-2);text-align:center;border:1px solid transparent}
.bar:hover{border-color:var(--line)}
.bar b{font-family:var(--f-display);font-size:20px;font-weight:800;display:block;line-height:1.1}
.bar b.split{font-size:15px;display:flex;justify-content:center;gap:6px;align-items:baseline}
.bar b.split i{font-style:normal;padding-left:6px;border-left:1px solid currentColor;opacity:.85}
.bar small{position:absolute;left:7px;top:4px;font-family:var(--f-mono);font-size:10px;color:var(--faint)}
.bar.cur{background:linear-gradient(160deg,var(--brass),var(--brass-2));color:var(--brass-ink)}
.bar.cur small{color:var(--brass-ink)}
.bar.start{border-color:var(--brass)}
.bar .prog{position:absolute;left:0;bottom:0;height:3px;background:var(--brass-ink);opacity:.5;border-radius:0 0 0 10px}

.diagrams{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.dg{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 10px 8px;text-align:left;display:flex;flex-direction:column;gap:2px}
.dg:hover{border-color:var(--faint)}
.dg.sel{border-color:var(--brass);background:color-mix(in oklab,var(--brass) 7%,var(--surface))}
.dg .hd{display:flex;align-items:baseline;justify-content:space-between;gap:6px}
.dg .nm{font-family:var(--f-display);font-weight:800;font-size:20px}
.dg .badge{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--sky);border:1px solid color-mix(in oklab,var(--sky) 40%,transparent);padding:1px 6px;border-radius:6px}
.dg .ft{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dg .ft.easy{color:var(--leaf)}
.dg svg{width:100%;height:auto}

.tip{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:start;font-size:14px;color:var(--muted);max-width:75ch}
.tip b{color:var(--text)}
.tip .mark{font-family:var(--f-display);font-weight:800;color:var(--brass);font-size:13px;letter-spacing:.06em;text-transform:uppercase;padding-top:1px}

.section-head{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:6px 16px;margin-bottom:12px}
.section-head h3{font-size:18px}
.section-head p{font-size:13px;color:var(--muted)}
.lead{font-size:15px;color:var(--muted);max-width:68ch}
.lead strong{color:var(--text)}
h2.page{font-size:clamp(24px,3vw,30px);font-weight:800}

/* Skank */
.rules{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.rule{padding:14px;border-radius:12px;background:var(--surface-2)}
.rule h4{margin:0 0 4px;font-size:14px;font-family:var(--f-display)}
.rule p{font-size:13px;color:var(--muted)}
.levels{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}
.level{text-align:left;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--surface)}
.level b{display:block;font-size:14px}
.level span{font-size:12px;color:var(--muted)}
.level[aria-pressed="true"]{border-color:var(--leaf);background:color-mix(in oklab,var(--leaf) 10%,var(--surface))}
.level[aria-pressed="true"] b{color:var(--leaf)}
.sk{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:8px}
.skc{border-radius:14px;padding:12px 4px;text-align:center;background:var(--surface-2);border:1px solid transparent;display:grid;gap:4px;justify-items:center}
.skc .n{font-family:var(--f-display);font-weight:800;font-size:22px;line-height:1}
.skc .w{font-size:11px;font-weight:800;letter-spacing:.06em}
.skc .s{font-size:10px;color:var(--muted)}
.skc.boom .w{color:var(--brass)}
.skc.tjack{background:color-mix(in oklab,var(--leaf) 10%,var(--surface-2));border-color:color-mix(in oklab,var(--leaf) 30%,transparent)}
.skc.tjack .w{color:var(--leaf)}
.skc.cur.boom{background:var(--brass);transform:scale(1.05)}
.skc.cur.tjack{background:var(--leaf);transform:scale(1.05)}
.skc.cur *{color:#111!important}
.coach{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:start;padding:14px;border-radius:12px;background:var(--surface-2);font-size:14px}
.coach .big{font-family:var(--f-display);font-weight:800;font-size:34px;color:var(--leaf);line-height:1;min-width:1.6em}

/* Byten */
.pick{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px}
.pick label{display:grid;gap:4px;font-size:12px;color:var(--muted);font-weight:600}
select{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-weight:600;max-width:100%}
.swap{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.swap button{padding:12px;border-radius:12px;background:var(--surface-2);font-weight:700;border:1px solid transparent}
.swap button[aria-pressed="true"]{border-color:var(--brass);color:var(--brass);background:color-mix(in oklab,var(--brass) 10%,var(--surface-2))}
.lists{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.lists ul{margin:0;padding:0;list-style:none;display:grid;gap:8px;font-size:14px}
.lists li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:9px;align-items:start}
.lists li .fd{width:20px;height:20px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:#111;margin-top:1px}

/* Tuner */
.tuner{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.tstr{text-align:left;padding:14px;border-radius:14px;border:1px solid var(--line);background:var(--surface);display:grid;gap:6px}
.tstr:hover{border-color:var(--faint)}
.tstr.sel{border-color:var(--brass);background:color-mix(in oklab,var(--brass) 8%,var(--surface))}
.tstr .nt{font-family:var(--f-display);font-weight:800;font-size:34px;line-height:1}
.tstr .hz{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.tstr .kind{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.tstr .wire{height:6px;border-radius:4px}

/* Modal */
.scrim{position:fixed;inset:0;z-index:57;background:color-mix(in oklab,var(--bg) 70%,transparent);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;padding:16px}
.modal{width:100%;max-width:460px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px;display:grid;gap:14px;max-height:100%;overflow:auto}
.modal input[type=text]{width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.slots{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.slots select{width:100%;padding:8px 6px}
.btn{padding:9px 16px;border-radius:10px;font-weight:700;font-size:14px;background:var(--surface-2)}
.btn.primary{background:linear-gradient(135deg,var(--brass),var(--brass-2));color:var(--brass-ink)}
.btn:disabled{opacity:.4;cursor:default}

.kbd{font-family:var(--f-mono);font-size:11px;border:1px solid var(--line);border-bottom-width:2px;padding:0 5px;border-radius:5px;color:var(--muted)}



/* Spela med: boll som landar på nästa ackord */
.pa{position:relative;height:370px;overflow:hidden;border-radius:20px;border:1px solid var(--line);background:radial-gradient(120% 80% at 50% 0%,color-mix(in oklab,var(--brass) 18%,var(--surface)),var(--surface) 70%);touch-action:manipulation}
.pa-msg{position:absolute;top:12px;left:16px;right:16px;display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--muted)}
.pa-msg b{color:var(--text)}
.pa-part{font-size:11px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--brass)}
.pa-ball{position:absolute;left:0;top:0;width:24px;height:24px;margin:-12px 0 0 -12px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,var(--brass-2) 45%,var(--brass));box-shadow:0 0 22px color-mix(in oklab,var(--brass) 80%,transparent);z-index:3;will-change:transform;pointer-events:none}
.pa-trail{position:absolute;inset:0;pointer-events:none;z-index:2}
.pa-track{position:absolute;inset:0;will-change:transform}
.pa-card{position:absolute;top:104px;width:40%;max-width:200px;transform:translateX(-50%);transform-origin:50% 0;display:grid;justify-items:center;gap:8px;will-change:transform,opacity}
.pa-card .pill{font-family:var(--f-display);font-weight:800;font-size:24px;line-height:1.2;padding:4px 18px;border-radius:999px;color:var(--text);transition:background .2s,color .2s}
.pa-card.cur .pill{background:var(--text);color:var(--bg)}
.pa-ball.center{left:50%;z-index:4}
.pa::after{content:"";position:absolute;left:50%;top:84px;bottom:34px;width:2px;margin-left:-1px;background:linear-gradient(var(--brass),transparent);opacity:.25;pointer-events:none}
.pa-card .dg{background:transparent;border:0;padding:0;width:100%}
.pa-card .dg:hover{border:0}
.pa-card .dg .hd,.pa-card .dg .ft{display:none}
.pa-card .dg svg{max-width:150px;margin:0 auto}
.pa-dots{position:absolute;left:16px;right:16px;bottom:14px;display:flex;gap:4px}
.pa-dots i{flex:1;height:7px;border-radius:4px;background:var(--surface-3);transition:background .08s}
.pa-dots i.on{background:linear-gradient(90deg,var(--brass),var(--brass-2))}
.pa-dots i.gap{margin-left:6px}
.pa-count{position:absolute;top:56px;left:0;right:0;text-align:center;font-family:var(--f-display);font-weight:800;font-size:28px;color:var(--brass)}
.pa-hint{position:absolute;left:0;right:0;bottom:30px;text-align:center;font-size:12px;color:var(--muted)}
/* Skank: studsande boll */
.bounce{position:relative;padding-top:58px}
.bounce .pa-ball{width:20px;height:20px;margin:-10px 0 0 -10px;background:radial-gradient(circle at 35% 30%,#fff,var(--leaf-2) 45%,var(--leaf));box-shadow:0 0 20px color-mix(in oklab,var(--leaf) 80%,transparent)}
.bounce .count-row span{position:relative}
.bounce .count-row span.tj{border-bottom:3px solid color-mix(in oklab,var(--leaf) 45%,transparent)}
.bounce .count-row span.on.tj{animation:tjack .25s ease-out}
@keyframes tjack{0%{transform:scale(1.2)}100%{transform:scale(1)}}
@media (max-width:760px){.pa{height:372px}.pa-card{top:96px}}

/* Skank-animation */
.anim{display:grid;gap:14px}
.anim-head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px}
.anim-word{display:flex;align-items:baseline;gap:12px;min-width:0}
.anim-word b{font-family:var(--f-display);font-weight:800;font-size:clamp(34px,7vw,52px);line-height:1;letter-spacing:-.02em}
.anim-word b.tj{background:linear-gradient(135deg,var(--leaf),var(--leaf-2));-webkit-background-clip:text;background-clip:text;color:transparent}
.anim-word b.du{background:linear-gradient(135deg,var(--brass),var(--brass-2));-webkit-background-clip:text;background-clip:text;color:transparent}
.anim-word span{font-size:14px;color:var(--muted);max-width:40ch}
.anim-panels{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:12px}
.panel{background:var(--surface-2);border-radius:14px;padding:10px;display:grid;gap:6px;min-width:0}
.panel svg{width:100%;height:auto;display:block}
.anim-panels .panel:last-child svg{max-width:230px;margin:0 auto}
.panel .cap{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted);font-weight:600}
.panel .cap .state{font-family:var(--f-display);font-weight:800;font-size:13px;letter-spacing:.06em}
.count-row{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:4px}
.count-row span{text-align:center;padding:6px 0;border-radius:9px;font-family:var(--f-display);font-weight:800;font-size:16px;color:var(--faint);background:var(--surface-2);transition:background .08s,color .08s}
.count-row span.on.du{background:linear-gradient(160deg,var(--brass),var(--brass-2));color:var(--brass-ink)}
.count-row span.on.tj{background:linear-gradient(160deg,var(--leaf),var(--leaf-2));color:var(--leaf-ink)}
.emo{font-family:"Noto Color Emoji","Apple Color Emoji","Segoe UI Emoji",sans-serif;filter:drop-shadow(0 4px 4px rgba(0,0,0,.35))}
.chop{animation:chop .42s cubic-bezier(.3,.9,.3,1)}
@keyframes chop{0%{transform:translateY(0)}22%{transform:translateY(56px)}100%{transform:translateY(0)}}
.ring{animation:ring .5s ease-out forwards}
@keyframes ring{0%{opacity:1;transform:translateY(0)}10%{transform:translateY(-1.6px)}20%{transform:translateY(1.6px)}30%{transform:translateY(-1px)}40%{transform:translateY(0)}100%{opacity:0}}
.thud{animation:thud .5s ease-out forwards;transform-box:fill-box;transform-origin:center}
@keyframes thud{0%{opacity:.9;transform:scale(.4)}100%{opacity:0;transform:scale(2.2)}}
.trail{animation:trail .42s ease-out forwards}
@keyframes trail{0%{opacity:0}15%{opacity:.9}100%{opacity:0}}
.press{animation:press .5s ease-out forwards;transform-box:fill-box;transform-origin:center}
@keyframes press{0%{transform:scale(1.25)}100%{transform:scale(1)}}
.strip{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.strip .panel h4{margin:0;font-family:var(--f-display);font-size:15px}
.strip .panel p{font-size:12.5px;color:var(--muted);line-height:1.4}
.strip .num{display:inline-flex;width:22px;height:22px;border-radius:50%;align-items:center;justify-content:center;font-size:12px;font-weight:800;margin-right:6px;color:var(--brass-ink);background:linear-gradient(135deg,var(--brass),var(--brass-2))}
.vidlink{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding:12px 14px;border-radius:14px;border:1px dashed var(--line);font-size:14px;color:var(--muted)}
.vidlink a{color:var(--brass);font-weight:700;text-decoration:none}
.vidlink a:hover{text-decoration:underline}
@media (max-width:760px){
  .anim-panels{grid-template-columns:minmax(0,1fr)}
  .strip{grid-template-columns:minmax(0,1fr)}
  .strip .panel{grid-template-columns:110px minmax(0,1fr);align-items:center;gap:10px}
}

/* Skank-skolan, förenklad */
.sk-intro .lead{max-width:56ch}
.sk-main{position:relative;display:grid;gap:14px;overflow:hidden}
.sk-flash{position:absolute;inset:0;pointer-events:none;border-radius:inherit;box-shadow:inset 0 0 0 3px var(--leaf),inset 0 0 60px color-mix(in oklab,var(--leaf) 35%,transparent);animation:skflash .35s ease-out forwards}
@keyframes skflash{0%{opacity:1}100%{opacity:0}}
.sk-cue{display:grid;justify-items:center;text-align:center;min-height:96px;align-content:center;gap:2px}
.sk-cue b{font-family:var(--f-display);font-weight:800;font-size:64px;line-height:1;letter-spacing:-.02em}
.sk-cue span{font-size:14px;color:var(--muted);font-weight:600}
.sk-cue.idle b{font-size:40px;color:var(--text)}
.sk-cue.count b{color:var(--brass);animation:tjack .3s ease-out}
.sk-cue.du b{color:color-mix(in oklab,var(--brass) 70%,var(--muted))}
.sk-cue.tj b{background:linear-gradient(135deg,var(--leaf),var(--leaf-2));-webkit-background-clip:text;background-clip:text;color:transparent;animation:tjack .25s ease-out}
.sk-cue.tj span{color:var(--leaf)}
.sk-lane{padding-top:66px}
.sk-lane .pa-ball{width:24px;height:24px;margin:-12px 0 0 -12px}
.sk-row{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:4px}
.sk-row span{display:grid;justify-items:center;gap:2px;padding:10px 0 8px;border-radius:12px;background:var(--surface-2);color:var(--faint);transition:background .08s,color .08s}
.sk-row span b{font-family:var(--f-display);font-weight:800;font-size:22px;line-height:1}
.sk-row span small{font-size:10px;font-weight:800;letter-spacing:.04em}
.sk-row span.tj{background:color-mix(in oklab,var(--leaf) 12%,var(--surface-2));color:color-mix(in oklab,var(--leaf) 75%,var(--text))}
.sk-row span.on.du{background:linear-gradient(160deg,var(--brass),var(--brass-2));color:var(--brass-ink)}
.sk-row span.on.tj{background:linear-gradient(160deg,var(--leaf),var(--leaf-2));color:var(--leaf-ink);animation:tjack .25s ease-out}
.sk-hands{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:10px}
.sk-hands .panel p{margin:0;font-size:13px;line-height:1.35;color:var(--text)}
.sk-hands .panel:last-child svg{max-width:200px;margin:0 auto}
.sk-mute{font-size:78px;text-align:center;line-height:1.6}
.sk-ctl{display:grid;grid-template-columns:minmax(0,1fr);gap:12px;border-top:1px solid var(--line);padding-top:14px}
.sk-opt{display:grid;grid-template-columns:minmax(0,1fr);gap:6px;min-width:0}
.sk-lab{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.sk-grip{flex-wrap:wrap}
.sk-tip{margin:0;font-size:13px}
.sk-more>summary{font-size:15px;color:var(--text)}
@media (max-width:760px){
  .sk-cue{min-height:84px}
  .sk-cue b{font-size:56px}
  .sk-row span b{font-size:18px}
  .sk-row span small{font-size:9px}
  .sk-hands{grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:8px}
  .sk-hands .panel{padding:8px}
  .sk-hands .panel p{font-size:12px}
  .sk-hands .panel .cap{font-size:11px}
  .sk-mute{font-size:58px}
}

/* Tjack-skolan */
.sk-mode{justify-self:start}
.sk-mode button{padding:9px 16px;font-size:14px}
.tj-scene svg{width:100%;height:auto;display:block;border-radius:18px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.sk-cue.tjk.hit b{background:linear-gradient(135deg,var(--leaf),var(--leaf-2));-webkit-background-clip:text;background-clip:text;color:transparent;animation:tjack .25s ease-out}
.sk-cue.tjk.x b{color:#ff9a4a;animation:tjack .25s ease-out}
.sk-cue.tjk.x span{color:#ff9a4a}
.sk-cue.tjk.air b{color:var(--faint);font-size:40px}
.tj-flash{box-shadow:inset 0 0 0 3px #ff9a4a,inset 0 0 60px rgba(255,154,74,.35)}
.tj-row span.x{background:rgba(255,154,74,.14);color:#ffb37a}
.tj-row span.air{opacity:.55}
.tj-row span.on.x{background:linear-gradient(160deg,#ff9a4a,#ffb35c);color:#2a1205;animation:tjack .25s ease-out}
.tj-row span.on.du{background:linear-gradient(160deg,var(--leaf),var(--leaf-2));color:var(--leaf-ink)}
.tj-row span.on.air{background:var(--surface-3);color:var(--text);opacity:1}
.tj-left{margin:0;font-size:13px;color:var(--muted);text-align:center}
.tj-how{display:grid;gap:10px;margin-top:12px}
.tj-how p{margin:0;font-size:14px;line-height:1.45}

:root{--wv-band:#2b2348}
.tjl-list{display:grid;gap:8px}
.tjl{display:flex;align-items:center;gap:12px;text-align:left;padding:10px 12px;border-radius:16px;border:1px solid var(--line);background:var(--surface);color:var(--text)}
.tjl svg{flex:none;width:112px;height:36px}
.tjl b{display:block;font-size:15px}
.tjl small{font-size:12px;color:var(--muted)}
.tjl.done small{color:var(--leaf)}
.tjl.rec small{color:#ffb37a}
.tjl[aria-pressed="true"]{border-color:var(--leaf);box-shadow:inset 0 0 0 1px var(--leaf);background:color-mix(in oklab,var(--leaf) 8%,var(--surface))}
.pat-presets{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.sk-ctl>.inline-play{justify-self:start;min-width:220px}

/* Stora skärmar: lite större och bredare, så att appen inte blir en smal remsa */
@media (min-width:1700px){.wrap{max-width:1360px}}
@media (min-width:2400px) and (min-height:1100px){html{zoom:1.25}.wrap{max-width:1500px}}
/* Bred skärm: menyn som en lodrät sidopanel till vänster */
.tab-ic{display:none}
@media (min-width:1400px){
  .app{padding-left:248px}
  header.top{position:fixed;top:0;left:0;bottom:0;width:248px;border-bottom:0;border-right:1px solid var(--line);overflow-y:auto}
  header.top>.wrap.top-in{max-width:none;margin:0;padding:24px 16px;flex-direction:column;align-items:stretch;flex-wrap:nowrap;gap:24px;min-height:100%;box-sizing:border-box}
  .brand{margin-right:0}
  .brand small{max-width:170px}
  .tabs{flex-direction:column;overflow:visible;gap:4px}
  .tabs button{display:flex;align-items:center;gap:12px;padding:12px 14px;font-size:15px;text-align:left}
  .tab-ic{display:block;width:20px;height:20px;flex:none}
  .quick{margin-top:auto;flex-wrap:wrap}
  .quick .lvl{width:100%;justify-content:flex-start}
  .toasts{left:calc(50% + 124px)}
}
/* Dagens lektion och ny startsida */
.home{display:grid;gap:22px;max-width:640px;margin:0 auto;width:100%}
.home-day{display:grid;gap:8px;margin-top:12px}
.home-h1{font-family:var(--f-display);font-weight:800;font-size:clamp(32px,6vw,44px);line-height:1.08;margin:0}
.ls-kicker{font-size:13px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--brass)}
.ls-lead{margin:0;font-size:17px;line-height:1.45;color:var(--muted)}
.home-steps{list-style:none;margin:0;padding:18px;display:grid;gap:12px;background:var(--surface);border-radius:20px;border:1px solid var(--line)}
.home-steps li{display:flex;align-items:center;gap:12px;font-size:16px;color:var(--muted)}
.home-steps li>span{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:14px;box-shadow:inset 0 0 0 2px var(--line)}
.home-steps li.done>span{background:var(--leaf);color:var(--leaf-ink);box-shadow:none}
.home-steps li.done>span svg{width:16px;height:16px}
.home-steps li.cur{color:var(--text);font-weight:700}
.home-steps li.cur>span{background:var(--brass);color:var(--brass-ink);box-shadow:none}
.ls-btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;height:60px;padding:0 24px;border-radius:30px;background:linear-gradient(135deg,var(--brass),var(--brass-2));color:var(--brass-ink);font-weight:800;font-size:18px;border:0}
.ls-btn svg{width:18px;height:18px}
.ls-btn.big{height:66px;font-size:19px;width:100%}
.ls-btn.ghost{background:var(--surface-2);color:var(--text)}
.ls-link{background:none;border:0;color:var(--muted);font-weight:600;font-size:15px;padding:12px 6px;text-decoration:underline;text-underline-offset:3px}
.home-more>summary{font-size:15px}
.ls{position:fixed;inset:0;z-index:65;background:var(--bg);overflow-y:auto;display:flex;flex-direction:column;padding:max(16px,var(--safe-area-inset-top,env(safe-area-inset-top,0px))) max(20px,var(--safe-area-inset-right,env(safe-area-inset-right,0px))) max(24px,var(--safe-area-inset-bottom,env(safe-area-inset-bottom,0px))) max(20px,var(--safe-area-inset-left,env(safe-area-inset-left,0px)))}
.ls-top{display:flex;align-items:center;gap:14px;max-width:640px;width:100%;margin:0 auto}
.ls-x{flex:none;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--surface);color:var(--muted);border:0}
.ls-x svg{width:18px;height:18px}
.ls-prog{flex:1;display:flex;gap:6px}
.ls-prog i{flex:1;height:8px;border-radius:4px;background:var(--surface-2)}
.ls-prog i.done{background:var(--leaf)}
.ls-prog i.cur{background:var(--brass)}
.ls-body{flex:1;display:flex;flex-direction:column;gap:18px;max-width:640px;width:100%;margin:22px auto 0}
.ls-h1{font-family:var(--f-display);font-weight:800;font-size:clamp(30px,6vw,40px);line-height:1.1;margin:4px 0 0}
.ls-dg{display:flex;justify-content:center}
.ls-dg .dg{width:min(280px,80vw);padding:14px}
.ls-dg .dg .nm{font-size:28px}
.ls-lines{list-style:none;margin:0;padding:0;display:grid;gap:10px;font-size:17px;line-height:1.35}
.ls-lines li{display:flex;align-items:center;gap:12px}
.ls-lines li>span{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:14px;color:#15122a}
.ls-actions{margin-top:auto;display:flex;gap:10px;padding-top:8px}
.ls-actions .ls-btn:last-child{flex:1}
.ls-actions.col{flex-direction:column}
.ls-links{display:flex;justify-content:space-between;margin-top:auto}
.ls-tip{margin:0;padding:14px 16px;border-radius:16px;background:var(--surface);font-size:16px;line-height:1.4}
.ls-pair{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:10px;align-items:center}
.ls-pair>span{font-size:24px;color:var(--muted)}
.ls-done{align-items:center;text-align:center}
.ls-stars{width:220px;fill:#ffd23f;margin-top:24px}
.ls-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;width:100%}
.ls-stats>div{background:var(--surface);border-radius:16px;padding:14px 0;display:grid;gap:2px}
.ls-stats b{font-family:var(--f-display);font-size:24px}
.ls-stats span{font-size:13px;color:var(--muted)}
.ls-next{width:100%;box-sizing:border-box;text-align:left;background:var(--surface);border-radius:16px;padding:14px 16px;display:grid;gap:2px}
.ls-next small{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.ls-next b{font-size:17px}
.ls-done .ls-actions{width:100%}
.ls-back{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + var(--safe-area-inset-bottom,env(safe-area-inset-bottom,0px)));z-index:45;display:inline-flex;align-items:center;gap:8px;height:50px;padding:0 20px;border-radius:25px;border:0;background:linear-gradient(135deg,var(--brass),var(--brass-2));color:var(--brass-ink);font-weight:800;box-shadow:0 10px 30px -8px rgba(0,0,0,.7)}
.ls-back svg{width:16px;height:16px}
@media (max-width:760px){.ls-back{bottom:calc(150px + var(--safe-area-inset-bottom,env(safe-area-inset-bottom,0px)))}}
.gd-six{grid-template-columns:repeat(3,minmax(0,1fr))}
.gd-deg{display:grid;gap:4px;text-align:center}.gd-deg small{color:var(--muted);font-size:12px;font-weight:600}
.gd-chip{display:grid;place-items:center;align-content:center;gap:4px;min-height:120px;border:1px dashed var(--line);border-radius:12px;font-family:var(--f-display);font-size:26px;font-weight:700}.gd-chip small{font-family:var(--f-body);font-size:11px;font-weight:500;color:var(--muted)}
.gd-prog{display:grid;gap:8px;padding-top:12px;border-top:1px solid var(--line)}
.gd-next{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.gd-next>b{min-width:40px;font-family:var(--f-display);font-size:22px}
.gd-beats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}.gd-beats div{display:grid;justify-items:center;padding:10px 0;border:2px solid var(--leaf);border-radius:10px;font-size:13px;font-weight:600}.gd-beats div b{font-family:var(--f-display);font-size:26px}.gd-beats div.on{background:var(--leaf);color:var(--leaf-ink)}
.rtab{display:grid;gap:2px;overflow-x:auto;font-variant-numeric:tabular-nums}
.rtab-row{display:flex;align-items:center;min-width:max-content;background:linear-gradient(var(--faint),var(--faint)) center/100% 1px no-repeat}
.rtab-row b{width:20px;flex:none;font-size:12px;color:var(--muted);background:var(--surface)}
.rtab-row span{width:34px;flex:none;display:grid;place-items:center;height:22px}
.rtab-row i{font-style:normal;font-weight:700;font-size:13px;width:22px;height:22px;line-height:22px;text-align:center;border-radius:11px;background:var(--brass);color:var(--brass-ink)}
.bib{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.bib-c{display:grid;gap:6px;justify-items:start;text-align:left;padding:18px;border-radius:20px;background:var(--surface);border:1px solid var(--line);color:var(--text);min-height:130px}
.bib-c svg{width:28px;height:28px}
.bib-c b{font-size:17px}
.bib-c span{font-size:13px;color:var(--muted)}
.bib-c:hover{border-color:var(--brass)}
/* Lugn rytmvy */
.rc{display:grid;gap:14px}
.rc-top{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.rc-chord{display:grid;gap:2px;min-width:90px}
.rc-chord small{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.rc-chord b{font-family:var(--f-display);font-size:34px;line-height:1}
.rc-word{font-family:var(--f-display);font-weight:800;font-size:clamp(34px,8vw,52px);line-height:1;color:var(--leaf)}
.rc-word.tj{color:#ff9a4a}
.rc-word.rest{color:var(--faint)}
.beat.tj .a{color:#ff9a4a}
.beat.tj.cur{background:linear-gradient(160deg,#ff9a4a,#ffb35c);color:#2a1205}
.beat .a svg{width:20px;height:18px}
.mini-pat{flex:none;display:grid;grid-template-columns:repeat(8,12px);gap:2px;font-weight:800;font-size:14px;color:var(--leaf);text-align:center}
.mini-pat i{font-style:normal}
.mini-pat i.x{color:#ff9a4a}
.mini-pat i.r{color:var(--faint)}
.song.can{border-color:color-mix(in oklab,var(--leaf) 40%,transparent)}
/* Kväll: lugnare och mer exklusivt. Platta ytor, inga neonglöd, serif i rubrikerna */
:root:is([data-skin="ceder"],[data-skin="valnot"],[data-skin="sol"]) body{background:var(--bg)}
:root:is([data-skin="ceder"],[data-skin="valnot"],[data-skin="sol"]) h1,:root:is([data-skin="ceder"],[data-skin="valnot"],[data-skin="sol"]) h2,:root:is([data-skin="ceder"],[data-skin="valnot"],[data-skin="sol"]) h3,
:root:is([data-skin="ceder"],[data-skin="valnot"],[data-skin="sol"]) .home-h1,:root:is([data-skin="ceder"],[data-skin="valnot"],[data-skin="sol"]) .ls-h1{font-weight:700;letter-spacing:-.01em}
:root:is([data-skin="ceder"],[data-skin="valnot"],[data-skin="sol"]) .card{background:var(--surface);border-color:var(--line)}
:root:is([data-skin="ceder"],[data-skin="valnot"],[data-skin="sol"]) .play,:root:is([data-skin="ceder"],[data-skin="valnot"],[data-skin="sol"]) .fab,:root:is([data-skin="ceder"],[data-skin="valnot"],[data-skin="sol"]) .ls-btn,:root:is([data-skin="ceder"],[data-skin="valnot"],[data-skin="sol"]) .ls-back,:root:is([data-skin="ceder"],[data-skin="valnot"],[data-skin="sol"]) .gh-launch{box-shadow:none}
:root:is([data-skin="ceder"],[data-skin="valnot"],[data-skin="sol"]) .play{border-radius:999px;font-weight:600}
:root:is([data-skin="ceder"],[data-skin="valnot"],[data-skin="sol"]) .ls-btn:not(.ghost){background:var(--cv-btn);color:var(--cv-btn-text)}
:root:is([data-skin="ceder"],[data-skin="valnot"],[data-skin="sol"]) .free-cover{position:relative;overflow:hidden;isolation:isolate;display:flex;flex-direction:column;justify-content:flex-end;gap:6px;background:var(--cv-bg);color:var(--cv-text);border-radius:14px;padding:24px 28px}
.vinyl-deck{display:none}
.home-day{display:block;margin-top:8px;border-radius:14px;overflow:hidden;background:var(--cv-bg)}
.scene{position:relative;aspect-ratio:1/.8;overflow:hidden;background:#2a2014}
.scene-inner{position:absolute;left:0;right:0;top:0;aspect-ratio:600/1166;transform:translateY(-23.5%)}
.scene-inner img{display:block;width:100%;height:100%}
.scene-motes{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.scene-vol{position:absolute;left:36.5%;top:61.2%;font-family:var(--f-body);font-size:clamp(7px,2vw,10px);font-weight:600;color:#f3e4c0;opacity:.85}
.home-day{position:relative}
:root.ls-rise .ls{animation:ls-rise .7s cubic-bezier(.2,.8,.2,1)}
@keyframes ls-rise{from{transform:translateY(100%)}to{transform:none}}
.alt-seg{margin-bottom:12px}
.alt-now{margin:0 0 8px;font-size:15px;color:var(--muted)}
.alt-now b{color:var(--text);font-size:18px}
.alt-more{margin-top:12px}
.alt-more summary{cursor:pointer;font-weight:700;font-size:14px}
.alt-row{display:grid;gap:6px;margin-top:12px}
.alt-row>span{font-size:13px;font-weight:700;color:var(--muted)}
/* Bytescoachen (bx) */
.bx{display:grid;gap:14px}
.bx .section-head{margin-bottom:0}
.bx-head{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px}
.bx-pair{display:flex;align-items:center;gap:10px;font-family:var(--f-display,inherit);font-size:26px}
.bx-pair span{color:var(--muted);font-size:20px}
.bx-lvl{display:inline-flex;align-items:center;gap:3px;font-size:12px;font-weight:700;color:var(--muted);margin-right:auto}
.bx-lvl i{width:8px;height:8px;border-radius:50%;background:var(--surface-3)}
.bx-lvl i:last-of-type{margin-right:5px}
.bx-lvl.l1 i:nth-child(-n+1),.bx-lvl.l2 i:nth-child(-n+2),.bx-lvl.l3 i:nth-child(-n+3){background:var(--leaf)}
.bx-lvl.l3 i:nth-child(-n+3){background:var(--ember)}
.bx-grid{display:grid;gap:16px}
@media (min-width:760px){.bx-grid{grid-template-columns:minmax(240px,330px) minmax(0,1fr);align-items:start}.bx-side{grid-column:2;grid-row:1/span 2}.bx-hand{grid-column:1;grid-row:2}}
.bx-stage{display:grid;gap:10px;justify-items:center}
.bx-stage svg{width:100%;max-width:330px;display:block;user-select:none}
.lefty .bx-stage svg{transform:scaleX(-1)}
.lefty .bx-stage svg text{transform-box:fill-box;transform-origin:center;transform:scaleX(-1)}
.bx-pulse{animation:cc-pulse 1.1s ease-in-out infinite}
@keyframes bx-pulse{50%{opacity:.25}}
.bx-hand{display:grid;gap:8px;justify-items:center;width:100%;max-width:330px;justify-self:center}
.bx-hand video{width:100%;aspect-ratio:16/10;object-fit:cover;border-radius:14px;background:#0005}
.lefty .bx-hand video{transform:scaleX(-1)}
.bx-side{display:grid;gap:14px;align-content:start}
.bx-steps{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.bx-steps li{border-radius:12px;background:var(--surface-2);border:1px solid transparent}
.bx-steps li.on{border-color:color-mix(in oklab,var(--leaf) 60%,transparent);background:color-mix(in oklab,var(--leaf) 10%,var(--surface-2))}
.bx-steps button{display:flex;align-items:center;gap:10px;width:100%;padding:9px 12px;background:none;border:0;color:inherit;text-align:left;font:inherit}
.bx-steps button span{width:22px;height:22px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;background:var(--surface-3);color:var(--muted)}
.bx-steps li.on button span{background:var(--leaf);color:var(--leaf-ink)}
.bx-steps li.done button span{background:color-mix(in oklab,var(--leaf) 35%,var(--surface-3));color:var(--text)}
.bx-steps p{margin:0;padding:0 12px 11px 44px;font-size:14px;line-height:1.45}
.bx-ctrl{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.bx-play{height:46px}
.bx-fingers{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.bx-fingers li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:start;padding:8px 10px;border-radius:12px;transition:background .2s}
.bx-fingers li.bx-now{background:var(--surface-2)}
.bx-fingers .fd{width:24px;height:24px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:#111;margin-top:1px}
.bx-fingers p{margin:2px 0 0;font-size:14px;color:var(--muted);line-height:1.4}
.bx-verb{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;padding:2px 7px;border-radius:999px;background:var(--surface-3);color:var(--muted)}
.t-stay .bx-verb{background:color-mix(in oklab,var(--brass) 22%,var(--surface-3));color:var(--text)}
.t-slide .bx-verb{background:color-mix(in oklab,var(--leaf) 22%,var(--surface-3));color:var(--text)}
.bx-tips{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.bx-tips div{display:grid;gap:3px;padding:10px 12px;border-radius:12px;background:var(--surface-2);font-size:14px;line-height:1.45}
.bx-tips b{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--brass)}
.bx-compact{padding:14px}
.bx-compact .bx-pair{font-size:20px}
.knep{display:grid;gap:10px;margin:12px 0 0;padding-left:20px;font-size:14px;line-height:1.5}
.knep b{color:var(--text)}
/* Kort övergång in i dagens lektion (ersätter startvideon) */
.scene-inner img{transition:transform .55s cubic-bezier(.5,0,.2,1),filter .55s}
.scene.zoom .scene-inner img{transform:scale(1.35);transform-origin:78% 52%;filter:brightness(1.15)}
.sleeve{position:relative;display:grid;gap:12px;padding:14px 20px 18px;background:var(--surface);border-top:1px solid color-mix(in oklab,var(--surface) 70%,#fff);box-shadow:0 -8px 16px rgba(0,0,0,.35)}
.sleeve .home-h1{font-size:clamp(38px,10vw,48px);line-height:1}
.sleeve .home-steps{padding:0;background:transparent;border:0;gap:6px}
.sleeve .home-steps li{font-size:15px}
.sleeve .ls-btn.big{margin-top:2px}
:root:is([data-skin="ceder"],[data-skin="valnot"],[data-skin="sol"]) .vinyl-deck{display:block;position:absolute;z-index:-1;right:0;top:0;width:380px;height:auto;font-family:var(--f-body)}
:root:is([data-skin="ceder"],[data-skin="valnot"],[data-skin="sol"]) .vd-spin{transform-origin:129px 129px;animation:vinyl-spin 20s linear infinite}
:root:is([data-skin="ceder"],[data-skin="valnot"],[data-skin="sol"]) .free-cover{min-height:210px}
:root:is([data-skin="ceder"],[data-skin="valnot"],[data-skin="sol"]) .free-cover .vinyl-deck{width:260px}
:root:is([data-skin="ceder"],[data-skin="valnot"],[data-skin="sol"]) .free-cover .vd-plate{display:none}
@media (prefers-reduced-motion:reduce){:root:is([data-skin="ceder"],[data-skin="valnot"],[data-skin="sol"]) .vd-spin{animation:none}}
@keyframes vinyl-spin{to{transform:rotate(360deg)}}
:root:is([data-skin="ceder"],[data-skin="valnot"],[data-skin="sol"]) .free-cover .ls-kicker{color:var(--cv-text)}
:root:is([data-skin="ceder"],[data-skin="valnot"],[data-skin="sol"]) .free-cover .home-h1{font-size:46px;line-height:.95;color:var(--cv-text);max-width:9em}
:root:is([data-skin="ceder"],[data-skin="valnot"],[data-skin="sol"]) .bottomnav button[aria-current="page"]{color:var(--brass);background:transparent}
/* Teman */
.skins{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.skin{text-align:left;border-radius:14px;padding:12px;border:2px solid transparent;display:grid;gap:8px;color:#fff}
.skin[aria-pressed="true"]{border-color:var(--text)}
.skin .sw{display:flex;gap:4px}
.skin .sw i{width:22px;height:22px;border-radius:50%;display:block;box-shadow:0 0 0 2px rgba(0,0,0,.15)}
.skin b{font-family:var(--f-display);font-size:16px}
.skin small{font-size:12px;opacity:.75}


/* Guitar Hero-läge */
.gh{--bg:#0c0a1a;--surface:#15122a;--surface-2:#1e1a3a;--surface-3:#29234c;--line:#3a3366;--text:#f4f1ff;--muted:#aba4d4;--faint:#8a84b8;--f1:#5ab8ff;--f2:#2ee6b8;--f3:#ffd23f;--f4:#ff5ca8;color-scheme:dark;position:fixed;inset:0;z-index:58;display:grid;grid-template-rows:auto auto minmax(0,1fr) auto;background:radial-gradient(120% 70% at 50% 0%,#2a1650,#0b0818 70%);color:#f4f1ff;padding-top:var(--safe-area-inset-top,env(safe-area-inset-top,0px));padding-bottom:var(--safe-area-inset-bottom,env(safe-area-inset-bottom,0px));overscroll-behavior:contain}
.gh-top{display:flex;align-items:center;gap:12px;padding:10px max(14px,var(--safe-area-inset-right,env(safe-area-inset-right,0px))) 6px max(14px,var(--safe-area-inset-left,env(safe-area-inset-left,0px)))}
.gh-x{width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.1);font-size:24px;line-height:1;color:#fff;flex:none}
.gh-title{min-width:0;flex:1;display:grid}
.gh-title b{font-family:var(--f-display);font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gh-title span{font-size:12px;color:#aba4d4}
.gh-score{display:flex;align-items:center;gap:8px}
.gh-score b{font-size:22px;font-weight:700}
.gh-mult{font-family:var(--f-display);font-weight:800;font-size:15px;padding:3px 9px;border-radius:999px;background:rgba(255,255,255,.12)}

/* =====================================================================
   DESIGNSYSTEM · NylonGitarr Studio
   Färgroller (gäller båda skinnen):
     --ember  = huvudhandling: Starta, Kör igång, Slå an. En per vy.
     --text   = påslaget val (chips, vyknappar) och Stoppa.
     --leaf   = klart / rätt / framsteg.
     --sky    = information och grepp.
   Former: kort 20px, kontroller 14px, piller 999px. Avstånd 8/12/18/24.
   ===================================================================== */
:root{--ds-r:20px;--ds-r-ctl:14px;--ds-shadow:0 1px 0 rgba(255,255,255,.5) inset,0 10px 28px -20px rgba(60,30,10,.45)}
.card{border-radius:var(--ds-r);box-shadow:var(--ds-shadow)}
.ds-page{display:grid;gap:24px}
.ds-eyebrow{font-size:12px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:0 0 10px}
h2.page{font-family:var(--f-display);font-size:clamp(28px,3.4vw,38px);font-weight:800;line-height:1.08;letter-spacing:-.01em}
h2.page + .lead,.page + .lead{margin-top:6px}
.lead{font-size:16px;line-height:1.45}
/* Huvudknapp */
.play,:root:is([data-skin="ceder"],[data-skin="valnot"],[data-skin="sol"]) .play{background:var(--ember);color:var(--ember-ink);font-weight:700;box-shadow:0 10px 24px -14px var(--ember)}
.play:hover{filter:brightness(1.06)}
.play.stop,:root:is([data-skin="ceder"],[data-skin="valnot"],[data-skin="sol"]) .play.stop{background:var(--text);color:var(--bg);box-shadow:none}
.fab{background:var(--text);color:var(--bg)}
.btn{border-radius:var(--ds-r-ctl)}
.btn.primary,.ls-btn{background:var(--ember);color:var(--ember-ink)}

/* Val: segment och chips */
.seg{border-radius:var(--ds-r-ctl);padding:4px;gap:2px}

.seg button[aria-pressed="true"]{background:var(--surface);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.12),0 0 0 1px var(--line)}
.chip.on{color:var(--bg);background:var(--text);border-color:var(--text)}

/* Spelkort och val-kort */
.game{border-radius:var(--ds-r);padding:18px;transition:border-color .12s,transform .12s}
.game:hover{transform:translateY(-1px);border-color:color-mix(in oklab,var(--ember) 40%,transparent)}

/* Rytm: ordet för slaget, och lugn text innan start */
.rc-word{color:var(--ember)}
.rc-word.idle{font-size:20px;font-weight:700;color:var(--faint);align-self:center}
/* Bibliotek */
.bib-group{display:grid}
.bib{grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.bib-c{display:flex;align-items:center;gap:16px;min-height:0;padding:18px 18px 18px 16px;border-radius:var(--ds-r);box-shadow:var(--ds-shadow);transition:transform .12s,border-color .12s}

.bib-ic{flex:none;width:52px;height:52px;border-radius:16px;display:grid;place-items:center;color:var(--c);background:color-mix(in oklab,var(--c) 13%,var(--surface))}
.bib-ic svg{width:26px;height:26px}
.bib-tx{display:grid;gap:2px;min-width:0;flex:1}

.bib-c .bib-go{width:20px;height:20px;color:var(--faint);flex:none}
.bib-c:hover .bib-go{color:var(--c)}
/* Följder och riff: rimligt stora diagram */
.gd-six{grid-template-columns:repeat(auto-fill,minmax(120px,170px))!important;justify-content:start}
.gd-prog .diagrams{grid-template-columns:repeat(auto-fill,minmax(110px,150px))!important;justify-content:start}

  .bib{grid-template-columns:minmax(0,1fr)}

  .gd-prog .diagrams{grid-template-columns:repeat(4,minmax(0,1fr))!important}
  h2.page{font-size:28px}
}

/* =====================================================================
   LUGN LAYOUT · färre rutor
   Sektioner skiljs med luft och en tunn linje, inte med kort.
   Rutor finns bara där de bär något: bollrutan, handvideon, Idag-kortet,
   dialoger och knappar.
   ===================================================================== */

.card.hand3d{border-top:0;padding:0;border-radius:18px;overflow:hidden;background:var(--surface)}

/* Ackorddiagram: bara greppet, ingen ram */
.dg{background:transparent;border:0;border-radius:14px;padding:8px 6px 6px}
.dg:hover{border:0;background:color-mix(in oklab,var(--text) 4%,transparent)}
.dg.sel{border:0;background:color-mix(in oklab,var(--ember) 9%,transparent)}
.dg.sel .nm{color:var(--ember)}

.beat.cur,.beatcard .beat.cur{background:color-mix(in oklab,var(--ember) 13%,transparent);box-shadow:none}

.game[aria-pressed="true"],.tstr.sel{background:color-mix(in oklab,var(--ember) 9%,transparent);border-color:transparent;box-shadow:none}
.game[aria-pressed="true"] b{color:var(--ember)}

.song.sel{border-color:transparent}
.song.can{border-color:transparent}

.card,:root:is([data-skin="ceder"],[data-skin="valnot"],[data-skin="sol"]) .card,.beatcard,.practice .beatcard{background:transparent;border-color:transparent;border-top-color:color-mix(in oklab,var(--line) 65%,transparent);box-shadow:none}

}

.bar.out{opacity:.38}

.rate-seg button{padding:8px 11px;font-variant-numeric:tabular-nums}
.mbar .rate-seg{flex:none}
.skins{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}

/* =====================================================================
   Mindre AI-look: en sångbok, inte ett mobilspel
   Lugna ytor och en accentfärg. Rikedomen ligger i 3D-handen på Idag.
   ===================================================================== */
:root{--f-serif:"Fraunces",Georgia,"Times New Roman",serif}
/* En accentfärg: andra färgen i alla gradienter blir samma som den första, så ytorna blir enfärgade */
:root[data-skin][data-skin]{--brass-2:var(--brass)}
/* Rubriker i serif */
h1,h2,h3,.home-h1,.ls-h1,h2.page,.h2-mission h2,.fb-t b{font-family:var(--f-serif)!important;font-weight:600!important;letter-spacing:-.012em;font-optical-sizing:auto}
/* Små rubriker i vanlig skrift, inte VERSALER */
.label,.beat .t,.dg .badge,.tip .mark,.tstr .kind,.pa-part,.sk-lab,.ls-kicker,.ls-next small,.rc-chord small,.bx-verb,.bx-tips b,.gh-combo span,.gh-tag,.gh-next span,.bs-tip-k,.vb-lab,.h2-kick,.h2-steps .star,.ds-eyebrow,.h2-week-k{text-transform:none!important;letter-spacing:0!important;font-weight:700}
/* Ingen text i gradient */
.chordnow .big,.anim-word b.du{background:none;color:var(--brass)}
.anim-word b.tj,.sk-cue.tj b,.sk-cue.tjk.hit b{background:none;color:var(--leaf)}
.gh-combo b{background:none;color:var(--ember)}
/* Fyllda markeringar: en färg, ingen gradient */
.beat.cur,.bar.cur,.pa-dots i.on,.count-row span.on.du,.sk-row span.on.du,.plan-dots i.cur,.xpbar i{background:var(--brass)}
.count-row span.on.tj,.sk-row span.on.tj,.tj-row span.on.du,.plan-dots i.done,.xpbar.goal i,.h3-gauge .hp-fill,.h3-gauge .hp-fill.hot{background:var(--leaf)}
.tj-row span.on.x,.beat.tj.cur{background:#ff9a4a}
/* Inga glödande fläckar, glödskuggor eller pulser som aldrig slutar */
:root[data-skin][data-skin][data-skin] body{background:var(--bg)}
.play,:root:is([data-skin="ceder"],[data-skin="valnot"],[data-skin="sol"]) .play,.h2-go{box-shadow:none!important}
.plan-dots i.cur,.step.cur .node,.bx-pulse{animation:none}

/* ---------- Idag ---------- */
.h2-greet .ls-kicker{color:var(--muted);font-size:14px;font-weight:600}
.h2-hero{display:grid;gap:22px;background:transparent;border:0;border-radius:0;box-shadow:none;overflow:visible}
.h2-hand{position:relative;margin:0;border-radius:18px;overflow:hidden;background:#000;aspect-ratio:720/456}

.h2-hand figcaption b{font-family:var(--f-serif);font-weight:600;font-size:22px;line-height:1.1}
.h2-hand figcaption span{font-size:13px;color:rgba(255,255,255,.7)}
.h2-hand figcaption b span{font-family:var(--f-body);font-weight:400;font-size:.8em;color:rgba(255,255,255,.6);margin:0 2px}
.brand h1{font-family:"Corinthia","Snell Roundhand",cursive!important;font-weight:700!important;font-size:35px!important;line-height:1.05;letter-spacing:0;white-space:nowrap;color:var(--text);margin:0}
.brand>div{display:grid;gap:2px}
.brand>:first-child{flex:none}
@media (max-width:480px){.brand h1{display:block!important;font-size:30px!important}.brand{flex:0 1 auto;gap:6px}}
@media (max-width:380px){.brand h1{font-size:27px!important}}
.h2-mission{padding:0!important;gap:14px}
.h2-mission h2 em{color:inherit}
.h2-steps .cur{background:transparent}
.h2-steps .star{background:none;padding:0}
.h2-go{border-radius:14px!important}
.h2-extra{gap:0}
.h2-week{border:0;border-top:1px solid var(--line);border-radius:0;background:transparent;padding:14px 0}
.h2-week:last-child{border-bottom:1px solid var(--line)}
.h2-week-k{color:var(--muted);font-size:13px}
.h2-week-bar{height:4px;background:var(--surface-3)}
@media (min-width:1000px){
  .h2-main{grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:28px 48px}
  .h2-hero{grid-column:1/-1;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr)!important;gap:40px;align-items:center}

  .h2-hand figcaption b{font-size:19px}
}

en the changes.", "G-dur och What's Up": "G major and What's Up", "Ganska jämnt, med lite gung.": "Fairly even, with a bit of swing.", "Gitarren kompar ackorden. Folk-kompet passar nästan allt: ner på 1, ner-upp på 2, upp på &-et efter 3 och ner-upp på 4.": "The guitar comps the chords. The folk comp fits almost everything: down on 1, down-up on 2, up on the & after 3 and down-up on 4.", "Gitarren är stämd": "The guitar is in tune", "Gitarrljud": "Guitar sound", "Glid i stället för att lyfta.": "Slide instead of lifting.", "Glider längs": "Slides along", "Grepp": "Chord shape", "Grepp och namn": "Shapes and names", "Grepp, komp och reggae-skank för klassisk gitarr": "Chords, comping and reggae skank for classical guitar", "Greppbräda": "Fretboard", "Greppbräda · sett uppifrån när gitarren ligger i knät": "Fretboard · seen from above when the guitar is in your lap", "Greppen i låten": "Chords in the song", "Greppen och tips": "Chords and tips", "Grundregeln:": "The basic rule:", "Grym takt!": "Great timing!", "Guitar Hero-läge": "Guitar Hero mode", "Gung": "Swing", "Gör det två gånger. A-strängens band 1 är bluesnoten.": "Do it twice. Fret 1 on the A string is the blue note.", "Gör en gång, tar 15 sekunder": "Do it once, takes 15 seconds", "Gör en långsammare version …": "Make a slower version …", "Gör jag rätt?": "Am I doing it right?", "Gör utmaningen en gång om dagen för samma par och se siffran växa.": "Do the challenge once a day for the same pair and watch the number grow.", "Halsen ligger som när du håller gitarren. Nästa grepp faller ner och landar på rätt band när ackordet byts. Slå an när slagen når linjen i ljudhålet.": "The neck lies as when you hold the guitar. The next shape falls down and lands on the right fret when the chord changes. Strum when the strums reach the line in the sound hole.", "Handkanten landar på strängarna på 2 och 4. Kort och dovt.": "The edge of the hand lands on the strings on 2 and 4. Short and dull.", "Handklappen hör hemma på 2 och 4, samma som virveln.": "The hand clap belongs on 2 and 4, same as the snare.", "Hela kompet": "The whole comp", "Hela låten": "The whole song", "Hela låten går C, Em, F, G med två slag per ackord, och basen går uppåt C–E–F–G. Byt redan på 2& så hinner du. Använd Fmaj7 om F känns tungt. Ackorden är framtagna ur inspelningen, så säg till om något låter fel.": "The whole song goes C, Em, F, G with two beats per chord, and the bass walks up C–E–F–G. Change already on 2& so you make it. Use Fmaj7 if F feels heavy. The chords were taken from the recording, so tell me if something sounds wrong.", "Hela låten med poäng, x2–x4 för långa serier.": "The whole song with points, x2–x4 for long streaks.", "Hela tvåveckorsplanen är klar!": "The whole two-week plan is done!", "Hi-hatten håller tempot jämnt. Lägg den på varje åttondel: alla siffror och alla &.": "The hi-hat keeps the tempo even. Put it on every eighth: all numbers and all &.", "Hittade inga ackord än. Ackorden ska stå på egna rader eller inom [ ] i texten.": "Found no chords yet. The chords should be on their own lines or inside [ ] in the text.", "Hoppa över": "Skip", "Hoppar en sträng, till": "Skips a string, to", "Hur funkar en takt?": "How does a bar work?", "Hur många byten hinner du på 60 sekunder? Slå ditt eget rekord varje dag.": "How many changes can you make in 60 seconds? Beat your own record every day.", "Huvudriffet flyttat en sträng upp.": "The main riff moved up one string.", "Hämta framsteg": "Get progress", "Håll Am-greppet och plocka en sträng i taget.": "Hold the Am shape and pick one string at a time.", "Håll Em-greppet hela tiden. Mjukt och drömskt.": "Hold the Em shape the whole time. Soft and dreamy.", "Håll Em. Slå ner på 1 så att det klingar, och låt handkanten landa på 2. Upp på &.": "Hold Em. Strike down on 1 so it rings, and let the edge of the hand land on 2. Up on &.", "Hög": "High", "Hör ackordet": "Hear the chord", "Hör en skank": "Hear a skank", "Hör ett tjack": "Hear a chop",  or the old synthetic one. Recordings: tonejs-instruments (CC-BY 3.0).", "Inställningar": "Settings", "Introt använder samma ankargrepp som Wonderwall. I versen skiftar du mellan öppna grepp, och bytet G till D till C kräver att du förbereder nästa grepp redan på 4&.": "The intro uses the same anchor shape as Wonderwall. In the verse you switch between open shapes, and the change G to D to C needs you to prepare the next shape already on 4&.", "JAG ÄR STÖRRE NU": "I'M BIGGER NOW", "Ja, ersätt mina framsteg": "Yes, replace my progress", "Ja, läs in": "Yes, load it", "Jag kan det nu ✓": "I can do it now ✓", "Jag trycker": "I'm pressing", "Jag är redo": "I'm ready", "Jamma": "Jam", "Jamma igen": "Jam again", "Jämnhet": "Steadiness", "Jämnt och gungande. Lillfingret tar band 4.": "Even and swinging. The little finger takes fret 4.", "Kalibrera mikrofonen": "Calibrate the microphone", "Kantslaget på 3, samtidigt som bastrumman, är klassisk reggae.": "The rim shot on 3, together with the kick drum, is classic reggae.", "Kantslaget är en mjukare virvel, på 2 och 4.": "The rim shot is a softer snare, on 2 and 4.", "Klar": "Done", "Klar för idag": "Done for today", "Klar nylon": "Clean nylon", "Klar, visa feedback": "Done, show feedback", "Klar, visa vad jag spelade": "Done, show what I played", "Klara 8 takter så bockas nivån av.": "Get through 8 bars and the level is ticked off.", "Klara dag 1 i tvåveckorsplanen": "Finish day 1 of the two-week plan", "Klara hela tvåveckorsplanen": "Finish the whole two-week plan", "Klara minst 12 byten på en minut.": "Make at least 12 changes in one minute.", "Klara minst 15 byten på en minut.": "Make at least 15 changes in one minute.", "Klart! Appen startar om med din säkerhetskopia.": "Done! The app restarts with your backup.", "Klart! Stämmaren och greppkollen är nu inställda efter din gitarr och ditt rum.": "Done! The tuner and chord check are now set for your guitar and your room.", "Klassiskt blues- och lägereldsackord utan barré. L en, delarna och capo. Texten sparas inte.": "Copy a chord sheet (for example from Ultimate Guitar) and paste it here. The app picks out the chords, the parts and the capo. The text isn't saved.", "Kopiera min kod": "Copy my code", "Korta utmaningar som tränar öra, grepp och byten. Välj ett spel.": "Short challenges that train your ear, chord shapes and changes. Choose a game.", "Kos­källa": "Cow­bell", "Koskällan låter bäst sparsamt, på 1 och ett par ställen till.": "The cowbell sounds best sparingly, on 1 and a couple more places.", "Koskällan sparsamt, på ett par &-rutor.": "The cowbell sparingly, on a couple of & boxes.", "Känn igen greppen på bild eller ljud.": "Recognise the chords from picture or sound.", "Känn igen greppet på bild eller ljud. Rätt i rad ger combo-bonus.": "Recognise the chord from picture or sound. Correct in a row gives a combo bonus.", "Känsla": "Feel", "Känsla: trumset, gung och mänskligt": "Feel: drum kit, swing and human", "Känslighet": "Sensitivity", "Kör": "Go", "Kör Rytmbanan": "Play the Rhythm lane", "Kör Skank-skolan i åtta takter utan att stoppa.": "Run Skank school for eight bars without stopping.", "Kör igång": "Let's go", "Kör lektionen igen": "Run the lesson again", "Kör uppdraget": "Run the mission", "Ligger kvar på": "Stays on", "Lite snabbare": "A bit faster", "Liten": "Small", "Litet barré, två strängar": "Small barre, two strings", "Ljud": "Sound", "Ljudet gick inte att spara": "The sound couldn't be saved", "Ljus nedgång": "Bright descent", "Ljust och lyftande": "Bright and uplifting", "Ljust papper, dämpat grönt, som ett skivomslag": "Light paper, muted green, like a record sleeve", "Ljust på dagen, Riddim när telefonen är i mörkt läge": "Light in the daytime, Riddim when the phone is in dark mode", "Lodrät": "Vertical", "Loopar": "Loops", "Luft: missa med flit": "Air: miss on purpose", "Lyft alla fingrar samtidigt och håll formen i luften. Landa alla på en gång.": "Lift all fingers at once and hold the shape in the air. its heavy roots reggae.", "Mörkt och mjukt.": "Dark and soft.", "Mörkt rödbrunt, guld och rosa som en solnedgång": "Dark red-brown, gold and pink like a sunset", "NIVÅ": "LEVEL", "Nedgången": "The descent", "Ner och upp": "Down and up", "Ner på siffran, upp på &. Handen stannar aldrig.": "Down on the number, up on &. The hand never stops.", "Ner på slagen, upp mellan dem, så som armen rör sig när du kompar.": "Down on the beats, up between them, the way the arm moves when you strum.", "Ner på varje siffra. På & går handen upp i luften.": "Down on every number. On & the hand goes up in the air.", "Nivå": "Level", "Nivåer": "Levels", "Nollställ": "Reset", "Normalt": "Normal", "Nu kan du lägga in egna låtar under Låtar och köra dem med tempotrappan tills du spelar i originaltempo.": "Now you can add your own songs under Songs and play them with the tempo ladder until you play at the original tempo.", "Nu är det bara att spela": "Now just play", "Nu: åttondelar": "Now: eighths", "Ny nivå!": "New level!", "Nybörjare": "Beginner", "Nybörjargrepp": "Beginner chords", "Nybörjarversionen med bara C och Em. Låten börjar med \"Ah, look at all the lonely people\". Originalet går fort, så börja långsamt och höj tempot när bytet sitter.": "The beginner version with just C and Em. The song starts with \"Ah, look at all the lonely people\". The original is fast, so start slowly and raise the tempo when the change sits.", "NylonGitarr säkerhetskopia": "NylonGitarr backup", "Nytt märke:": "New badge:", "Nytt rekord!": "New record!", "Nytt rekord! Förra bästa var": "New record! Previous best was", "När du stämmer en nylongitarr": "When you tune a nylon guitar", "När du är klar kommer du tillbaka hit med knappen längst ner.": "When you're done you come back here with the button at the bottom.", "Nästa": "Next", "Nästa steg": "Next step", "Nästa uppdrag ·": "Next mission ·", "Nästan svart, magenta och cyan som glöder": "Almost black, magenta and cyan that glow", "Nästan! Det här kan bli
