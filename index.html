<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Öva gitarr med kompband, Guitar Hero-läge, skank-skola och stämmare.">
<meta name="theme-color" content="#0c0a1a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="NylonGitarr">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font:14px system-ui,-apple-system,"Segoe UI",sans-serif}
img{max-width:100%}
[hidden]{display:none!important}
html{-webkit-tap-highlight-color:transparent}
/* Känns som en riktig app på telefonen */
html,body{overscroll-behavior-y:none}
button,a,[role="tab"],.bar,.dg,.song,.chip{touch-action:manipulation;-webkit-user-select:none;user-select:none}
input,select,textarea{font-size:16px}
@media (display-mode: standalone){
  body{-webkit-user-select:none;user-select:none}
  input,textarea{-webkit-user-select:text;user-select:text}
}
</style>
<title>NylonGitarr Studio</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: sticky stage header over a two-column practice desk (song list | instrument), stacking to one column on phones */
:root{
  /* Neon Night (standard) */
  --bg:#0c0a1a; --surface:#15122a; --surface-2:#1e1a3a; --surface-3:#29234c; --line:#332c5c;
  --text:#f4f1ff; --muted:#aba4d4; --faint:#706aa3;
  --brass:#ff5ca8; --brass-2:#ff9a5c; --brass-ink:#2a0418;
  --leaf:#2ee6b8; --leaf-2:#8af7d9; --leaf-ink:#03241a;
  --ember:#ff6b5a; --ember-ink:#2a0703; --sky:#5ab8ff;
  --f1:#5ab8ff; --f2:#2ee6b8; --f3:#ffd23f; --f4:#ff5ca8;
  --wood-1:#3a2418; --wood-2:#26160d; --bone:#f3ead6; --skin:#f2c6a2; --skin-2:#d99f78; --top-1:#d9a866; --top-2:#b9834a;
  --glow-1:#ff5ca8; --glow-2:#2ee6b8;
  --f-display:"Bricolage Grotesque","Avenir Next",system-ui,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --r:16px;
  color-scheme:dark;
}
:root[data-skin="riddim"]{
  --bg:#08130d; --surface:#0f1e16; --surface-2:#16291f; --surface-3:#1f3729; --line:#2a4734;
  --text:#effaf1; --muted:#a0bfa8; --faint:#66876e;
  --brass:#ffcc1f; --brass-2:#ffe46b; --brass-ink:#231a00;
  --leaf:#22d36b; --leaf-2:#8cf2b0; --leaf-ink:#02180a;
  --ember:#ff4b3e; --ember-ink:#2a0502; --sky:#52c7ff;
  --f1:#52c7ff; --f2:#22d36b; --f3:#ffcc1f; --f4:#ff4b3e;
  --glow-1:#22d36b; --glow-2:#ffcc1f;
}
:root[data-skin="ocean"]{
  --bg:#05111d; --surface:#0b1c2e; --surface-2:#11273d; --surface-3:#19334e; --line:#234363;
  --text:#eef7ff; --muted:#97b2cf; --faint:#5f7b9b;
  --brass:#36d6ff; --brass-2:#7d8bff; --brass-ink:#001824;
  --leaf:#b6f24a; --leaf-2:#e1ff8f; --leaf-ink:#162600;
  --ember:#ff6b8b; --ember-ink:#2a0410; --sky:#8ab4ff;
  --f1:#8ab4ff; --f2:#b6f24a; --f3:#ffd23f; --f4:#ff6b8b;
  --glow-1:#36d6ff; --glow-2:#7d8bff;
}
:root[data-skin="ljus"]{
  --bg:#f5f4fb; --surface:#ffffff; --surface-2:#eeecf7; --surface-3:#e2def2; --line:#d9d4ea;
  --text:#191530; --muted:#5d5878; --faint:#958fb0;
  --brass:#6d4bff; --brass-2:#ff4f9a; --brass-ink:#ffffff;
  --leaf:#0eb37b; --leaf-2:#21cf95; --leaf-ink:#ffffff;
  --ember:#e5484d; --ember-ink:#ffffff; --sky:#2f80ed;
  --f1:#2f80ed; --f2:#0eb37b; --f3:#f5a300; --f4:#ef4473;
  --glow-1:#6d4bff; --glow-2:#ff4f9a;
  color-scheme:light;
}
html,body{background:var(--bg);color:var(--text)}
body{background:radial-gradient(900px 520px at 85% -8%,color-mix(in oklab,var(--glow-1) 16%,transparent),transparent 65%),radial-gradient(800px 520px at -10% 30%,color-mix(in oklab,var(--glow-2) 10%,transparent),transparent 60%),var(--bg);background-attachment:fixed;min-height:100%}
body{font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
*{box-sizing:border-box}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px;border-radius:8px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
p{margin:0}
.wrap{max-width:1200px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.09em;color:var(--muted)}

/* Header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in oklab,var(--bg) 90%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.top-in{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;padding-block:12px}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto}
.brand h1{font-size:20px;font-weight:800}
.brand h1 span{color:var(--brass)}
.brand small{display:block;font-size:12px;color:var(--muted);font-family:var(--f-body)}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;max-width:100%}
.tabs button{padding:8px 13px;border-radius:10px;font-weight:600;font-size:14px;color:var(--muted);white-space:nowrap}
.tabs button:hover{color:var(--text);background:var(--surface)}
.tabs button[aria-selected="true"]{color:var(--brass-ink);background:linear-gradient(135deg,var(--brass),var(--brass-2))}
.quick{display:flex;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:13px;font-weight:600;color:var(--muted)}
.chip:hover{color:var(--text);border-color:var(--faint)}
.chip.on{color:var(--leaf);border-color:color-mix(in oklab,var(--leaf) 60%,transparent);background:color-mix(in oklab,var(--leaf) 12%,var(--surface))}
.chip.warn{color:var(--ember);border-color:color-mix(in oklab,var(--ember) 50%,transparent)}
.icon{width:16px;height:16px;flex:none}

main{padding-block:22px 64px;display:grid;gap:22px}
.card{background:color-mix(in oklab,var(--surface) 88%,transparent);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.card.flat{background:transparent}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.between{justify-content:space-between}
.muted{color:var(--muted)}

/* Play layout */
.desk{display:grid;grid-template-columns:250px minmax(0,1fr);gap:22px;align-items:start}
.songs{display:grid;gap:6px;position:sticky;top:84px;max-height:calc(100vh - 100px);overflow-y:auto;scrollbar-width:thin;padding-right:4px}
.tierhead{grid-column:1 / -1;padding:10px 4px 2px}
.tierhead:first-child{padding-top:0}
.song{display:block;width:100%;text-align:left;padding:11px 12px;border-radius:12px;border:1px solid transparent;position:relative}
.song:hover{background:var(--surface)}
.song.sel{background:var(--surface-2);border-color:var(--line)}
.song b{display:block;font-weight:700;font-size:14px;line-height:1.3;padding-right:20px}
.song i{display:block;font-style:normal;font-size:12px;color:var(--muted)}
.song .chords{font-family:var(--f-mono);font-size:11px;color:var(--brass);margin-top:3px}
.song .del{position:absolute;right:8px;top:9px;color:var(--faint);font-size:16px;line-height:1;padding:2px 5px;border-radius:6px}
.song .del:hover{color:var(--ember);background:var(--surface-3)}
.add{border:1px dashed var(--line);color:var(--brass);font-weight:600;font-size:13px;padding:10px;border-radius:12px;text-align:center}
.add:hover{border-color:var(--brass)}
.stage{display:grid;gap:18px;min-width:0}

.now{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:end}
.now h2{font-size:clamp(24px,3.4vw,34px);font-weight:800;line-height:1.1}
.now .meta{color:var(--muted);margin-top:4px;font-size:14px}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.tag{font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--surface-2);color:var(--muted)}
.chordnow{display:flex;align-items:flex-end;gap:14px}
.chordnow .big{font-family:var(--f-display);font-weight:800;font-size:64px;line-height:.9;background:linear-gradient(135deg,var(--brass),var(--brass-2));-webkit-background-clip:text;background-clip:text;color:transparent;min-width:1.4em;text-align:right}
.chordnow .next{font-size:12px;color:var(--muted);line-height:1.3;padding-bottom:6px}
.chordnow .next b{display:block;font-family:var(--f-display);font-size:24px;color:var(--text)}

/* Transport */
.transport{display:grid;gap:16px}
.tp-main{display:flex;flex-wrap:wrap;align-items:center;gap:14px}
.play{display:inline-flex;align-items:center;gap:10px;height:52px;padding:0 22px 0 18px;border-radius:999px;background:linear-gradient(135deg,var(--leaf),var(--leaf-2));color:var(--leaf-ink);font-weight:700;font-size:15px;box-shadow:0 6px 24px -10px var(--leaf)}
.play.stop{background:var(--ember);color:var(--ember-ink);box-shadow:0 6px 24px -10px var(--ember)}
.play svg{width:20px;height:20px}
.bpm{display:flex;align-items:center;gap:4px;background:var(--surface-2);border-radius:999px;padding:4px}
.bpm button{width:36px;height:36px;border-radius:50%;font-size:18px;font-weight:700;color:var(--muted)}
.bpm button:hover{background:var(--surface-3);color:var(--text)}
.bpm .val{min-width:74px;text-align:center;font-family:var(--f-mono);font-weight:700;font-size:18px}
.bpm .val small{font-size:10px;color:var(--muted);display:block;line-height:1;font-family:var(--f-body);font-weight:600;letter-spacing:.08em}
.tap{padding:0 14px!important;width:auto!important;border-radius:999px!important;font-size:12px!important;letter-spacing:.06em}
.seg{display:inline-flex;background:var(--surface-2);padding:3px;border-radius:12px;gap:2px;flex-wrap:wrap}
.seg button{padding:7px 12px;border-radius:9px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button:hover{color:var(--text)}
.seg button[aria-pressed="true"]{background:var(--surface-3);color:var(--text);box-shadow:inset 0 0 0 1px var(--line)}
.tp-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.mixer{display:grid;gap:8px}
.slider{display:grid;grid-template-columns:72px minmax(0,1fr) 38px;align-items:center;gap:10px;font-size:13px;color:var(--muted)}
.slider span:last-child{font-family:var(--f-mono);font-size:12px;text-align:right}
input[type=range]{width:100%;accent-color:var(--brass);height:20px}
.checks{display:grid;gap:8px;font-size:13px}
.checks label{display:flex;align-items:center;gap:9px;color:var(--muted);cursor:pointer}
.checks input{accent-color:var(--brass);width:16px;height:16px}

/* Beat strip */
.beats{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:6px}
.beat{border-radius:12px;padding:8px 2px 7px;text-align:center;background:var(--surface-2);border:1px solid transparent;transition:transform .06s,background .06s}
.beat .n{font-family:var(--f-mono);font-size:12px;color:var(--muted);font-weight:700}
.beat .a{height:22px;display:flex;align-items:center;justify-content:center;color:var(--text)}
.beat .a svg{width:18px;height:18px}
.beat .t{font-size:10px;font-weight:700;letter-spacing:.06em;color:var(--faint);text-transform:uppercase}
.beat.rest .a{color:var(--faint)}
.beat.hit{background:color-mix(in oklab,var(--brass) 14%,var(--surface-2));border-color:color-mix(in oklab,var(--brass) 35%,transparent)}
.beat.edit{cursor:pointer;border:1px dashed var(--brass)}
.beat.cur{background:linear-gradient(160deg,var(--brass),var(--brass-2));transform:scale(1.04)}
.beat.cur *{color:var(--brass-ink)!important}
.count{font-family:var(--f-display);font-weight:800;color:var(--brass);font-size:15px}

/* Fretboard */
.board{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 16px 12px}
.board-scroll{overflow-x:auto;margin-inline:-6px;padding-inline:6px}
.board svg{display:block;width:100%;height:auto;user-select:none}
.board-scroll svg{min-width:620px}
.str{cursor:pointer}
.str.vib .line{animation:vib .045s linear 8}
.str.vibx .line{animation:vibx .045s linear 8}
@keyframes vibx{0%{transform:translateX(0)}25%{transform:translateX(-1.3px)}75%{transform:translateX(1.3px)}100%{transform:translateX(0)}}
@keyframes vib{0%{transform:translateY(0)}25%{transform:translateY(-1.3px)}75%{transform:translateY(1.3px)}100%{transform:translateY(0)}}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:12px;color:var(--muted);margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.legend .dot{width:18px;height:18px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:#111;margin-right:6px;vertical-align:middle}

/* Chart */
.chart{display:grid;gap:14px}
.part{display:grid;gap:8px}
.part.dim{opacity:.45}
.part-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.loopchip{padding:4px 10px;font-size:12px}
.bars{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:6px}
.bar{position:relative;padding:12px 6px 8px;border-radius:10px;background:var(--surface-2);text-align:center;border:1px solid transparent}
.bar:hover{border-color:var(--line)}
.bar b{font-family:var(--f-display);font-size:20px;font-weight:800;display:block;line-height:1.1}
.bar b.split{font-size:15px;display:flex;justify-content:center;gap:6px;align-items:baseline}
.bar b.split i{font-style:normal;padding-left:6px;border-left:1px solid currentColor;opacity:.85}
.bar small{position:absolute;left:7px;top:4px;font-family:var(--f-mono);font-size:10px;color:var(--faint)}
.bar.cur{background:linear-gradient(160deg,var(--brass),var(--brass-2));color:var(--brass-ink)}
.bar.cur small{color:var(--brass-ink)}
.bar.start{border-color:var(--brass)}
.bar .prog{position:absolute;left:0;bottom:0;height:3px;background:var(--brass-ink);opacity:.5;border-radius:0 0 0 10px}

.diagrams{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.dg{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 10px 8px;text-align:left;display:flex;flex-direction:column;gap:2px}
.dg:hover{border-color:var(--faint)}
.dg.sel{border-color:var(--brass);background:color-mix(in oklab,var(--brass) 7%,var(--surface))}
.dg .hd{display:flex;align-items:baseline;justify-content:space-between;gap:6px}
.dg .nm{font-family:var(--f-display);font-weight:800;font-size:20px}
.dg .badge{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--sky);border:1px solid color-mix(in oklab,var(--sky) 40%,transparent);padding:1px 6px;border-radius:6px}
.dg .ft{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dg .ft.easy{color:var(--leaf)}
.dg svg{width:100%;height:auto}

.tip{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:start;font-size:14px;color:var(--muted);max-width:75ch}
.tip b{color:var(--text)}
.tip .mark{font-family:var(--f-display);font-weight:800;color:var(--brass);font-size:13px;letter-spacing:.06em;text-transform:uppercase;padding-top:1px}

.section-head{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:6px 16px;margin-bottom:12px}
.section-head h3{font-size:18px}
.section-head p{font-size:13px;color:var(--muted)}
.lead{font-size:15px;color:var(--muted);max-width:68ch}
.lead strong{color:var(--text)}
h2.page{font-size:clamp(24px,3vw,30px);font-weight:800}

/* Skank */
.rules{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.rule{padding:14px;border-radius:12px;background:var(--surface-2)}
.rule h4{margin:0 0 4px;font-size:14px;font-family:var(--f-display)}
.rule p{font-size:13px;color:var(--muted)}
.levels{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}
.level{text-align:left;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--surface)}
.level b{display:block;font-size:14px}
.level span{font-size:12px;color:var(--muted)}
.level[aria-pressed="true"]{border-color:var(--leaf);background:color-mix(in oklab,var(--leaf) 10%,var(--surface))}
.level[aria-pressed="true"] b{color:var(--leaf)}
.sk{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:8px}
.skc{border-radius:14px;padding:12px 4px;text-align:center;background:var(--surface-2);border:1px solid transparent;display:grid;gap:4px;justify-items:center}
.skc .n{font-family:var(--f-display);font-weight:800;font-size:22px;line-height:1}
.skc .w{font-size:11px;font-weight:800;letter-spacing:.06em}
.skc .s{font-size:10px;color:var(--muted)}
.skc.boom .w{color:var(--brass)}
.skc.tjack{background:color-mix(in oklab,var(--leaf) 10%,var(--surface-2));border-color:color-mix(in oklab,var(--leaf) 30%,transparent)}
.skc.tjack .w{color:var(--leaf)}
.skc.cur.boom{background:var(--brass);transform:scale(1.05)}
.skc.cur.tjack{background:var(--leaf);transform:scale(1.05)}
.skc.cur *{color:#111!important}
.coach{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:start;padding:14px;border-radius:12px;background:var(--surface-2);font-size:14px}
.coach .big{font-family:var(--f-display);font-weight:800;font-size:34px;color:var(--leaf);line-height:1;min-width:1.6em}

/* Byten */
.pick{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px}
.pick label{display:grid;gap:4px;font-size:12px;color:var(--muted);font-weight:600}
select{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-weight:600;max-width:100%}
.swap{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.swap button{padding:12px;border-radius:12px;background:var(--surface-2);font-weight:700;border:1px solid transparent}
.swap button[aria-pressed="true"]{border-color:var(--brass);color:var(--brass);background:color-mix(in oklab,var(--brass) 10%,var(--surface-2))}
.lists{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.lists ul{margin:0;padding:0;list-style:none;display:grid;gap:8px;font-size:14px}
.lists li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:9px;align-items:start}
.lists li .fd{width:20px;height:20px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:#111;margin-top:1px}

/* Tuner */
.tuner{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.tstr{text-align:left;padding:14px;border-radius:14px;border:1px solid var(--line);background:var(--surface);display:grid;gap:6px}
.tstr:hover{border-color:var(--faint)}
.tstr.sel{border-color:var(--brass);background:color-mix(in oklab,var(--brass) 8%,var(--surface))}
.tstr .nt{font-family:var(--f-display);font-weight:800;font-size:34px;line-height:1}
.tstr .hz{font-family:var(--f-mono);font-size:12px;color:var(--muted)}

/* Modal */
.scrim{position:fixed;inset:0;z-index:57;background:color-mix(in oklab,var(--bg) 70%,transparent);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;padding:16px}
.modal{width:100%;max-width:460px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px;display:grid;gap:14px;max-height:100%;overflow:auto}
.modal input[type=text]{width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.slots{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.slots select{width:100%;padding:8px 6px}
.btn{padding:9px 16px;border-radius:10px;font-weight:700;font-size:14px;background:var(--surface-2)}
.btn.primary{background:linear-gradient(135deg,var(--brass),var(--brass-2));color:var(--brass-ink)}
.btn:disabled{opacity:.4;cursor:default}

.kbd{font-family:var(--f-mono);font-size:11px;border:1px solid var(--line);border-bottom-width:2px;padding:0 5px;border-radius:5px;color:var(--muted)}



/* Spela med: boll som landar på nästa ackord */
.pa{position:relative;height:370px;overflow:hidden;border-radius:20px;border:1px solid var(--line);background:radial-gradient(120% 80% at 50% 0%,color-mix(in oklab,var(--brass) 18%,var(--surface)),var(--surface) 70%);touch-action:manipulation}
.pa-msg{position:absolute;top:12px;left:16px;right:16px;display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--muted)}
.pa-msg b{color:var(--text)}
.pa-part{font-size:11px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--brass)}
.pa-ball{position:absolute;left:0;top:0;width:24px;height:24px;margin:-12px 0 0 -12px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,var(--brass-2) 45%,var(--brass));box-shadow:0 0 22px color-mix(in oklab,var(--brass) 80%,transparent);z-index:3;will-change:transform;pointer-events:none}
.pa-trail{position:absolute;inset:0;pointer-events:none;z-index:2}
.pa-track{position:absolute;inset:0;will-change:transform}
.pa-card{position:absolute;top:104px;width:40%;max-width:200px;transform:translateX(-50%);transform-origin:50% 0;display:grid;justify-items:center;gap:8px;will-change:transform,opacity}
.pa-card .pill{font-family:var(--f-display);font-weight:800;font-size:24px;line-height:1.2;padding:4px 18px;border-radius:999px;color:var(--text);transition:background .2s,color .2s}
.pa-card.cur .pill{background:var(--text);color:var(--bg)}
.pa-ball.center{left:50%;z-index:4}
.pa::after{content:"";position:absolute;left:50%;top:84px;bottom:34px;width:2px;margin-left:-1px;background:linear-gradient(var(--brass),transparent);opacity:.25;pointer-events:none}
.pa-card .dg{background:transparent;border:0;padding:0;width:100%}
.pa-card .dg:hover{border:0}
.pa-card .dg .hd,.pa-card .dg .ft{display:none}
.pa-card .dg svg{max-width:150px;margin:0 auto}
.pa-dots{position:absolute;left:16px;right:16px;bottom:14px;display:flex;gap:4px}
.pa-dots i{flex:1;height:7px;border-radius:4px;background:var(--surface-3);transition:background .08s}
.pa-dots i.on{background:linear-gradient(90deg,var(--brass),var(--brass-2))}
.pa-dots i.gap{margin-left:6px}
.pa-count{position:absolute;top:56px;left:0;right:0;text-align:center;font-family:var(--f-display);font-weight:800;font-size:28px;color:var(--brass)}
.pa-hint{position:absolute;left:0;right:0;bottom:30px;text-align:center;font-size:12px;color:var(--muted)}
/* Skank: studsande boll */
.bounce{position:relative;padding-top:58px}
.bounce .pa-ball{width:20px;height:20px;margin:-10px 0 0 -10px;background:radial-gradient(circle at 35% 30%,#fff,var(--leaf-2) 45%,var(--leaf));box-shadow:0 0 20px color-mix(in oklab,var(--leaf) 80%,transparent)}
.bounce .count-row span{position:relative}
.bounce .count-row span.tj{border-bottom:3px solid color-mix(in oklab,var(--leaf) 45%,transparent)}
.bounce .count-row span.on.tj{animation:tjack .25s ease-out}
@keyframes tjack{0%{transform:scale(1.2)}100%{transform:scale(1)}}

/* Skank-animation */
.anim{display:grid;gap:14px}
.anim-head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px}

.panel{background:var(--surface-2);border-radius:14px;padding:10px;display:grid;gap:6px;min-width:0}

.count-row{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:4px}
.count-row span{text-align:center;padding:6px 0;border-radius:9px;font-family:var(--f-display);font-weight:800;font-size:16px;color:var(--faint);background:var(--surface-2);transition:background .08s,color .08s}
.count-row span.on.du{background:linear-gradient(160deg,var(--brass),var(--brass-2));color:var(--brass-ink)}
.count-row span.on.tj{background:linear-gradient(160deg,var(--leaf),var(--leaf-2));color:var(--leaf-ink)}
.emo{font-family:"Noto Color Emoji","Apple Color Emoji","Segoe UI Emoji",sans-serif;filter:drop-shadow(0 4px 4px rgba(0,0,0,.35))}
.chop{animation:chop .42s cubic-bezier(.3,.9,.3,1)}
@keyframes chop{0%{transform:translateY(0)}22%{transform:translateY(56px)}100%{transform:translateY(0)}}
.ring{animation:ring .5s ease-out forwards}
@keyframes ring{0%{opacity:1;transform:translateY(0)}10%{transform:translateY(-1.6px)}20%{transform:translateY(1.6px)}30%{transform:translateY(-1px)}40%{transform:translateY(0)}100%{opacity:0}}
.thud{animation:thud .5s ease-out forwards;transform-box:fill-box;transform-origin:center}
@keyframes thud{0%{opacity:.9;transform:scale(.4)}100%{opacity:0;transform:scale(2.2)}}
.trail{animation:trail .42s ease-out forwards}
@keyframes trail{0%{opacity:0}15%{opacity:.9}100%{opacity:0}}
.press{animation:press .5s ease-out forwards;transform-box:fill-box;transform-origin:center}
@keyframes press{0%{transform:scale(1.25)}100%{transform:scale(1)}}
.strip{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}

.vidlink{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding:12px 14px;border-radius:14px;border:1px dashed var(--line);font-size:14px;color:var(--muted)}

@media (max-width:760px){
  .anim-panels{grid-template-columns:minmax(0,1fr)}
  .strip{grid-template-columns:minmax(0,1fr)}
  .strip .panel{grid-template-columns:110px minmax(0,1fr);align-items:center;gap:10px}
}
/* Teman */
.skins{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}

/* Guitar Hero-läge */
.gh{--bg:#0c0a1a;--surface:#15122a;--surface-2:#1e1a3a;--surface-3:#29234c;--line:#3a3366;--text:#f4f1ff;--muted:#aba4d4;--faint:#8a84b8;--f1:#5ab8ff;--f2:#2ee6b8;--f3:#ffd23f;--f4:#ff5ca8;color-scheme:dark;position:fixed;inset:0;z-index:58;display:grid;grid-template-rows:auto auto minmax(0,1fr) auto;background:radial-gradient(120% 70% at 50% 0%,#2a1650,#0b0818 70%);color:#f4f1ff;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);overscroll-behavior:contain}

.gh-mult.m2{background:#4aa8ff;color:#06142a}.gh-mult.m3{background:#ffd23f;color:#2a1f00}.gh-mult.m4{background:linear-gradient(135deg,#ff5ca8,#c07bff);color:#fff;box-shadow:0 0 16px #ff5ca8}
.gh-meter{height:6px;margin:0 max(14px,env(safe-area-inset-right,0px)) 0 max(14px,env(safe-area-inset-left,0px));border-radius:4px;background:rgba(255,255,255,.1);overflow:hidden}
.gh-meter i{display:block;height:100%;background:linear-gradient(90deg,#ff4b5c,#ffd23f 50%,#2ee66b);transition:width .2s}
.gh-view{padding:7px 12px;border-radius:999px;background:rgba(255,255,255,.1);color:#fff;font-weight:700;font-size:13px;flex:none}
.gh-panel .seg{background:rgba(255,255,255,.08)}

.gh-combo{position:absolute;right:max(14px,env(safe-area-inset-right,0px));top:42%;display:grid;justify-items:center;font-family:var(--f-display)}
.gh-combo b{font-size:34px;line-height:1;background:linear-gradient(135deg,#ffd23f,#ff5ca8);-webkit-background-clip:text;background-clip:text;color:transparent}

.gh-count{position:absolute;left:0;right:0;top:30%;text-align:center;font-family:var(--f-display);font-weight:800;font-size:96px;line-height:1;color:#fff;text-shadow:0 0 30px #ff5ca8;animation:ghc .5s ease-out}
@keyframes ghc{from{transform:scale(1.6);opacity:0}}
.gh-bottom .btn{background:rgba(255,255,255,.12);color:#fff}
.gh-bottom{display:flex;gap:10px;align-items:center;padding:8px max(14px,env(safe-area-inset-right,0px)) 12px max(14px,env(safe-area-inset-left,0px));min-height:20px}
.gh-tap{flex:1;height:96px;border-radius:24px;font-family:var(--f-display);font-weight:800;font-size:30px;letter-spacing:.08em;color:#140f2a;background:linear-gradient(135deg,#ffd23f,#ff9a3c 50%,#ff5ca8);box-shadow:0 10px 30px -10px #ff5ca8;touch-action:none;user-select:none;-webkit-user-select:none}
.gh-tap:active{transform:scale(.97);filter:brightness(1.15)}
.gh-mic{flex:1;display:grid;gap:6px;font-size:13px;color:#aba4d4}
.gh-lvl{height:10px;border-radius:6px;background:rgba(255,255,255,.1);overflow:hidden}
.gh-lvl i{display:block;height:100%;width:0;background:linear-gradient(90deg,#2ee66b,#ffd23f);transition:width .05s}
.gh-panel{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(440px,calc(100% - 28px));max-height:calc(100% - 20px);overflow:auto;display:grid;gap:14px;padding:20px;border-radius:22px;background:rgba(16,12,34,.92);border:1px solid rgba(255,255,255,.14);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 30px 80px -20px #000}

.gh-modes{display:grid;gap:8px}

.gh-mode b{font-size:15px}.gh-mode span{font-size:12.5px;color:#aba4d4}

function useNarrow(q = '(max-width: 600px)') {
  const mq = useMemo(() => window.matchMedia(q), [q]);

}

function Bpm({ value, set, min = 40, max = 140 }) {
  const taps = useRef([]);
  const tap = () => {
    const now = performance.now(); taps.current = taps.current.filter((x) => now - x < 2500); taps.current.push(now);
    if (taps.current.length >= 3) {
      const t = taps.current, iv = (t[t.length - 1] - t[0]) / (t.length - 1);
      set(Math.max(min, Math.min(max, Math.round(60000 / iv))));
    }
  };
  return html`<div className="bpm">
    <button onClick=${() => set(Math.max(min, value - 2))} aria-label="Långsammare">−</button>
    <div className="val">${value}<small>BPM</small></div>
    <button onClick=${() => set(Math.min(max, value + 2))} aria-label="Snabbare">+</button>
    <button className="tap" onClick=${tap} title="Knacka takten tre gånger">TAP</button>
  </div>`;
}

  const tags = (n.daily || {})[today()] || [];

  if (st.k === 'chal') { const k1 = st.p.join('-'), k2 = [...st.p].reverse().join('-'); return tags.some((t) => { const m = /^chal:(.+):(\d+)$/.exec(t); return m && (m[1] === k1 || m[1] === k2) && +m[2] >= st.n; }); }

  if (st.k === 'solo') return tags.includes('solo');
  if (st.k === 'stars') return tags.some((t) => { const m = /^stars:(.+):(\d)$/.exec(t); return m && (st.s === 'any' || m[1] === st.s) && +m[2] >= st.n; });
  return false;

function ChordCheck({ k, easy, onOk }) {
  const [state, setState] = useState('off'); // off | on | blocked
  const [phase, setPhase] = useState('wait'); // wait | listen | result
  const [res, setRes] = useState(null);
  const [streak, setStreak] = useState(0);
  const mic = useRef(null), raf = useRef(0), lvl = useRef(null), K = useRef({});
  K.current = { k, easy, onOk };
  const stop = () => { cancelAnimationFrame(raf.current); if (mic.current) mic.current.stop(); mic.current = null; setState('off'); setPhase('wait'); };
  useEffect(() => stop, []);
  useEffect(() => { setRes(null); setPhase('wait'); setStreak(0); }, [k, easy]);
  const start = async () => {
    try {
      const m = new Mic(); await m.start({ aec: false }); mic.current = m; setState('on'); setPhase('wait');
      const C = { env: 0.01, last: -1e9, onset: null, acc: null, cal: micCal() };
      const loop = (t) => {
        raf.current = requestAnimationFrame(loop);
        m.read(); const r = m.rms();
        if (lvl.current) lvl.current.style.width = Math.min(100, r * 600) + '%';
        if (!C.onset && r > C.cal.onset && r > C.env * 2.5 && t - C.last > 700) { C.onset = t; C.acc = new Array(128).fill(0); setPhase('listen'); }
        C.env = C.env * 0.9 + r * 0.1;
        if (C.onset) {
          const age = t - C.onset;
          if (age > 120 && age < 900) m.notes(C.acc);
          if (age >= 900) {
            const s = K.current, out = judgeChord(s.k, s.easy, C.acc);
            setRes(out); setPhase('result'); C.last = t; C.onset = null;
            setStreak((n) => (out.ok ? n + 1 : 0));
            if (out.ok && s.onOk) s.onOk(s.k);
          }
        }
      };
      raf.current = requestAnimationFrame(loop);
    } catch (e) { setState('blocked'); }
  };
  const name = CHORD_DB[k].name;
  return html`<div className="cc">
    ${state === 'off' ? html`<div className="row between" style=${{ alignItems: 'center' }}>
      <p className="lead" style=${{ flex: '1 1 220px' }}>Ta greppet ${name}, tryck på knappen och slå an en gång. Appen lyssnar och säger vilka strängar som låter rätt.</p>
      <button className="play" onClick=${start}>${I.play}Kolla mitt ${name}</button></div>` : null}
    ${state === 'blocked' ? MIC_BLOCKED : null}
    ${state === 'on' ? html`<div style=${{ display: 'grid', gap: 12 }}>
      <div className="row between">
        <b style=${{ fontSize: 15 }}>${phase === 'listen' ? 'Lyssnar…' : phase === 'result' ? 'Slå an igen för att prova en gång till' : 'Slå an ' + name + ' en gång och låt det klinga'}</b>
        <button className="chip warn" onClick=${stop}>Stäng av</button>
      </div>
      <div className="gh-lvl cc-lvl"><i ref=${lvl}></i></div>
      ${res ? html`<div className=${'cc-res ' + (res.ok ? 'ok' : 'bad')}>
        <div className="cc-head"><span className="cc-icon">${res.ok ? '✓' : '!'}</span>
          <div><b>${res.ok ? 'Rätt! ' + name + ' klingar rent' : 'Nästan! Det här kan bli bättre:'}</b>
          ${res.ok && streak > 1 ? html`<small>${streak} rätt i rad</small>` : null}</div></div>
        <div className="cc-strings">${res.strings.map((s) => html`<span key=${s.i} className=${'cc-s ' + s.st}><b>${STR_NAME[s.i]}</b><i>${s.st === 'ok' ? '✓' : s.st === 'x' ? '×' : s.st === 'extra' ? 'slå inte' : 'svag'}</i></span>`)}</div>
        ${res.tips.length ? html`<ul className="cc-tips">${res.tips.map((x, i) => html`<li key=${i}>${x}</li>`)}</ul>` : null}
      </div>` : null}
    </div>` : null}
  </div>`;
}

/* Rytmmätaren: knacka på varje & och se om du ligger före eller efter */
function RhythmMeter({ active, onHit }) {
  const [last, setLast] = useState(null);
  const [tally, setTally] = useState({ p: 0, g: 0, m: 0, streak: 0 });
  const hit = () => {
    if (!active || !engine.ctx) return;
    const now = engine.ctx.currentTime - (engine.ctx.outputLatency || 0) * 0.5;
    const offs = engine.log.filter((x) => x.step % 2 === 1).map((x) => (now - x.t) * 1000);
    if (!offs.length) return;
    const ms = offs.reduce((a, b) => (Math.abs(b) < Math.abs(a) ? b : a));
    const grade = Math.abs(ms) < 40 ? 'p' : Math.abs(ms) < 90 ? 'g' : 'm';
    setLast({ ms, grade, id: Math.random() });
    setTally((t) => { const n = { ...t, [grade]: t[grade] + 1, streak: grade === 'm' ? 0 : t.streak + 1 }; onHit(grade, n.streak); return n; });
  };
  useEffect(() => {
    const h = (e) => { if (active && (e.code === 'Enter' || e.code === 'KeyJ')) { e.preventDefault(); hit(); } };
    window.addEventListener('keydown', h); return () => window.removeEventListener('keydown', h);
  });
  const total = tally.p + tally.g + tally.m;
  return html`<section className="card" style=${{ display: 'grid', gap: 14 }}>
    <div className="section-head" style=${{ margin: 0 }}><h3>Rytmmätare</h3><p>Starta tränaren och tryck på knappen i takt med ditt tjack på varje &.</p></div>
    <div style=${{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit,minmax(260px,1fr))', gap: 18, alignItems: 'center' }}>
      <${Needle} value=${last ? last.ms : null} range=${150} good=${last && last.grade === 'p'} unitL="för tidigt" unitR="för sent"
        label=${!last ? '–' : last.grade === 'p' ? 'Perfekt!' : last.grade === 'g' ? 'Bra' : 'Miss'}
        sub=${last ? (last.ms > 0 ? '+' : '') + Math.round(last.ms) + ' ms' : active ? 'Tryck på varje &' : 'Starta tränaren först'} />
      <div style=${{ display: 'grid', gap: 12, justifyItems: 'center' }}>
        <button className="tapbtn" disabled=${!active} style=${{ opacity: active ? 1 : 0.45 }} onPointerDown=${(e) => { e.preventDefault(); hit(); }}>TJACK</button>
        <div className="stats" style=${{ width: '100%' }}>
          <div className="stat"><b style=${{ color: 'var(--leaf)' }}>${tally.p}</b><span>Perfekt</span></div>
          <div className="stat"><b style=${{ color: 'var(--brass)' }}>${tally.g}</b><span>Bra</span></div>
          <div className="stat"><b>${total ? Math.round((tally.p + tally.g) / total * 100) : 0}%</b><span>Träffsäkerhet</span></div>
        </div>
        <p className="muted" style=${{ fontSize: 12 }}>På datorn: tangenten <span className="kbd">J</span> eller <span className="kbd">Enter</span>.</p>
      </div>
    </div>
  </section>`;
}

          <button className=${'chip' + (vibe ? ' on' : '')} onClick=${() => { setVibe(!vibe); if (!vibe) setTimeout(() => vib(30), 50); }}>${vibe ? 'På' : 'Av'}</button></div>
        <div className="set-sec"><b>Flytta framsteg</b><small>XP, märken, rekord, egna låtar och kalibrering följer med. Gör så här: kopiera koden på enheten du övat på och klistra in den på den andra.</small>
          <div className="row"><button className="btn primary" onClick=${makeCode}>Kopiera min kod</button></div>
          ${codeOut ? html`<textarea id="codeout" readOnly rows="3" value=${codeOut} onFocus=${(e) => e.target.select()}></textarea>` : null}
          <textarea id="codein" rows="2" placeholder="Klistra in en kod från din andra enhet (börjar med NG1:)" value=${codeIn} onInput=${(e) => { setCodeIn(e.target.value); setCodeAsk(null); }} onChange=${() => {}}></textarea>
          <div className="row">${codeAsk ? html`<button className="btn primary" onClick=${applyCode}>Ja, ersätt mina framsteg</button><button className="btn" onClick=${() => { setCodeAsk(null); setCodeMsg(''); }}>Avbryt</button>` : html`<button className="btn" disabled=${!codeIn.trim()} onClick=${readCode}>Hämta framsteg</button>`}</div>
          ${codeMsg ? html`<p className="muted" style=${{ fontSize: 13 }}>${codeMsg}</p>` : null}
        </div>
      </div></div>` : null}
    ${modal ? html`<${NewSong} onClose=${() => setModal(false)} onSave=${(s) => { const list = [...custom, s]; setCustom(list); saveCustom(list); setModal(false); pickSong(s); }} />` : null}
  </div>`;
}

/* ---------------------------------------------------------------- ackordblad: tolka inklistrad text */
const SECTION_SV = [[/^(pre[- ]?chorus|förrefräng|brygga)/i, 'Förrefräng'], [/^(chorus|refräng|refrain|ref)/i, 'Refräng'], [/^(verse|vers)/i, 'Vers'], [/^(bridge|stick)/i, 'Stick'],
  [/^intro/i, 'Intro'], [/^(outro|avslut|ending)/i, 'Avslut'], [/^(instrumental|interlude|mellanspel)/i, 'Mellanspel'], [/^solo/i, 'Solo'], [/^(hook)/i, 'Refräng']];
const CHORD_RE = /^([A-G])(#|b)?((?:maj|min|m|M|dim|aug|sus|add|°|\+|-)?[0-9]*(?:sus[24]?|add[0-9]+|maj[0-9]*|[0-9]+)*)(\/[A-G](#|b)?)?$/;
const FLAT2SHARP = { Db: 'C#', Eb: 'D#', Gb: 'F#', Ab: 'G#', 'A#': 'Bb' };
function chordKey(raw) {
  const m = CHORD_RE.exec(raw.replace(/[()*]/g, '')); if (!m) return null;
  let root = m[1] + (m[2] || ''); root = FLAT2SHARP[root] || root;
  let suf = (m[3] || '').replace(/^min/, 'm').replace(/^-/, 'm').replace(/^M7|^Δ/, 'maj7');
  const names = {}; for (const k of CHORD_KEYS) { const n = CHORD_DB[k].name; if (!(n in names) || k === n) names[n] = k; }
  const tries = [suf, suf.replace(/add[0-9]+|6|9|11|13/g, ''), suf.replace(/^(m?)maj7.*/, '$1').replace(/^(m?)7.*/, '$17'), suf.replace(/^(m?)7.*/, '$1'),
    suf.replace(/sus[24]?/, ''), suf.startsWith('m') && !suf.startsWith('maj') ? 'm' : ''];
  for (let i = 0; i < tries.length; i++) { const k = names[root + tries[i]]; if (k) return { key: k, simplified: i > 0 || !!m[4], orig: raw }; }
  return { key: null, orig: raw };
}
const isChordTok = (t) => CHORD_RE.test(t.replace(/[()*]/g, '')) || /^(N\.?C\.?)$/i.test(t);
function parseSheet(text, perBar = 1) {
  const parts = []; let cur = null, capo = 0; const unknown = new Set(), simplified = {};
  const push = (name) => { cur = { part: name, bars: [] }; parts.push(cur); };
  const addChords = (list, repeat = 1) => {
    if (!cur) push('Vers');
    const keys = list.map((t) => { const r = chordKey(t); if (!r || !r.key) { if (!/^N\.?C/i.test(t)) unknown.add(t); return null; } if (r.simplified) simplified[t] = CHORD_DB[r.key].name; return r.key; }).filter(Boolean);
    for (let n = 0; n < repeat; n++) {
      if (perBar === 2) for (let i = 0; i < keys.length; i += 2) cur.bars.push(keys[i + 1] && keys[i + 1] !== keys[i] ? [keys[i], keys[i + 1]] : keys[i]);
      else keys.forEach((k) => cur.bars.push(k));
    }
  };
  for (let line of text.replace(/\r/g, '').split('\n')) {
    const cm = /capo\s*[:\-]?\s*(\d+)/i.exec(line); if (cm) { capo = +cm[1]; continue; }
    const t = line.trim(); if (!t) continue;
    const head = /^\[([^\]]+)\]$/.exec(t) || /^([A-Za-zÅÄÖåäö\- ]+?)\s*[0-9]*\s*:$/.exec(t) || /^(intro|verse|vers|chorus|refräng|bridge|stick|outro|pre[- ]?chorus|instrumental|solo|interlude)\s*[0-9]*$/i.exec(t);
    if (head && !isChordTok(head[1].trim())) { const nm = head[1].trim(); const sv = SECTION_SV.find(([re]) => re.test(nm)); push(sv ? sv[1] : nm.charAt(0).toUpperCase() + nm.slice(1)); continue; }
    // ChordPro: [Am]text[C]text
    const inl = [...t.matchAll(/\[([^\]]+)\]/g)].map((x) => x[1]).filter(isChordTok);
    if (inl.length && t.replace(/\[[^\]]+\]/g, '').trim().length > 0) { addChords(inl); continue; }
    const rep = /(?:^|\s)[x×](\d)\s*$|\((?:x|×)?(\d)x?\)\s*$/i.exec(t); const times = rep ? +(rep[1] || rep[2]) : 1;
    const body = rep ? t.slice(0, rep.index) : t;
    // takter med |
    if (body.includes('|')) {
      const segs = body.split('|').map((x) => x.trim().split(/\s+/).filter(Boolean)).filter((x) => x.length);
      if (segs.length && segs.every((sg) => sg.every((tok) => isChordTok(tok) || /^[-\/.%]+$/.test(tok)))) {
        if (!cur) push('Vers');
        for (let n = 0; n < times; n++) segs.forEach((sg) => { const ks = sg.filter(isChordTok).map((x) => { const r = chordKey(x); if (!r || !r.key) { unknown.add(x); return null; } if (r.simplified) simplified[x] = CHORD_DB[r.key].name; return r.key; }).filter(Boolean); if (ks.length) cur.bars.push(ks.length > 1 && ks[1] !== ks[0] ? [ks[0], ks[1]] : ks[0]); });
        continue;
      }
    }
    const toks = body.split(/\s+/).filter((x) => x && !/^[-–|.,]+$/.test(x));
    if (toks.length && toks.filter(isChordTok).length / toks.length >= 0.75) addChords(toks.filter(isChordTok), times);
  }
  return { parts: parts.filter((p) => p.bars.length), capo, unknown: [...unknown], simplified };
}

function NewSong({ onClose, onSave }) {
  const [tab, setTab] = useState('paste');
  const [name, setName] = useState('');
  const [artist, setArtist] = useState('');
  const [text, setText] = useState('');
  const [perBar, setPerBar] = useState(1);
  const [bpm, setBpm] = useState(80);
  const [chords, setChords] = useState(['Em', 'G', 'D', 'C']);
  const [feel, setFeel] = useState('acoustic');
  const parsed = useMemo(() => (text.trim() ? parseSheet(text, perBar) : null), [text, perBar]);
  const nBars = parsed ? parsed.parts.reduce((a, p) => a + p.bars.length, 0) : 0;
  const canSave = name.trim() && (tab === 'pick' || nBars > 0);
  const submit = (e) => {
    e.preventDefault(); if (!canSave) return;
    const form = tab === 'paste' ? parsed.parts : [{ part: 'Runda', bars: chords }];
    const simp = parsed && Object.keys(parsed.simplified).length ? ' Förenklade ackord: ' + Object.entries(parsed.simplified).map(([a, b]) => a + ' → ' + b).join(', ') + '.' : '';
    onSave({ id: 'custom-' + Date.now(), custom: true, title: name.trim(), artist: artist.trim() || (tab === 'paste' ? 'Inklistrat ackordblad' : 'Egen ackordföljd'), level: 'Egen', bpm, feel,
      capo: tab === 'paste' && parsed.capo ? 'Capo ' + parsed.capo : undefined,
      pattern: feel === 'reggae' ? P_SKANK : P_FOLK, accents: feel === 'reggae' ? [] : [0, 6],
      tip: 'Börja med tempotrappan och låt appen höja tempot när bytena sitter.' + simp, form });
  };
  return html`<div className="scrim" onClick=${(e) => e.target === e.currentTarget && onClose()}>
    <form className="modal ns" onSubmit=${submit}>
      <div className="row between"><h3 style=${{ fontSize: 20 }}>Lägg till låt</h3><button type="button" className="btn" onClick=${onClose}>Stäng</button></div>
      <div className="seg" role="group" aria-label="Sätt">
        <button type="button" aria-pressed=${tab === 'paste'} onClick=${() => setTab('paste')}>Klistra in ackordblad</button>
        <button type="button" aria-pressed=${tab === 'pick'} onClick=${() => setTab('pick')}>Välj ackord själv</button>
      </div>
      <div className="ns-row">
        <label className="ns-f"><span className="label">Låt</span><input type="text" id="songname" required placeholder="Till exempel Often" value=${name} onInput=${(e) => setName(e.target.value)} onChange=${() => {}} /></label>
        <label className="ns-f"><span className="label">Artist</span><input type="text" id="songartist" placeholder="Till exempel Ellen Krauss" value=${artist} onInput=${(e) => setArtist(e.target.value)} onChange=${() => {}} /></label>
      </div>
      ${tab === 'paste' ? html`
        <p className="muted" style=${{ fontSize: 13 }}>Kopiera ett ackordblad (till exempel från Ultimate Guitar) och klistra in här. Appen plockar ut ackorden, delarna och capo. Texten sparas inte.</p>
        <textarea id="sheet" rows="7" placeholder=${'[Verse]\nAm   C   F\n…\n[Chorus]\nC   G   Am   F'} value=${text} onInput=${(e) => setText(e.target.value)} onChange=${() => {}}></textarea>
        <div className="row between"><span className="label">Ackord per takt</span>
          <div className="seg" role="group" aria-label="Ackord per takt">
            <button type="button" aria-pressed=${perBar === 1} onClick=${() => setPerBar(1)}>Ett</button>
            <button type="button" aria-pressed=${perBar === 2} onClick=${() => setPerBar(2)}>Två</button>
          </div></div>
        ${parsed ? html`<div className="ns-prev">
          ${parsed.parts.length ? parsed.parts.map((pt, i) => html`<div key=${i} className="ns-part"><span className="label">${pt.part}</span>
            <div className="ns-bars">${pt.bars.map((b, j) => html`<span key=${j}>${[].concat(b).map((k) => CHORD_DB[k].name).join(' | ')}</span>`)}</div></div>`)
            : html`<p className="muted">Hittade inga ackord än. Ackorden ska stå på egna rader eller inom [ ] i texten.</p>`}
          <p className="muted" style=${{ fontSize: 12 }}>${nBars} takter${parsed.capo ? ' · capo ' + parsed.capo : ''}${Object.keys(parsed.simplified).length ? ' · förenklat: ' + Object.entries(parsed.simplified).map(([a, b]) => a + '→' + b).join(', ') : ''}</p>
          ${parsed.unknown.length ? html`<p className="gh-err" style=${{ color: 'var(--text)' }}>Saknar grepp för ${parsed.unknown.join(', ')}. De hoppas över. Prova en capo-version av ackordbladet.</p>` : null}
        </div>` : null}` : html`
        <div className="row between"><span className="label">Takter (${chords.length})</span>
          <div className="row" style=${{ gap: 6 }}>
            <button type="button" className="chip" disabled=${chords.length <= 2} onClick=${() => setChords(chords.slice(0, -1))}>− Takt</button>
            <button type="button" className="chip" disabled=${chords.length >= 16} onClick=${() => setChords([...chords, chords[chords.length - 1]])}>+ Takt</button>
          </div></div>
        <div className="slots">${chords.map((c, i) => html`<select key=${i} id=${'slot' + i} value=${c} onChange=${(e) => { const u = [...chords]; u[i] = e.target.value; setChords(u); }}>
          ${CHORD_KEYS.map((k) => html`<option key=${k} value=${k}>${CHORD_DB[k].name}</option>`)}</select>`)}</div>`}
      <div className="row between"><span className="label">Tempo</span><${Bpm} value=${bpm} set=${setBpm} /></div>
      <div className="seg" role="group" aria-label="Spelsätt">
        <button type="button" aria-pressed=${feel === 'acoustic'} onClick=${() => setFeel('acoustic')}>Akustiskt komp</button>
        <button type="button" aria-pressed=${feel === 'reggae'} onClick=${() => setFeel('reggae')}>Reggae-skank</button>
      </div>
      <button type="submit" className="btn primary" disabled=${!canSave}>Spara och öppna</button>
    </form>
  </div>`;
}

ReactDOM.createRoot(document.getElementById('root')).render(html`<${App} />`);
</script>

/* Appens statusfält följer valt färgtema */
(function () {
  var meta = document.querySelector('meta[name="theme-color"]');
  var sync = function () { try { var c = getComputedStyle(document.documentElement).getPropertyValue('--bg').trim(); if (c) meta.setAttribute('content', c); } catch (e) {} };
  new MutationObserver(sync).observe(document.documentElement, { attributes: true, attributeFilter: ['data-skin'] });
  window.addEventListener('load', sync);
})();
/* Offline och installation */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
}
</script>
