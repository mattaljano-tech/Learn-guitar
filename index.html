<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="description" content="Öva gitarr med kompband, 3D-grepp, skank-skola och stämmare.">
<meta name="theme-color" content="#100e0c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="NylonGitarr">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
:root{padding-top:var(--safe-area-inset-top,env(safe-area-inset-top,0px));padding-bottom:var(--safe-area-inset-bottom,env(safe-area-inset-bottom,0px))}
body{margin:0;font:14px system-ui,-apple-system,"Segoe UI",sans-serif}
img{max-width:100%}
[hidden]{display:none!important}
html{-webkit-tap-highlight-color:transparent}
/* Känns som en riktig app på telefonen */
html,body{overscroll-behavior-y:none;overflow-x:clip}
button,a,[role="tab"],.bar,.dg,.song,.chip{touch-action:manipulation;-webkit-user-select:none;user-select:none}
input,select,textarea{font-size:16px}
@media (display-mode: standalone){
  body{-webkit-user-select:none;user-select:none}
  input,textarea{-webkit-user-select:text;user-select:text}
}
</style>
<title>NylonGitarr Studio</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: sticky stage header over a two-column practice desk (song list | instrument), stacking to one column on phones */
:root{
  /* Grundvärden, temana nedan skriver över dem */
  --bg:#0c0a1a; --surface:#15122a; --surface-2:#1e1a3a; --surface-3:#29234c; --line:#332c5c;
  --text:#f4f1ff; --muted:#aba4d4; --faint:#706aa3;
  --brass:#ff5ca8; --brass-2:#ff9a5c; --brass-ink:#2a0418;
  --leaf:#2ee6b8; --leaf-2:#8af7d9; --leaf-ink:#03241a;
  --ember:#ff6b5a; --ember-ink:#2a0703; --sky:#5ab8ff;
  --f1:#5ab8ff; --f2:#2ee6b8; --f3:#ffd23f; --f4:#ff5ca8;
  --wood-1:#3a2418; --wood-2:#26160d; --bone:#f3ead6; --skin:#f2c6a2; --skin-2:#d99f78; --top-1:#d9a866; --top-2:#b9834a;
  --glow-1:#ff5ca8; --glow-2:#2ee6b8;
  --f-display:"Outfit",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-body:"Outfit",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --r:16px;
  color-scheme:dark;
}
:root[data-skin="salvia"]{
  /* Salvia och persika: ljust papper, dämpat grönt och persika, som ett skivomslag */
  --bg:#f3ede1; --surface:#fbf7ef; --surface-2:#e9dfce; --surface-3:#ddd0ba; --line:#cdbfa8;
  --text:#2e4136; --muted:#526258; --faint:#68756b;
  --brass:#96472e; --brass-2:#96472e; --brass-ink:#fff8ef;
  --leaf:#4c6655; --leaf-2:#3d5546; --leaf-ink:#f5efe3;
  --ember:#b4502f; --ember-ink:#fff8ef; --sky:#3f6c80;
  --f1:#3f6c80; --f2:#4c6655; --f3:#a87620; --f4:#96472e;
  --glow-1:#edb99f; --glow-2:#4c6655;
  --f-display:"Outfit",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-body:"Outfit",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"Outfit",system-ui,sans-serif;
  --r:14px;
  color-scheme:light;
  --cv-bg:#4c6655; --cv-text:#f5efe3; --cv-btn:#2e4136; --cv-btn-text:#f5efe3;
  --vd-plate:#3f5748; --vd-line:#2e4136; --vd-rim:#232c27; --vd-dots:#9db0a1; --vd-disc:#1d2420; --vd-groove:#35433a;
  --vd-label:#edb99f; --vd-ink:#2e4136; --vd-arm:#f3ede1; --vd-head:#edb99f; --vd-hole:#f3ede1; --vd-ring:transparent; --vd-ring-2:transparent; --vd-rays:transparent;
}
:root[data-skin="riddim"]{
  /* Riddim: en strandbar i skymningen, djupgrönt, guld och rött */
  --bg:#0e1f17; --surface:#14291f; --surface-2:#1b3528; --surface-3:#254535; --line:#2f5140;
  --text:#fbf2dc; --muted:#c3cdb9; --faint:#93a596;
  --brass:#f2c230; --brass-2:#f2c230; --brass-ink:#1a1405;
  --leaf:#4fb477; --leaf-2:#7fd09e; --leaf-ink:#06170d;
  --ember:#e2563f; --ember-ink:#fff4e4; --sky:#7fc4d6;
  --f1:#7fc4d6; --f2:#4fb477; --f3:#f2c230; --f4:#e2563f;
  --glow-1:#f2c230; --glow-2:#4fb477;
  --f-display:"Outfit",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-body:"Outfit",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"Outfit",system-ui,sans-serif;
  --r:14px;
  --wv-band:#1b3528;
  --cv-bg:#17442f; --cv-text:#fbf2dc; --cv-btn:#f2c230; --cv-btn-text:#1a1405;
  --vd-plate:#113524; --vd-line:#0a2015; --vd-rim:#0b0e0b; --vd-dots:#f2c230; --vd-disc:#0a0c0a; --vd-groove:#262a26;
  --vd-label:#f2c230; --vd-ink:#1a1405; --vd-arm:#fbf2dc; --vd-head:#e2563f; --vd-hole:#fbf2dc; --vd-ring:#c93a2b; --vd-ring-2:#1f8a4c; --vd-rays:#f2c230;
}
:root[data-skin="neon"]{
  /* Neon: nästan svart, magenta och cyan som glöder */
  --bg:#07050f; --surface:#110c20; --surface-2:#1a1433; --surface-3:#241c45; --line:#2e2552; --text:#f2eeff; --muted:#b3abd6; --faint:#8f88b8; --brass:#ff3df2; --brass-2:#33d6ff; --brass-ink:#1a0618; --leaf:#33d6ff; --leaf-2:#8be9ff; --leaf-ink:#04161e; --ember:#ff3df2; --ember-ink:#1a0618; --sky:#33d6ff; --f1:#33d6ff; --f2:#2ee6b8; --f3:#ffd23f; --f4:#ff3df2; --glow-1:#ff3df2; --glow-2:#33d6ff; --wv-band:#1a1433; --cv-bg:#1d1240; --cv-text:#f2eeff; --cv-btn:#ff3df2; --cv-btn-text:#1a0618; --vd-plate:#160f30; --vd-line:#0b0818; --vd-rim:#05040b; --vd-dots:#33d6ff; --vd-disc:#07060d; --vd-groove:#221a3d; --vd-label:#ff3df2; --vd-ink:#1a0618; --vd-arm:#f2eeff; --vd-head:#33d6ff; --vd-hole:#f2eeff; --vd-ring:#ff3df2; --vd-ring-2:#33d6ff; --vd-rays:#8a5cff;
  --f-display:"Outfit",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-body:"Outfit",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --r:16px;
  color-scheme:dark;
}
:root[data-skin="sol"]{
  /* Sol: mörkt rödbrunt, guld och rosa som en solnedgång */
  --bg:#0d0605; --surface:#1a0d0b; --surface-2:#261410; --surface-3:#331b15; --line:#45271d; --text:#fff1ea; --muted:#dcbcb0; --faint:#ae8a7f; --brass:#ffb84d; --brass-2:#ff3d80; --brass-ink:#2a1204; --leaf:#ff8a4c; --leaf-2:#ffc07a; --leaf-ink:#2a1204; --ember:#ff6a3d; --ember-ink:#1f0802; --sky:#ffd27a; --f1:#ffd27a; --f2:#ff8a4c; --f3:#ffb84d; --f4:#ff3d80; --glow-1:#ffb84d; --glow-2:#ff3d80; --wv-band:#261410; --cv-bg:#3a160f; --cv-text:#fff1ea; --cv-btn:#ffb84d; --cv-btn-text:#2a1204; --vd-plate:#2a110c; --vd-line:#140705; --vd-rim:#070303; --vd-dots:#ffb84d; --vd-disc:#0a0505; --vd-groove:#2e1a14; --vd-label:#ffb84d; --vd-ink:#2a1204; --vd-arm:#fff1ea; --vd-head:#ff3d80; --vd-hole:#fff1ea; --vd-ring:#ff3d80; --vd-ring-2:#ff8a4c; --vd-rays:#ffb84d;
  --f-display:"Outfit",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-body:"Outfit",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --r:16px;
  color-scheme:dark;
}
:root[data-skin="svartvit"]{
  /* Svartvit: svart och vitt, med ett svagt neonskimmer i bakgrunden */
  --bg:#000000; --surface:#0e0e10; --surface-2:#18181b; --surface-3:#232327; --line:#2e2e33; --text:#f5f5f7; --muted:#b4b4bb; --faint:#8d8d95; --brass:#ffffff; --brass-2:#d0d0d6; --brass-ink:#000000; --leaf:#e6e6ea; --leaf-2:#ffffff; --leaf-ink:#000000; --ember:#ffffff; --ember-ink:#000000; --sky:#c9c9d2; --f1:#33d6ff; --f2:#2ee6b8; --f3:#ffd23f; --f4:#ff3df2; --glow-1:#ff3df2; --glow-2:#33d6ff; --wv-band:#18181b; --cv-bg:#141416; --cv-text:#f5f5f7; --cv-btn:#ffffff; --cv-btn-text:#000000; --vd-plate:#121214; --vd-line:#050506; --vd-rim:#000000; --vd-dots:#9a9aa2; --vd-disc:#050505; --vd-groove:#1e1e22; --vd-label:#f5f5f7; --vd-ink:#000000; --vd-arm:#f5f5f7; --vd-head:#ff3df2; --vd-hole:#000000; --vd-ring:#ff3df2; --vd-ring-2:#33d6ff; --vd-rays:#d0d0d6;
  --f-display:"Outfit",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-body:"Outfit",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --r:16px;
  color-scheme:dark;
}
:root[data-skin="svartvit"][data-skin] body{background:radial-gradient(900px 520px at 85% -8%,color-mix(in oklab,var(--glow-1) 7%,transparent),transparent 65%),radial-gradient(800px 520px at -10% 30%,color-mix(in oklab,var(--glow-2) 6%,transparent),transparent 60%),var(--bg);background-attachment:fixed}
html,body{background:var(--bg);color:var(--text)}
body{background:radial-gradient(900px 520px at 85% -8%,color-mix(in oklab,var(--glow-1) 16%,transparent),transparent 65%),radial-gradient(800px 520px at -10% 30%,color-mix(in oklab,var(--glow-2) 10%,transparent),transparent 60%),var(--bg);background-attachment:fixed;min-height:100%}
body{font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:var(--safe-area-inset-top,env(safe-area-inset-top,0px));z-index:10;background:var(--bg)}
*{box-sizing:border-box}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px;border-radius:8px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
p{margin:0}
.wrap{max-width:1200px;margin:0 auto;padding-left:max(16px,var(--safe-area-inset-left,env(safe-area-inset-left,0px)));padding-right:max(16px,var(--safe-area-inset-right,env(safe-area-inset-right,0px)))}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.09em;color:var(--muted)}

/* Header */
header.top{position:sticky;top:var(--safe-area-inset-top,env(safe-area-inset-top,0px));z-index:20;background:color-mix(in oklab,var(--bg) 90%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.top-in{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;padding-block:12px}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto}
.brand h1{font-size:20px;font-weight:800}
.brand h1 span{color:var(--brass)}
.brand small{display:block;font-size:12px;color:var(--muted);font-family:var(--f-body)}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;max-width:100%}
.tabs button{padding:8px 13px;border-radius:10px;font-weight:600;font-size:14px;color:var(--muted);white-space:nowrap}
.tabs button:hover{color:var(--text);background:var(--surface)}
.tabs button[aria-selected="true"]{color:var(--brass-ink);background:linear-gradient(135deg,var(--brass),var(--brass-2))}
.quick{display:flex;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:13px;font-weight:600;color:var(--muted)}
.chip:hover{color:var(--text);border-color:var(--faint)}
.chip.on{color:var(--leaf);border-color:color-mix(in oklab,var(--leaf) 60%,transparent);background:color-mix(in oklab,var(--leaf) 12%,var(--surface))}
.chip.warn{color:var(--ember);border-color:color-mix(in oklab,var(--ember) 50%,transparent)}
.icon{width:16px;height:16px;flex:none}

main{padding-block:22px 64px;display:grid;gap:22px}
.card{background:color-mix(in oklab,var(--surface) 88%,transparent);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.card.flat{background:transparent}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.between{justify-content:space-between}
.muted{color:var(--muted)}

/* Play layout */
.desk{display:grid;grid-template-columns:250px minmax(0,1fr);gap:22px;align-items:start}
.songs{display:grid;gap:6px;position:sticky;top:84px;max-height:calc(100vh - 100px);overflow-y:auto;scrollbar-width:thin;padding-right:4px}
.tierhead{grid-column:1 / -1;padding:10px 4px 2px}
.tierhead:first-child{padding-top:0}
.song{display:block;width:100%;text-align:left;padding:11px 12px;border-radius:12px;border:1px solid transparent;position:relative}
.song:hover{background:var(--surface)}
.song.sel{background:var(--surface-2);border-color:var(--line)}
.song b{display:block;font-weight:700;font-size:14px;line-height:1.3;padding-right:20px}
.song i{display:block;font-style:normal;font-size:12px;color:var(--muted)}
.song .chords{font-family:var(--f-mono);font-size:11px;color:var(--brass);margin-top:3px}
.song .del{position:absolute;right:8px;top:9px;color:var(--faint);font-size:16px;line-height:1;padding:2px 5px;border-radius:6px}
.song .del:hover{color:var(--ember);background:var(--surface-3)}
.add{border:1px dashed var(--line);color:var(--brass);font-weight:600;font-size:13px;padding:10px;border-radius:12px;text-align:center}
.add:hover{border-color:var(--brass)}
.stage{display:grid;gap:18px;min-width:0}

.now{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:end}
.now h2{font-size:clamp(24px,3.4vw,34px);font-weight:800;line-height:1.1}
.now .meta{color:var(--muted);margin-top:4px;font-size:14px}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.tag{font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--surface-2);color:var(--muted)}
.chordnow{display:flex;align-items:flex-end;gap:14px}
.chordnow .big{font-family:var(--f-display);font-weight:800;font-size:64px;line-height:.9;background:linear-gradient(135deg,var(--brass),var(--brass-2));-webkit-background-clip:text;background-clip:text;color:transparent;min-width:1.4em;text-align:right}
.chordnow .next{font-size:12px;color:var(--muted);line-height:1.3;padding-bottom:6px}
.chordnow .next b{display:block;font-family:var(--f-display);font-size:24px;color:var(--text)}

/* Transport */
.transport{display:grid;gap:16px}
.tp-main{display:flex;flex-wrap:wrap;align-items:center;gap:14px}
.play{display:inline-flex;align-items:center;gap:10px;height:52px;padding:0 22px 0 18px;border-radius:999px;background:linear-gradient(135deg,var(--leaf),var(--leaf-2));color:var(--leaf-ink);font-weight:700;font-size:15px;box-shadow:0 6px 24px -10px var(--leaf)}
.play.stop{background:var(--ember);color:var(--ember-ink);box-shadow:0 6px 24px -10px var(--ember)}
.play svg{width:20px;height:20px}
.bpm{display:flex;align-items:center;gap:4px;background:var(--surface-2);border-radius:999px;padding:4px}
.bpm button{width:36px;height:36px;border-radius:50%;font-size:18px;font-weight:700;color:var(--muted)}
.bpm button:hover{background:var(--surface-3);color:var(--text)}
.bpm .val{min-width:74px;text-align:center;font-family:var(--f-mono);font-weight:700;font-size:18px}
.bpm .val small{font-size:10px;color:var(--muted);display:block;line-height:1;font-family:var(--f-body);font-weight:600;letter-spacing:.08em}
.tap{padding:0 14px!important;width:auto!important;border-radius:999px!important;font-size:12px!important;letter-spacing:.06em}
.seg{display:inline-flex;background:var(--surface-2);padding:3px;border-radius:12px;gap:2px;flex-wrap:wrap}
.seg button{padding:7px 12px;border-radius:9px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button:hover{color:var(--text)}
.seg button[aria-pressed="true"]{background:var(--surface-3);color:var(--text);box-shadow:inset 0 0 0 1px var(--line)}
.tp-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.mixer{display:grid;gap:8px}
.slider{display:grid;grid-template-columns:72px minmax(0,1fr) 38px;align-items:center;gap:10px;font-size:13px;color:var(--muted)}
.slider span:last-child{font-family:var(--f-mono);font-size:12px;text-align:right}
input[type=range]{width:100%;accent-color:var(--brass);height:20px}
.checks{display:grid;gap:8px;font-size:13px}
.checks label{display:flex;align-items:center;gap:9px;color:var(--muted);cursor:pointer}
.checks input{accent-color:var(--brass);width:16px;height:16px}

/* Beat strip */
.beats{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:6px}
.beats.b16 .beat:nth-child(4n+1){border-left:2px solid color-mix(in oklab,var(--brass) 45%,transparent)}
.beats.b16 .beat:not(.hit) .t{visibility:hidden}
.beat{border-radius:12px;padding:8px 2px 7px;text-align:center;background:var(--surface-2);border:1px solid transparent;transition:transform .06s,background .06s}
.beat .n{font-family:var(--f-mono);font-size:12px;color:var(--muted);font-weight:700}
.beat .a{height:22px;display:flex;align-items:center;justify-content:center;color:var(--text)}
.beat .a svg{width:18px;height:18px}
.beat .t{font-size:10px;font-weight:700;letter-spacing:.06em;color:var(--faint);text-transform:uppercase}
.beat.rest .a{color:var(--faint)}
.beat.hit{background:color-mix(in oklab,var(--brass) 14%,var(--surface-2));border-color:color-mix(in oklab,var(--brass) 35%,transparent)}
.beat.edit{cursor:pointer;border:1px dashed var(--brass)}
.beat.cur{background:linear-gradient(160deg,var(--brass),var(--brass-2));transform:scale(1.04)}
.beat.cur *{color:var(--brass-ink)!important}
.count{font-family:var(--f-display);font-weight:800;color:var(--brass);font-size:15px}

/* Fretboard */
.board{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 16px 12px}
.board-scroll{overflow-x:auto;margin-inline:-6px;padding-inline:6px}
.board svg{display:block;width:100%;height:auto;user-select:none}
.board-scroll svg{min-width:620px}
.str{cursor:pointer}
.str.vib .line{animation:vib .045s linear 8}
.str.vibx .line{animation:vibx .045s linear 8}
@keyframes vibx{0%{transform:translateX(0)}25%{transform:translateX(-1.3px)}75%{transform:translateX(1.3px)}100%{transform:translateX(0)}}
@keyframes vib{0%{transform:translateY(0)}25%{transform:translateY(-1.3px)}75%{transform:translateY(1.3px)}100%{transform:translateY(0)}}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:12px;color:var(--muted);margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.legend .dot{width:18px;height:18px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:#111;margin-right:6px;vertical-align:middle}

/* Chart */
.chart{display:grid;gap:14px}
.part{display:grid;gap:8px}
.part.dim{opacity:.45}
.part-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.loopchip{padding:4px 10px;font-size:12px}
.bars{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:6px}
.bar{position:relative;padding:12px 6px 8px;border-radius:10px;background:var(--surface-2);text-align:center;border:1px solid transparent}
.bar:hover{border-color:var(--line)}
.bar b{font-family:var(--f-display);font-size:20px;font-weight:800;display:block;line-height:1.1}
.bar b.split{font-size:15px;display:flex;justify-content:center;gap:6px;align-items:baseline}
.bar b.split i{font-style:normal;padding-left:6px;border-left:1px solid currentColor;opacity:.85}
.bar small{position:absolute;left:7px;top:4px;font-family:var(--f-mono);font-size:10px;color:var(--faint)}
.bar.cur{background:linear-gradient(160deg,var(--brass),var(--brass-2));color:var(--brass-ink)}
.bar.cur small{color:var(--brass-ink)}
.bar.start{border-color:var(--brass)}
.bar .prog{position:absolute;left:0;bottom:0;height:3px;background:var(--brass-ink);opacity:.5;border-radius:0 0 0 10px}

.diagrams{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.dg{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 10px 8px;text-align:left;display:flex;flex-direction:column;gap:2px}
.dg:hover{border-color:var(--faint)}
.dg.sel{border-color:var(--brass);background:color-mix(in oklab,var(--brass) 7%,var(--surface))}
.dg .hd{display:flex;align-items:baseline;justify-content:space-between;gap:6px}
.dg .nm{font-family:var(--f-display);font-weight:800;font-size:20px}
.dg .badge{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--sky);border:1px solid color-mix(in oklab,var(--sky) 40%,transparent);padding:1px 6px;border-radius:6px}
.dg .ft{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dg .ft.easy{color:var(--leaf)}
.dg svg{width:100%;height:auto}

.tip{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:start;font-size:14px;color:var(--muted);max-width:75ch}
.tip b{color:var(--text)}
.tip .mark{font-family:var(--f-display);font-weight:800;color:var(--brass);font-size:13px;letter-spacing:.06em;text-transform:uppercase;padding-top:1px}

.section-head{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:6px 16px;margin-bottom:12px}
.section-head h3{font-size:18px}
.section-head p{font-size:13px;color:var(--muted)}
.lead{font-size:15px;color:var(--muted);max-width:68ch}
.lead strong{color:var(--text)}
h2.page{font-size:clamp(24px,3vw,30px);font-weight:800}

/* Skank */
.rules{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.rule{padding:14px;border-radius:12px;background:var(--surface-2)}
.rule h4{margin:0 0 4px;font-size:14px;font-family:var(--f-display)}
.rule p{font-size:13px;color:var(--muted)}
.levels{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}
.level{text-align:left;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--surface)}
.level b{display:block;font-size:14px}
.level span{font-size:12px;color:var(--muted)}
.level[aria-pressed="true"]{border-color:var(--leaf);background:color-mix(in oklab,var(--leaf) 10%,var(--surface))}
.level[aria-pressed="true"] b{color:var(--leaf)}
.sk{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:8px}
.skc{border-radius:14px;padding:12px 4px;text-align:center;background:var(--surface-2);border:1px solid transparent;display:grid;gap:4px;justify-items:center}
.skc .n{font-family:var(--f-display);font-weight:800;font-size:22px;line-height:1}
.skc .w{font-size:11px;font-weight:800;letter-spacing:.06em}
.skc .s{font-size:10px;color:var(--muted)}
.skc.boom .w{color:var(--brass)}
.skc.tjack{background:color-mix(in oklab,var(--leaf) 10%,var(--surface-2));border-color:color-mix(in oklab,var(--leaf) 30%,transparent)}
.skc.tjack .w{color:var(--leaf)}
.skc.cur.boom{background:var(--brass);transform:scale(1.05)}
.skc.cur.tjack{background:var(--leaf);transform:scale(1.05)}
.skc.cur *{color:#111!important}
.coach{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:start;padding:14px;border-radius:12px;background:var(--surface-2);font-size:14px}
.coach .big{font-family:var(--f-display);font-weight:800;font-size:34px;color:var(--leaf);line-height:1;min-width:1.6em}

/* Byten */
.pick{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px}
.pick label{display:grid;gap:4px;font-size:12px;color:var(--muted);font-weight:600}
select{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-weight:600;max-width:100%}
.swap{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.swap button{padding:12px;border-radius:12px;background:var(--surface-2);font-weight:700;border:1px solid transparent}
.swap button[aria-pressed="true"]{border-color:var(--brass);color:var(--brass);background:color-mix(in oklab,var(--brass) 10%,var(--surface-2))}
.lists{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.lists ul{margin:0;padding:0;list-style:none;display:grid;gap:8px;font-size:14px}
.lists li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:9px;align-items:start}
.lists li .fd{width:20px;height:20px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:#111;margin-top:1px}

/* Tuner */
.tuner{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.tstr{text-align:left;padding:14px;border-radius:14px;border:1px solid var(--line);background:var(--surface);display:grid;gap:6px}
.tstr:hover{border-color:var(--faint)}
.tstr.sel{border-color:var(--brass);background:color-mix(in oklab,var(--brass) 8%,var(--surface))}
.tstr .nt{font-family:var(--f-display);font-weight:800;font-size:34px;line-height:1}
.tstr .hz{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.tstr .kind{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.tstr .wire{height:6px;border-radius:4px}

/* Modal */
.scrim{position:fixed;inset:0;z-index:57;background:color-mix(in oklab,var(--bg) 70%,transparent);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;padding:16px}
.modal{width:100%;max-width:460px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px;display:grid;gap:14px;max-height:100%;overflow:auto}
.modal input[type=text]{width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.slots{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.slots select{width:100%;padding:8px 6px}
.btn{padding:9px 16px;border-radius:10px;font-weight:700;font-size:14px;background:var(--surface-2)}
.btn.primary{background:linear-gradient(135deg,var(--brass),var(--brass-2));color:var(--brass-ink)}
.btn:disabled{opacity:.4;cursor:default}

.kbd{font-family:var(--f-mono);font-size:11px;border:1px solid var(--line);border-bottom-width:2px;padding:0 5px;border-radius:5px;color:var(--muted)}



/* Spela med: boll som landar på nästa ackord */
.pa{position:relative;height:370px;overflow:hidden;border-radius:20px;border:1px solid var(--line);background:radial-gradient(120% 80% at 50% 0%,color-mix(in oklab,var(--brass) 18%,var(--surface)),var(--surface) 70%);touch-action:manipulation}
.pa-msg{position:absolute;top:12px;left:16px;right:16px;display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--muted)}
.pa-msg b{color:var(--text)}
.pa-part{font-size:11px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--brass)}
.pa-ball{position:absolute;left:0;top:0;width:24px;height:24px;margin:-12px 0 0 -12px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,var(--brass-2) 45%,var(--brass));box-shadow:0 0 22px color-mix(in oklab,var(--brass) 80%,transparent);z-index:3;will-change:transform;pointer-events:none}
.pa-trail{position:absolute;inset:0;pointer-events:none;z-index:2}
.pa-track{position:absolute;inset:0;will-change:transform}
.pa-card{position:absolute;top:104px;width:40%;max-width:200px;transform:translateX(-50%);transform-origin:50% 0;display:grid;justify-items:center;gap:8px;will-change:transform,opacity}
.pa-card .pill{font-family:var(--f-display);font-weight:800;font-size:24px;line-height:1.2;padding:4px 18px;border-radius:999px;color:var(--text);transition:background .2s,color .2s}
.pa-card.cur .pill{background:var(--text);color:var(--bg)}
.pa-ball.center{left:50%;z-index:4}
.pa::after{content:"";position:absolute;left:50%;top:84px;bottom:34px;width:2px;margin-left:-1px;background:linear-gradient(var(--brass),transparent);opacity:.25;pointer-events:none}
.pa-card .dg{background:transparent;border:0;padding:0;width:100%}
.pa-card .dg:hover{border:0}
.pa-card .dg .hd,.pa-card .dg .ft{display:none}
.pa-card .dg svg{max-width:150px;margin:0 auto}
.pa-dots{position:absolute;left:16px;right:16px;bottom:14px;display:flex;gap:4px}
.pa-dots i{flex:1;height:7px;border-radius:4px;background:var(--surface-3);transition:background .08s}
.pa-dots i.on{background:linear-gradient(90deg,var(--brass),var(--brass-2))}
.pa-dots i.gap{margin-left:6px}
.pa-count{position:absolute;top:56px;left:0;right:0;text-align:center;font-family:var(--f-display);font-weight:800;font-size:28px;color:var(--brass)}
.pa-hint{position:absolute;left:0;right:0;bottom:30px;text-align:center;font-size:12px;color:var(--muted)}
/* Skank: studsande boll */
.bounce{position:relative;padding-top:58px}
.bounce .pa-ball{width:20px;height:20px;margin:-10px 0 0 -10px;background:radial-gradient(circle at 35% 30%,#fff,var(--leaf-2) 45%,var(--leaf));box-shadow:0 0 20px color-mix(in oklab,var(--leaf) 80%,transparent)}
.bounce .count-row span{position:relative}
.bounce .count-row span.tj{border-bottom:3px solid color-mix(in oklab,var(--leaf) 45%,transparent)}
.bounce .count-row span.on.tj{animation:tjack .25s ease-out}
@keyframes tjack{0%{transform:scale(1.2)}100%{transform:scale(1)}}
@media (max-width:760px){.pa{height:372px}.pa-card{top:96px}}

/* Skank-animation */
.anim{display:grid;gap:14px}
.anim-head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px}
.anim-word{display:flex;align-items:baseline;gap:12px;min-width:0}
.anim-word b{font-family:var(--f-display);font-weight:800;font-size:clamp(34px,7vw,52px);line-height:1;letter-spacing:-.02em}
.anim-word b.tj{background:linear-gradient(135deg,var(--leaf),var(--leaf-2));-webkit-background-clip:text;background-clip:text;color:transparent}
.anim-word b.du{background:linear-gradient(135deg,var(--brass),var(--brass-2));-webkit-background-clip:text;background-clip:text;color:transparent}
.anim-word span{font-size:14px;color:var(--muted);max-width:40ch}
.anim-panels{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:12px}
.panel{background:var(--surface-2);border-radius:14px;padding:10px;display:grid;gap:6px;min-width:0}
.panel svg{width:100%;height:auto;display:block}
.anim-panels .panel:last-child svg{max-width:230px;margin:0 auto}
.panel .cap{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted);font-weight:600}
.panel .cap .state{font-family:var(--f-display);font-weight:800;font-size:13px;letter-spacing:.06em}
.count-row{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:4px}
.count-row span{text-align:center;padding:6px 0;border-radius:9px;font-family:var(--f-display);font-weight:800;font-size:16px;color:var(--faint);background:var(--surface-2);transition:background .08s,color .08s}
.count-row span.on.du{background:linear-gradient(160deg,var(--brass),var(--brass-2));color:var(--brass-ink)}
.count-row span.on.tj{background:linear-gradient(160deg,var(--leaf),var(--leaf-2));color:var(--leaf-ink)}
.emo{font-family:"Noto Color Emoji","Apple Color Emoji","Segoe UI Emoji",sans-serif;filter:drop-shadow(0 4px 4px rgba(0,0,0,.35))}
.chop{animation:chop .42s cubic-bezier(.3,.9,.3,1)}
@keyframes chop{0%{transform:translateY(0)}22%{transform:translateY(56px)}100%{transform:translateY(0)}}
.ring{animation:ring .5s ease-out forwards}
@keyframes ring{0%{opacity:1;transform:translateY(0)}10%{transform:translateY(-1.6px)}20%{transform:translateY(1.6px)}30%{transform:translateY(-1px)}40%{transform:translateY(0)}100%{opacity:0}}
.thud{animation:thud .5s ease-out forwards;transform-box:fill-box;transform-origin:center}
@keyframes thud{0%{opacity:.9;transform:scale(.4)}100%{opacity:0;transform:scale(2.2)}}
.trail{animation:trail .42s ease-out forwards}
@keyframes trail{0%{opacity:0}15%{opacity:.9}100%{opacity:0}}
.press{animation:press .5s ease-out forwards;transform-box:fill-box;transform-origin:center}
@keyframes press{0%{transform:scale(1.25)}100%{transform:scale(1)}}
.strip{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.strip .panel h4{margin:0;font-family:var(--f-display);font-size:15px}
.strip .panel p{font-size:12.5px;color:var(--muted);line-height:1.4}
.strip .num{display:inline-flex;width:22px;height:22px;border-radius:50%;align-items:center;justify-content:center;font-size:12px;font-weight:800;margin-right:6px;color:var(--brass-ink);background:linear-gradient(135deg,var(--brass),var(--brass-2))}
.vidlink{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding:12px 14px;border-radius:14px;border:1px dashed var(--line);font-size:14px;color:var(--muted)}
.vidlink a{color:var(--brass);font-weight:700;text-decoration:none}
.vidlink a:hover{text-decoration:underline}
@media (max-width:760px){
  .anim-panels{grid-template-columns:minmax(0,1fr)}
  .strip{grid-template-columns:minmax(0,1fr)}
  .strip .panel{grid-template-columns:110px minmax(0,1fr);align-items:center;gap:10px}
}

/* Skank-skolan, förenklad */
.sk-intro .lead{max-width:56ch}
.sk-main{position:relative;display:grid;gap:14px;overflow:hidden}
.sk-flash{position:absolute;inset:0;pointer-events:none;border-radius:inherit;box-shadow:inset 0 0 0 3px var(--leaf),inset 0 0 60px color-mix(in oklab,var(--leaf) 35%,transparent);animation:skflash .35s ease-out forwards}
@keyframes skflash{0%{opacity:1}100%{opacity:0}}
.sk-cue{display:grid;justify-items:center;text-align:center;min-height:96px;align-content:center;gap:2px}
.sk-cue b{font-family:var(--f-display);font-weight:800;font-size:64px;line-height:1;letter-spacing:-.02em}
.sk-cue span{font-size:14px;color:var(--muted);font-weight:600}
.sk-cue.idle b{font-size:40px;color:var(--text)}
.sk-cue.count b{color:var(--brass);animation:tjack .3s ease-out}
.sk-cue.du b{color:color-mix(in oklab,var(--brass) 70%,var(--muted))}
.sk-cue.tj b{background:linear-gradient(135deg,var(--leaf),var(--leaf-2));-webkit-background-clip:text;background-clip:text;color:transparent;animation:tjack .25s ease-out}
.sk-cue.tj span{color:var(--leaf)}
.sk-lane{padding-top:66px}
.sk-lane .pa-ball{width:24px;height:24px;margin:-12px 0 0 -12px}
.sk-row{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:4px}
.sk-row span{display:grid;justify-items:center;gap:2px;padding:10px 0 8px;border-radius:12px;background:var(--surface-2);color:var(--faint);transition:background .08s,color .08s}
.sk-row span b{font-family:var(--f-display);font-weight:800;font-size:22px;line-height:1}
.sk-row span small{font-size:10px;font-weight:800;letter-spacing:.04em}
.sk-row span.tj{background:color-mix(in oklab,var(--leaf) 12%,var(--surface-2));color:color-mix(in oklab,var(--leaf) 75%,var(--text))}
.sk-row span.on.du{background:linear-gradient(160deg,var(--brass),var(--brass-2));color:var(--brass-ink)}
.sk-row span.on.tj{background:linear-gradient(160deg,var(--leaf),var(--leaf-2));color:var(--leaf-ink);animation:tjack .25s ease-out}
.sk-hands{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:10px}
.sk-hands .panel p{margin:0;font-size:13px;line-height:1.35;color:var(--text)}
.sk-hands .panel:last-child svg{max-width:200px;margin:0 auto}
.sk-mute{font-size:78px;text-align:center;line-height:1.6}
.sk-ctl{display:grid;grid-template-columns:minmax(0,1fr);gap:12px;border-top:1px solid var(--line);padding-top:14px}
.sk-opt{display:grid;grid-template-columns:minmax(0,1fr);gap:6px;min-width:0}
.sk-lab{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.sk-grip{flex-wrap:wrap}
.sk-tip{margin:0;font-size:13px}
.sk-more>summary{font-size:15px;color:var(--text)}
@media (max-width:760px){
  .sk-cue{min-height:84px}
  .sk-cue b{font-size:56px}
  .sk-row span b{font-size:18px}
  .sk-row span small{font-size:9px}
  .sk-hands{grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:8px}
  .sk-hands .panel{padding:8px}
  .sk-hands .panel p{font-size:12px}
  .sk-hands .panel .cap{font-size:11px}
  .sk-mute{font-size:58px}
}

/* Tjack-skolan */
.sk-mode{justify-self:start}
.sk-mode button{padding:9px 16px;font-size:14px}
.tj-scene svg{width:100%;height:auto;display:block;border-radius:18px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.sk-cue.tjk.hit b{background:linear-gradient(135deg,var(--leaf),var(--leaf-2));-webkit-background-clip:text;background-clip:text;color:transparent;animation:tjack .25s ease-out}
.sk-cue.tjk.x b{color:#ff9a4a;animation:tjack .25s ease-out}
.sk-cue.tjk.x span{color:#ff9a4a}
.sk-cue.tjk.air b{color:var(--faint);font-size:40px}
.tj-flash{box-shadow:inset 0 0 0 3px #ff9a4a,inset 0 0 60px rgba(255,154,74,.35)}
.tj-row span.x{background:rgba(255,154,74,.14);color:#ffb37a}
.tj-row span.air{opacity:.55}
.tj-row span.on.x{background:linear-gradient(160deg,#ff9a4a,#ffb35c);color:#2a1205;animation:tjack .25s ease-out}
.tj-row span.on.du{background:linear-gradient(160deg,var(--leaf),var(--leaf-2));color:var(--leaf-ink)}
.tj-row span.on.air{background:var(--surface-3);color:var(--text);opacity:1}
.tj-left{margin:0;font-size:13px;color:var(--muted);text-align:center}
.tj-how{display:grid;gap:10px;margin-top:12px}
.tj-how p{margin:0;font-size:14px;line-height:1.45}

:root{--wv-band:#2b2348}
:root[data-skin="salvia"]{--wv-band:#e9dfce}
.tjl-list{display:grid;gap:8px}
.tjl{display:flex;align-items:center;gap:12px;text-align:left;padding:10px 12px;border-radius:16px;border:1px solid var(--line);background:var(--surface);color:var(--text)}
.tjl svg{flex:none;width:112px;height:36px}
.tjl b{display:block;font-size:15px}
.tjl small{font-size:12px;color:var(--muted)}
.tjl.done small{color:var(--leaf)}
.tjl.rec small{color:#ffb37a}
.tjl[aria-pressed="true"]{border-color:var(--leaf);box-shadow:inset 0 0 0 1px var(--leaf);background:color-mix(in oklab,var(--leaf) 8%,var(--surface))}
.pat-presets{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.sk-ctl>.inline-play{justify-self:start;min-width:220px}

/* Stora skärmar: lite större och bredare, så att appen inte blir en smal remsa */
@media (min-width:1700px){.wrap{max-width:1360px}}
@media (min-width:2400px) and (min-height:1100px){html{zoom:1.25}.wrap{max-width:1500px}}
/* Bred skärm: menyn som en lodrät sidopanel till vänster */
.tab-ic{display:none}
@media (min-width:1400px){
  .app{padding-left:248px}
  header.top{position:fixed;top:0;left:0;bottom:0;width:248px;border-bottom:0;border-right:1px solid var(--line);overflow-y:auto}
  header.top>.wrap.top-in{max-width:none;margin:0;padding:24px 16px;flex-direction:column;align-items:stretch;flex-wrap:nowrap;gap:24px;min-height:100%;box-sizing:border-box}
  .brand{margin-right:0}
  .brand small{max-width:170px}
  .tabs{flex-direction:column;overflow:visible;gap:4px}
  .tabs button{display:flex;align-items:center;gap:12px;padding:12px 14px;font-size:15px;text-align:left}
  .tab-ic{display:block;width:20px;height:20px;flex:none}
  .quick{margin-top:auto;flex-wrap:wrap}
  .quick .lvl{width:100%;justify-content:flex-start}
  .toasts{left:calc(50% + 124px)}
}
/* Dagens lektion och ny startsida */

/* Kolla grepp */

.path{display:grid;gap:0;list-style:none;margin:0;padding:0}

/* =====================================================================
   DESIGNSYSTEM · NylonGitarr Studio
   Färgroller (gäller båda skinnen):
     --ember  = huvudhandling: Starta, Kör igång, Slå an. En per vy.
     --text   = påslaget val (chips, vyknappar) och Stoppa.
     --leaf   = klart / rätt / framsteg.
     --sky    = information och grepp.
   Former: kort 20px, kontroller 14px, piller 999px. Avstånd 8/12/18/24.
   ===================================================================== */
:root{--ds-r:20px;--ds-r-ctl:14px;--ds-shadow:0 1px 0 rgba(255,255,255,.5) inset,0 10px 28px -20px rgba(60,30,10,.45)}
.card{border-radius:var(--ds-r);box-shadow:var(--ds-shadow)}
.ds-page{display:grid;gap:24px}
.ds-eyebrow{font-size:12px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:0 0 10px}
h2.page{font-family:var(--f-display);font-size:clamp(28px,3.4vw,38px);font-weight:800;line-height:1.08;letter-spacing:-.01em}
h2.page + .lead,.page + .lead{margin-top:6px}
.lead{font-size:16px;line-height:1.45}
/* Huvudknapp */
.play,:root:is([data-skin="salvia"],[data-skin="riddim"],[data-skin="neon"],[data-skin="sol"],[data-skin="svartvit"]) .play{background:var(--ember);color:var(--ember-ink);font-weight:700;box-shadow:0 10px 24px -14px var(--ember)}
.play:hover{filter:brightness(1.06)}
.play.stop,:root:is([data-skin="salvia"],[data-skin="riddim"],[data-skin="neon"],[data-skin="sol"],[data-skin="svartvit"]) .play.stop{background:var(--text);color:var(--bg);box-shadow:none}
.fab{background:var(--text);color:var(--bg)}
.btn{border-radius:var(--ds-r-ctl)}
.btn.primary,.ls-btn{background:var(--ember);color:var(--ember-ink)}
.ls-btn.ghost{background:var(--surface-2);color:var(--text)}
/* Val: segment och chips */
.seg{border-radius:var(--ds-r-ctl);padding:4px;gap:2px}

.game{border-radius:var(--ds-r);padding:18px;transition:border-color .12s,transform .12s}

.bib-group{display:grid}
.bib{grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}

.gd-six{grid-template-columns:repeat(auto-fill,minmax(120px,170px))!important;justify-content:start}

nts, x2–x4 for long streaks.", "Hela tvåveckorsplanen är klar!": "The whole two-week plan is done!", "Hi-hatten håller tempot jämnt. Lägg den på varje åttondel: alla siffror och alla &.": "The hi-hat keeps the tempo even. Put it on every eighth: all numbers and all &.", "Hittade inga ackord än. Ackorden ska stå på egna rader eller inom [ ] i texten.": "Found no chords yet. The chords should be on their own lines or inside [ ] in the text.", "Hoppa över": "Skip", "Hoppar en sträng, till": "Skips a string, to", "Hur funkar en takt?": "How does a bar work?", "Hur många byten hinner du på 60 sekunder? Slå ditt eget rekord varje dag.": "How many changes can you make in 60 seconds? Beat your own record every day.", "Huvudriffet flyttat en sträng upp.": "The main riff moved up one string.", "Hämta framsteg": "Get progress", "Håll Am-greppet och plocka en sträng i taget.": "Hold the Am shape and pick one string at a time.", "Håll Em-greppet hela tiden. Mjukt och drömskt.": "Hold the Em shape the whole time. Soft and dreamy.", "Håll Em. Slå ner på 1 så att det klingar, och låt handkanten landa på 2. Upp på &.": "Hold Em. Strike down on 1 so it rings, and let the edge of the hand land on 2. Up on &.", "Hög": "High", "Hör ackordet": "Hear the chord", "Hör en skank": "Hear a skank", "Hör ett tjack": "Hear a chop", "Hör ett vanligt slag": "Hear a normal strum", "Hör långt ackord": "Hear a long chord", "I reggae (one drop) slår bastrumman bara på 3. Det är det som ger reggaen dess gung.": "In reggae (one drop) the kick drum only hits on 3. That's what gives reggae its groove.", "I reggae ligger hi-hatten gärna på baktakten, alltså &-rutorna mellan slagen.": "In reggae the hi-hat likes to sit on the offbeat, the & boxes between the beats.", "I reggae passar en handklapp på 3.": "In reggae a hand clap on 3 fits.", "I reggae slår virveln eller kantslaget tillsammans med bastrumman på 3.": "In reggae the snare or rim shot hits together with the kick on 3.", "Igång!": "Go!", "Imorgon" . Measure with the same headphones or speaker you usually use.", "Omspunna basen": "The wound bass", "Originalet går i Bb. Med capo 3 spelar du det med G-, C-, D- och Em-greppen. I refrängen delar två ackord på takten, så tänk \"C G, D G\" på två slag var.": "The original is in Bb. With capo 3 you play it with the G, C, D and Em shapes. In the chorus two chords share the bar, so think \"C G, D G\" on two beats each.", "Originalet går i Bm och F#m. Med capo 2 blir det Am och Em, alltså bara två ackord. Släpp trycket i vänsterhanden direkt efter varje slag så att tonen blir kort.": "The original is in Bm and F#m. With capo 2 it becomes Am and Em, so just two chords. Release the pressure in your left hand right after each strum so the note is short.", "Originalet är bara Bob Marley och en akustisk gitarr. I refrängen tar C och D två slag var. Bas på slag 1 och 3, ljusa strängar däremellan.": "The original is just Bob Marley and an acoustic guitar. In the chorus C and D take two beats each. Bass on beat 1 and 3, bright strings in between.", "Originaltonart · capo": "Original key · capo", "Passar tvåackordsgunget.": "Suits the two-chord groove.", "Pausat. Välj komp och lyssna in dig, inspelningen står still tills du fortsätter.": "Paused. Choose a comp and listen in, the recording stands still until you continue.", "Pekfingret ligger platt över de två tunnaste strängarna på band 1.": "The index finger lies flat across the two thinnest strings on fret 1.", "Pekfingret på 3:e strängen band 2, ankaret på band 3. Slå inte an de två tjockaste.": "The index finger on the 3rd string fret 2, the anchor on fret 3. Don't strum the two thickest.", "Perfekt": "Perfect", "Placera": "Place", "Pricksäker": "Sharpshooter", "Prova att lägga till": "Try adding", "Prova ditt eget ljud på 3.": "Try your own sound on 3.", "Prova när du vill": "Try whenever you like", "Pukor i slutet av takten leder in i nästa.": "Toms at the end of the bar lead into the next.", "Pukor passar som en liten upp a fyra ackord genom hela låten, två slag var: A, G, D/F# och D med capo på band 3 (det låter som C, Bb, F/A och F). Basen går nedåt för varje byte. Är D/F# krångligt tar du ett vanligt D. Ackorden är framtagna ur inspelningen, så säg till om något låter fel.": "The same four chords through the whole song, two beats each: A, G, D/F# and D with a capo on fret 3 (it sounds like C, Bb, F/A and F). The bass walks down with every change. If D/F# is tricky, take an ordinary D. The chords were taken from the recording, so tell me if something sounds wrong.", "Samma fyra ackord genom hela låten: Em, C, G och D, ett ackord per takt. Basen spelar grundton och kvint, så du kan dunsa på tjockaste strängen i varje grepp på 1 och 3. Ackorden är framtagna ur inspelningen, så säg till om något låter fel.": "The same four chords through the whole song: Em, C, G and D, one chord per bar. The bass plays root and fifth, so you can thump the thickest string of each shape on 1 and 3. The chords were taken from the recording, so tell me if something sounds wrong.", "Samma fyra ackord men i drivande tempo. Nästa steg-nivån börjar här.": "The same four chords but at a driving tempo. The Next step level starts here.", "Samma fyra takter genom hela låten: G, Am, C, G. Originalet går i A, och med capo 2 spelar du det med G-, Am- och C-greppen. Börja långsamt.": "The same four bars through the whole song: G, Am, C, G. The original is in A, and with capo 2 you play it with the G, Am and C shapes. Start slowly.", "Samma grepp som Fm, flyttat ett band upp.": "The same shape as Fm, moved up one fret.", "Samma rörelse åtta gånger per takt": "The same motion eight times per bar", "Samma rörelse, men handen går förbi strängarna på två ställen.": "The same motion, but the hand goes past the strings in two places.", "Se bytet i 3D-handen": "See the change in the 3D hand", "Se greppet": "See the shape", "Shakern fyller ut, gärna på varje åttondel som hi-hatten.": "The shaker fills out, preferably on every   tick() {
    const c = this.ctx, p = this.prog; if (!p) return;
    while (this.next < c.currentTime + 0.13) {

      if (this.step % 2 === 1) t += sd * p.swing();
      if (this.bar < 0) { if (this.step % 2 === 0) this.click(t, this.step === 0); }
      else p.onStep(this.step, this.bar, t, sd);
      this.queue.push({ t, type: 'step', step: this.step, bar: this.bar });
      this.log.push({ t, step: this.step, bar: this.bar, sd }); if (this.log.length > 40) this.log.shift();

  stop() { clearInterval(this.timer); this.timer = null; this.prog = null; this.queue = []; this.log = []; }

    const now = this.ctx.currentTime - this.lat(), due = [], keep = [];
    for (const q of this.queue) (q.t <= now ? due : keep).push(q);
    this.queue = keep;

  setMuted(m) { this.muted = m; if (this.master) this.master.gain.setTargetAtTime(m ? 0 : 0.9, this.ctx.currentTime, 0.02); }

// Konfetti vid belöningar (egen liten motor, inga beroenden). Respekterar "minska rörelse".
function confetti(power = 1) {
  try { if (matchMedia('(prefers-reduced-motion: reduce)').matches) return; } catch (e) {}
  const cv = document.createElement('canvas'), dpr = Math.min(2, window.devicePixelRatio || 1);
  cv.className = 'confetti'; cv.width = innerWidth * dpr; cv.height = innerHeight * dpr; document.body.appendChild(cv);
  const x = cv.getContext('2d'), cs = getComputedStyle(document.documentElement);
  const cols = ['--ember', '--leaf', '--brass', '--sky'].map((v) => cs.getPropertyValue(v).trim() || '#c65');
  cols.push('#ffd23f');
  const N = Math.round(90 * power), P = [];
  for (let i = 0; i < N; i++) {
    const side = i % 2 ? 1 : -1, a = (-90 + side * (25 + Math.random() * 30)) * Math.PI / 180, v = (9 + Math.random() * 9) * dpr * (0.8 + power * 0.2);
    P.push({ x: (side < 0 ? 0.12 : 0.88) * cv.width, y: cv.height * 0.85, vx: -side * Math.abs(Math.cos(a)) * v, vy: Math.sin(a) * v, r: Math.random() * 6.28, vr: (Math.random() - 0.5) * 0.3,
      w: (6 + Math.random() * 6) * dpr, h: (3 + Math.random() * 4) * dpr, c: cols[i % cols.length] });
  }
  let t0 = performance.now();
  const step = (now) => {
    const age = (now - t0) / 1000; x.clearRect(0, 0, cv.width, cv.height);
    for (const p of P) { p.vy += 0.32 * dpr; p.vx *= 0.985; p.vy *= 0.985; p.x += p.vx; p.y += p.vy; p.r += p.vr;
      x.save(); x.globalAlpha = Math.max(0, 1 - Math.max(0, age - 1.6) / 0.8); x.translate(p.x, p.y); x.rotate(p.r); x.fillStyle = p.c; x.fillRect(-p.w / 2, -p.h / 2, p.w, p.h * Math.abs(Math.cos(p.r * 2))); x.restore(); }
    if (age < 2.4) requestAnimationFrame(step); else cv.remove();
  };
  requestAnimationFrame(step);
}

function Bpm({ value, set, min = 40, max = 140 }) {
  const taps = useRef([]);
  const tap = () => {
    const now = performance.now(); taps.current = taps.current.filter((x) => now - x < 2500); taps.current.push(now);
    if (taps.current.length >= 3) {
      const t = taps.current, iv = (t[t.length - 1] - t[0]) / (t.length - 1);
      set(Math.max(min, Math.min(max, Math.round(60000 / iv))));
    }
  };
  return html`<div className="bpm">
    <button onClick=${() => set(Math.max(min, value - 2))} aria-label="Långsammare">−</button>
    <div className="val">${value}<small>BPM</small></div>
    <button onClick=${() => set(Math.min(max, value + 2))} aria-label="Snabbare">+</button>
    <button className="tap" onClick=${tap} title="Knacka takten tre gånger">TAP</button>
  </div>`;
}

function SceneMotes() {
  const ref = useRef(null);
  useEffect(() => {
    const c = ref.current, x = c.getContext('2d'); let raf = 0;
    let calm = false; try { calm = matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) {}
    const fit = () => { const r = c.getBoundingClientRect(), d = Math.min(2, devicePixelRatio || 1); c.width = r.width * d; c.height = r.height * d; };
    fit(); addEventListener('resize', fit);
    const P = Array.from({ length: 22 }, () => ({ x: .68 + Math.random() * .3, y: .2 + Math.random() * .34, s: .5 + Math.random() * 1.1, v: 2e-5 + Math.random() * 5e-5, p: Math.random() * 7 }));
    const loop = (t) => {
      x.clearRect(0, 0, c.width, c.height);
      P.forEach((m) => {
        const y = ((m.y - t * m.v * .3 - .15) % .55 + .55) % .55 + .15, X = m.x + Math.sin(t * .0003 + m.p) * .012;
        const dist = Math.hypot(X - .93, y - .24), a = Math.pow(Math.max(0, 1 - dist / .4), 2) * (.5 + .5 * Math.sin(t * .001 + m.p));
        x.fillStyle = `rgba(255,232,190,${a * .6})`; x.beginPath(); x.arc(X * c.width, y * c.height, m.s * (c.width / 520), 0, 7); x.fill();
      });
      if (!calm) raf = requestAnimationFrame(loop);
    };
    raf = requestAnimationFrame(loop);
    return () => { cancelAnimationFrame(raf); removeEventListener('resize', fit); };
  }, []);
  return html`<canvas ref=${ref} className="scene-motes" aria-hidden="true"></canvas>`;
}

function Challenge({ easy, pair, setPair, best, onFinish, fixed = false }) {

    const loop = (t) => {
      rafR.current = requestAnimationFrame(loop); m.read(); const r = m.rms();
      if (lvl.current) lvl.current.style.width = Math.min(100, r * 600) + '%';
      if (t - chk < 70) return; chk = t;
      if (r < cal.gate * 2) { streak = 0; return; }
      const { ch, tot } = m.chroma(); if (tot <= 0) return;
      const want = pair[(cRef.current + 1) % 2], other = pair[cRef.current % 2];
      const share = (k) => { const ps = chordPcs(k, easy); let v = 0; ch.forEach((x, pc) => { if (ps.has(pc)) v += x; }); return v / tot; };
      const a = share(want), b = share(other), need = 0.25 + chordPcs(want, easy).size * 0.07;
      // nästa ackord måste dominera två mätningar i rad
      streak = a >= need && a > b + 0.05 ? streak + 1 : 0;
      if (streak >= 2 && t - last > 300) { streak = 0; last = t; cRef.current++; setCount(cRef.current); }
    };
    rafR.current = requestAnimationFrame(loop);
  };
  const prevBest = best[pair[0] + '-' + pair[1]] || best[pair[1] + '-' + pair[0]] || 0;
  const start = async () => {
    setMicErr(false);
    if (input === 'mic') { try { await listen(); } catch (e) { setMicErr(true); return; } }
    engine.now(); setCount(0); cRef.current = 0; setResult(null); setPhase('count'); setCd(3); engine.click(engine.now(), true);
    let c = 3; const iv = setInterval(() => {
      c--; if (c > 0) { setCd(c); engine.click(engine.now(), true); return; }
      clearInterval(iv); setPhase('run'); if (input !== 'mic') engine.playChord(voicing(pair[0], easy).frets);
      const end = performance.now() + 60000;
      const t = setInterval(() => {
        const l = Math.max(0, (end - performance.now()) / 1000); setLeft(l);
        if (l <= 0) { clearInterval(t); stopMic(); setPhase('done'); const n = cRef.current; setResult({ n, rec: n > prevBest, prev: prevBest }); onFinish(n, pair); engine.click(engine.now(), true); }
      }, 100);
    }, 1000);

    ${!fixed && (phase === 'idle' || phase === 'done') ? html`<div className="row" style=${{ gap: 6 }}>
      ${PAIRS.map((p) => html`<button key=${p.join()} className=${'chip' + (p[0] === pair[0] && p[1] === pair[1] ? ' on' : '')} onClick=${() => setPair(p)}>${p[0]} ↔ ${p[1]}</button>`)}
    </div>` : null}
    ${phase === 'idle' || phase === 'done' ? html`<div className="row between"><span className="label">Räkna bytena</span>
      <div className="seg" role="group" aria-label="Räkna bytena">
        <button aria-pressed=${input === 'tap'} onClick=${() => setInput('tap')}>Jag trycker</button>
        <button aria-pressed=${input === 'mic'} onClick=${() => setInput('mic')}>Mikrofonen lyssnar</button>
      </div></div>` : null}
    ${micErr ? MIC_BLOCKED : null}
    <div className="chal">
      <div className="pair"><span className=${phase === 'run' && curIdx === 0 ? 'on' : ''}>${CHORD_DB[pair[0]].name}</span><span style=${{ padding: 0 }}>↔</span><span className=${phase === 'run' && curIdx === 1 ? 'on' : ''}>${CHORD_DB[pair[1]].name}</span></div>
      ${phase === 'idle' ? html`<p className="lead">Byt fram och tillbaka mellan greppen i en minut. Slå an ackordet och tryck på knappen (eller mellanslag) varje gång du har bytt. Ditt rekord: <strong>${prevBest}</strong> byten.</p>
        <button className="play" onClick=${start}>${I.play}Starta minuten</button>` : null}
      ${phase === 'count' ? html`<div className="count" style=${{ color: 'var(--brass)' }}>${cd}</div><p className="muted">Lägg fingrarna på ${CHORD_DB[pair[0]].name}</p>` : null}
      ${phase === 'run' ? html`<div className="timer"><div className="xpbar"><i style=${{ width: (left / 60 * 100) + '%' }}></i></div><p className="mono muted" style=${{ marginTop: 6 }}>${Math.ceil(left)} s kvar</p></div>

const fmtSec = (ms) => (ms / 1000).toFixed(1).replace('.', ',') + ' s';
function summarizePractice(recs, pair) {
  const times = recs.filter((r) => r.ms > 0 && r.ms < 8000); // längre uppehåll räknas som paus
  const mean = (l) => l.reduce((s, r) => s + r.ms, 0) / l.length;
  const dirs = [[pair[0], pair[1]], [pair[1], pair[0]]].map(([from, to]) => {
    const l = times.filter((r) => r.from === from && r.to === to);
    return { from, to, n: l.length, avg: l.length ? mean(l) : 0 };
  }).filter((d) => d.n > 0);
  const judged = recs.filter((r) => r.ok !== null), clean = judged.filter((r) => r.ok).length;
  const tipCount = {};
  judged.forEach((r) => r.tips.forEach((t) => { tipCount[t] = (tipCount[t] || 0) + 1; }));
  const tips = Object.entries(tipCount).sort((a, b) => b[1] - a[1]).slice(0, 2).map(([text, n]) => ({ text, n }));
  const slow = dirs.length === 2 && Math.abs(dirs[0].avg - dirs[1].avg) > 150 ? (dirs[0].avg > dirs[1].avg ? dirs[0] : dirs[1]) : null;
  return { hits: recs.length, changes: times.length, avg: times.length ? mean(times) : 0, best: times.length ? Math.min(...times.map((r) => r.ms)) : 0, dirs, judged: judged.length, clean, tips, slow };
}
function PracticeCoach({ easy, pair, setPair, onFinish }) {

  const stopMic = () => { cancelAnimationFrame(rafR.current); if (micR.current) micR.current.stop(); micR.current = null; };
  useEffect(() => stopMic, []);
  const judgeJob = (S) => {
    const j = S.job; if (!j) return; S.job = null;
    if (j.frames < 3) return; // för kort anslag för att bedöma
    const out = judgeChord(j.k, easy, j.acc);
    j.rec.ok = out.ok; j.rec.tips = out.tips;
    setLive((l) => ({ ...l, ok: out.ok, msg: out.ok ? 'Rent ackord!' : out.tips[0] }));
  };
  const start = async () => {
    setMicErr(false); setSum(null); setLive({ n: 0, ms: 0, ok: null, msg: '' });
    const m = new Mic();
    try { await m.start({ aec: false }); } catch (e) { setMicErr(true); return; }
    micR.current = m; setPhase('run');
    const cal = micCal(), S = { n: 0, lastHit: 0, chk: 0, streak: 0, job: null, recs: [] };
    stateR.current = S;
    const share = (ch, tot, k) => { const ps = chordPcs(k, easy); let v = 0; ch.forEach((x, pc) => { if (ps.has(pc)) v += x; }); return v / tot; };
    const loop = (t) => {
      rafR.current = requestAnimationFrame(loop); m.read(); const r = m.rms();
      if (lvl.current) lvl.current.style.width = Math.min(100, r * 600) + '%';
      if (S.job) {
        const age = t - S.job.t;
        if (age > 120 && age < 800) { m.notes(S.job.acc); S.job.frames++; }
        if (age >= 800) judgeJob(S);
      }
      if (t - S.chk < 70) return; S.chk = t;
      if (r < cal.gate * 2) { S.streak = 0; return; }
      const { ch, tot } = m.chroma(); if (tot <= 0) return;
      const want = pair[S.n % 2], other = pair[(S.n + 1) % 2];
      const a = share(ch, tot, want), b = share(ch, tot, other), need = 0.25 + chordPcs(want, easy).size * 0.07;
      S.streak = a >= need && a > b + 0.05 ? S.streak + 1 : 0;
      if (S.streak >= 2 && t - S.lastHit > 300) {
        judgeJob(S);
        const ms = S.lastHit ? t - S.lastHit : 0, rec = { from: other, to: want, ms, ok: null, tips: [] };
        S.recs.push(rec); S.job = { t, k: want, acc: new Array(128).fill(0), frames: 0, rec };

      ${phase === 'idle' ? html`<p className="lead">Byt mellan ackorden i din egen takt, utan klocka. Appen lyssnar, mäter hur lång tid bytena tar och hör vilka strängar som inte klingar.</p>

        <div className="chal-mic"><b>Slå an ${CHORD_DB[next].name}</b><div className="gh-lvl cc-lvl" style=${{ width: '100%' }}><i ref=${lvl}></i></div>

          <div className="coach"><span className="big">${sum.changes}</span><div><b>byten</b><br />${sum.changes ? 'Snitt ' + fmtSec(sum.avg) + ', snabbast ' + fmtSec(sum.best) + '.' : 'Spela minst två ackord för att mäta ett byte.'}${sum.prev && sum.avg ? (sum.avg < sum.prev ? ' Snabbare än förra gången (' + fmtSec(sum.prev) + ').' : ' Förra gången: ' + fmtSec(sum.prev) + '.') : ''}</div></div>

        if (st.grid) {
          const gq = st.grid.T / (st.grid.sixteen ? 4 : 2), q = (t - st.grid.ph) / gq, off = Math.abs(q - Math.round(q)) * gq;
          st.streak = off < 0.045 ? st.streak + 1 : 0; st.best = Math.max(st.best, st.streak);
          if (streakR.current) streakR.current.textContent = st.streak + ' slag i takt';
          const C = { 16: 'Som en klocka!', 32: 'Rytmen sitter!', 64: 'Grym takt!', 128: 'Maskin!' }[st.streak];
          if (C) cheer(C);
        }
      }
      st.env = st.env * 0.9 + r * 0.1; st.prev = r;
      if (cvR.current) drawRing(cvR.current, st, t, skinR.current, easy);
      if (tt - st.chk < 70) return; st.chk = tt;
      if (r < cal.gate * 2) {
        st.cand = null; st.n = 0;
        if (st.cur && t - st.last > 1.2) { st.segs.push({ k: st.cur, t0: st.curT, t1: st.last }); st.cur = null; }
        return;
      }
      st.last = t;
      const { ch, tot } = m.chroma(); if (tot <= 0) return;
      const k = guessChord(ch, easy);
      if (!k) { st.cand = null; st.n = 0; return; }
      if (k === st.cand) st.n++; else { st.cand = k; st.n = 1; st.candT = t; }
      if (st.n >= 3 && k !== st.cur) {
        const at = Math.max(0, st.candT - 0.08);
        if (st.cur) st.segs.push({ k: st.cur, t0: st.curT, t1: at });
        st.cur = k; st.curT = at; setNow(k); setTrail((l) => [...l, k].slice(-10));
      }
    };
    st.raf = requestAnimationFrame(loop);
    st.iv = setInterval(() => {
      const t = (performance.now() - T0) / 1000, rec = st.onsets.filter((o) => o.t > t - 12), tp = jamTempo(rec);
      if (!st.gridFixed) { if (tp) st.grid = tp; else if (!rec.length) st.grid = null; }
      // märk när du byter mellan åttondelar och sextondelar, eller byter tempo, och det håller i sig
      if (tp && rec.length >= 12) {
        const L = st.feelNow, six = tp.sixteen, b = tp.bpm;
        if (!L) st.feelNow = { six, bpm: b };
        else if (six !== L.six || Math.abs(b / L.bpm - 1) > 0.1) {
          st.pend = st.pend && st.pend.six === six && Math.abs(b / st.pend.bpm - 1) < 0.07 ? { ...st.pend, n: st.pend.n + 1 } : { six, bpm: b, n: 1 };
          if (st.pend.n >= 3) { cheer(six !== L.six ? (six ? 'Nu: sextondelar' : 'Nu: åttondelar') : 'Nytt tempo: ' + Math.round(b) + ' BPM'); st.feelNow = { six, bpm: b }; st.pend = null; }
        } else { st.pend = null; L.bpm = L.bpm * 0.8 + b * 0.2; }
      }
      setLive({ bpm: st.gridFixed ? Math.round(60 / st.grid.T) : tp ? Math.round(tp.bpm) : 0, secs: t - (st.pausedMs + (st.paused ? performance.now() - st.pauseAt : 0)) / 1000 });
    }, 1000);
    setPaused(false); setPhase('run'); window.scrollTo({ top: 0, behavior: 'instant' });
    if (!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches)) setIntro(Date.now());
  };

  const finish = () => {

    if (st.cur) st.segs.push({ k: st.cur, t0: st.curT, t1: Math.max(st.last, st.curT + 0.3) });
    const r = analyzeJam(st.onsets, st.segs), parts = analyzeSections(st.onsets, st.segs);

    setRes({ ...r, dur: t, hits: st.onsets.length, best: st.best, parts }); setPhase('done');

function MicCalib({ onDone }) {
  const [cal, setCal] = useState(micCal);
  const [step, setStep] = useState('idle'); // idle | quiet | strum | done | blocked
  const [count, setCount] = useState(0);
  const mic = useRef(null), raf = useRef(0), lvl = useRef(null);
  const stop = () => { cancelAnimationFrame(raf.current); if (mic.current) mic.current.stop(); mic.current = null; };
  useEffect(() => stop, []);
  const run = async () => {
    try {
      const m = new Mic(); await m.start({ aec: false }); mic.current = m;
      setStep('quiet'); setCount(0);
      const t0 = performance.now(), Q = []; const P = []; let env = 0.01, last = 0, peak = 0, inHit = false, shown = false;
      const loop = (t) => {
        raf.current = requestAnimationFrame(loop); m.read(); const r = m.rms();
        if (lvl.current) lvl.current.style.width = Math.min(100, r * 600) + '%';
        if (t - t0 < 2200) { if (t - t0 > 300) Q.push(r); return; }
        if (!shown) { shown = true; setStep('strum'); }
        const floor = Q.reduce((a, b) => a + b, 0) / Math.max(1, Q.length);
        if (!inHit && r > Math.max(0.006, floor * 4) && r > env * 2.2 && t - last > 500) { inHit = true; peak = r; last = t; }
        if (inHit) { peak = Math.max(peak, r); if (t - last > 350) { inHit = false; P.push(peak); setCount(P.length); } }

          const c = { floor, strum, sens: cal.sens || 'normal', done: true }; saveMicCal(c); setCal(micCal()); setStep('done'); onDone && onDone();
        } else if (t - t0 > 20000) { stop(); setStep('idle'); }

  };

      <div style=${{ display: 'grid', gap: 8 }}><b>${step === 'quiet' ? 'Var helt tyst i två sekunder…' : 'Slå an alla sex strängarna, tre gånger med en paus emellan'}</b>

const RecDB = (() => {
  let dbp;
  const open = () => dbp || (dbp = new Promise((res, rej) => {
    const r = indexedDB.open('ng-rec', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('rec', { keyPath: 'id' }).createIndex('song', 'song');
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  }));
  const run = (mode, fn) => open().then((db) => new Promise((res, rej) => {
    const t = db.transaction('rec', mode), q = fn(t.objectStore('rec'));
    t.oncomplete = () => res(q ? q.result : undefined); t.onerror = () => rej(t.error);
  }));
  return { put: (r) => run('readwrite', (st) => st.put(r)), del: (id) => run('readwrite', (st) => st.delete(id)), list: (song) => run('readonly', (st) => st.index('song').getAll(song)), all: () => run('readonly', (st) => st.getAll()) };
})();
const fmtDur = (s) => Math.floor(s / 60) + ':' + String(Math.round(s % 60)).padStart(2, '0');

const blobTo64 = (b) => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result).split(',')[1] || ''); r.onerror = rej; r.readAsDataURL(b); });

function LatencySettings() {
  const [ms, setMs] = useState(() => Math.round(engine.userLat * 1000));

  const [msg, setMsg] = useState('');
  const R = useRef(null);

    offs.sort((a, b) => a - b); const med = offs[offs.length >> 1], spread = offs[Math.floor(offs.length * 0.8)] - offs[Math.floor(offs.length * 0.2)];

    </div>

  </div>`;

/* ---------------------------------------------------------------- ackordblad: tolka inklistrad text */
const SECTION_SV = [[/^(pre[- ]?chorus|förrefräng|brygga)/i, 'Förrefräng'], [/^(chorus|refräng|refrain|ref)/i, 'Refräng'], [/^(verse|vers)/i, 'Vers'], [/^(bridge|stick)/i, 'Stick'],
  [/^intro/i, 'Intro'], [/^(outro|avslut|ending)/i, 'Avslut'], [/^(instrumental|interlude|mellanspel)/i, 'Mellanspel'], [/^solo/i, 'Solo'], [/^(hook)/i, 'Refräng']];
const CHORD_RE = /^([A-G])(#|b)?((?:maj|min|m|M|dim|aug|sus|add|°|\+|-)?[0-9]*(?:sus[24]?|add[0-9]+|maj[0-9]*|[0-9]+)*)(\/[A-G](#|b)?)?$/;
const FLAT2SHARP = { Db: 'C#', Eb: 'D#', Gb: 'F#', Ab: 'G#', 'A#': 'Bb' };
function chordKey(raw) {
  const m = CHORD_RE.exec(raw.replace(/[()*]/g, '')); if (!m) return null;
  let root = m[1] + (m[2] || ''); root = FLAT2SHARP[root] || root;
  let suf = (m[3] || '').replace(/^min/, 'm').replace(/^-/, 'm').replace(/^M7|^Δ/, 'maj7');
  const names = {}; for (const k of CHORD_KEYS) { const n = CHORD_DB[k].name; if (!(n in names) || k === n) names[n] = k; }
  const tries = [suf, suf.replace(/add[0-9]+|6|9|11|13/g, ''), suf.replace(/^(m?)maj7.*/, '$1').replace(/^(m?)7.*/, '$17'), suf.replace(/^(m?)7.*/, '$1'),
    suf.replace(/sus[24]?/, ''), suf.startsWith('m') && !suf.startsWith('maj') ? 'm' : ''];
  for (let i = 0; i < tries.length; i++) { const k = names[root + tries[i]]; if (k) return { key: k, simplified: i > 0 || !!m[4], orig: raw }; }
  return { key: null, orig: raw };
}
const isChordTok = (t) => CHORD_RE.test(t.replace(/[()*]/g, '')) || /^(N\.?C\.?)$/i.test(t);
function parseSheet(text, perBar = 1) {
  const parts = []; let cur = null, capo = 0; const unknown = new Set(), simplified = {};
  const push = (name) => { cur = { part: name, bars: [] }; parts.push(cur); };
  const addChords = (list, repeat = 1) => {
    if (!cur) push('Vers');
    const keys = list.map((t) => { const r = chordKey(t); if (!r || !r.key) { if (!/^N\.?C/i.test(t)) unknown.add(t); return null; } if (r.simplified) simplified[t] = CHORD_DB[r.key].name; return r.key; }).filter(Boolean);
    for (let n = 0; n < repeat; n++) {
      if (perBar === 2) for (let i = 0; i < keys.length; i += 2) cur.bars.push(keys[i + 1] && keys[i + 1] !== keys[i] ? [keys[i], keys[i + 1]] : keys[i]);
      else keys.forEach((k) => cur.bars.push(k));
    }
  };
  for (let line of text.replace(/\r/g, '').split('\n')) {
    const cm = /capo\s*[:\-]?\s*(\d+)/i.exec(line); if (cm) { capo = +cm[1]; continue; }
    const t = line.trim(); if (!t) continue;
    const head = /^\[([^\]]+)\]$/.exec(t) || /^([A-Za-zÅÄÖåäö\- ]+?)\s*[0-9]*\s*:$/.exec(t) || /^(intro|verse|vers|chorus|refräng|bridge|stick|outro|pre[- ]?chorus|instrumental|solo|interlude)\s*[0-9]*$/i.exec(t);
    if (head && !isChordTok(head[1].trim())) { const nm = head[1].trim(); const sv = SECTION_SV.find(([re]) => re.test(nm)); push(sv ? sv[1] : nm.charAt(0).toUpperCase() + nm.slice(1)); continue; }
    // ChordPro: [Am]text[C]text
    const inl = [...t.matchAll(/\[([^\]]+)\]/g)].map((x) => x[1]).filter(isChordTok);
    if (inl.length && t.replace(/\[[^\]]+\]/g, '').trim().length > 0) { addChords(inl); continue; }
    const rep = /(?:^|\s)[x×](\d)\s*$|\((?:x|×)?(\d)x?\)\s*$/i.exec(t); const times = rep ? +(rep[1] || rep[2]) : 1;
    const body = rep ? t.slice(0, rep.index) : t;
    // takter med |
    if (body.includes('|')) {
      const segs = body.split('|').map((x) => x.trim().split(/\s+/).filter(Boolean)).filter((x) => x.length);
      if (segs.length && segs.every((sg) => sg.every((tok) => isChordTok(tok) || /^[-\/.%]+$/.test(tok)))) {
        if (!cur) push('Vers');
        for (let n = 0; n < times; n++) segs.forEach((sg) => { const ks = sg.filter(isChordTok).map((x) => { const r = chordKey(x); if (!r || !r.key) { unknown.add(x); return null; } if (r.simplified) simplified[x] = CHORD_DB[r.key].name; return r.key; }).filter(Boolean); if (ks.length) cur.bars.push(ks.length > 1 && ks[1] !== ks[0] ? [ks[0], ks[1]] : ks[0]); });
        continue;
      }
    }
    const toks = body.split(/\s+/).filter((x) => x && !/^[-–|.,]+$/.test(x));
    if (toks.length && toks.filter(isChordTok).length / toks.length >= 0.75) addChords(toks.filter(isChordTok), times);
  }
  return { parts: parts.filter((p) => p.bars.length), capo, unknown: [...unknown], simplified };
}

function NewSong({ onClose, onSave }) {
  const [tab, setTab] = useState('paste');
  const [name, setName] = useState('');
  const [artist, setArtist] = useState('');
  const [text, setText] = useState('');
  const [perBar, setPerBar] = useState(1);
  const [bpm, setBpm] = useState(80);
  const [chords, setChords] = useState(['Em', 'G', 'D', 'C']);
  const [feel, setFeel] = useState('acoustic');
  const parsed = useMemo(() => (text.trim() ? parseSheet(text, perBar) : null), [text, perBar]);
  const nBars = parsed ? parsed.parts.reduce((a, p) => a + p.bars.length, 0) : 0;
  const canSave = name.trim() && (tab === 'pick' || nBars > 0);
  const submit = (e) => {
    e.preventDefault(); if (!canSave) return;
    const form = tab === 'paste' ? parsed.parts : [{ part: 'Runda', bars: chords }];
    const simp = parsed && Object.keys(parsed.simplified).length ? ' Förenklade ackord: ' + Object.entries(parsed.simplified).map(([a, b]) => a + ' → ' + b).join(', ') + '.' : '';
    onSave({ id: 'custom-' + Date.now(), custom: true, title: name.trim(), artist: artist.trim() || (tab === 'paste' ? 'Inklistrat ackordblad' : 'Egen ackordföljd'), level: 'Egen', bpm, feel,
      capo: tab === 'paste' && parsed.capo ? 'Capo ' + parsed.capo : undefined,
      pattern: feel === 'reggae' ? P_SKANK : P_FOLK, accents: feel === 'reggae' ? [] : [0, 6],
      tip: 'Börja med tempotrappan och låt appen höja tempot när bytena sitter.' + simp, form });
  };
  return html`<div className="scrim" onClick=${(e) => e.target === e.currentTarget && onClose()}>
    <form className="modal ns" onSubmit=${submit}>
      <div className="row between"><h3 style=${{ fontSize: 20 }}>Lägg till låt</h3><button type="button" className="btn" onClick=${onClose}>Stäng</button></div>
      <div className="seg" role="group" aria-label="Sätt">
        <button type="button" aria-pressed=${tab === 'paste'} onClick=${() => setTab('paste')}>Klistra in ackordblad</button>
        <button type="button" aria-pressed=${tab === 'pick'} onClick=${() => setTab('pick')}>Välj ackord själv</button>
      </div>
      <div className="ns-row">
        <label className="ns-f"><span className="label">Låt</span><input type="text" id="songname" required placeholder="Till exempel Often" value=${name} onInput=${(e) => setName(e.target.value)} onChange=${() => {}} /></label>
        <label className="ns-f"><span className="label">Artist</span><input type="text" id="songartist" placeholder="Till exempel Ellen Krauss" value=${artist} onInput=${(e) => setArtist(e.target.value)} onChange=${() => {}} /></label>
      </div>
      ${tab === 'paste' ? html`
        <p className="muted" style=${{ fontSize: 13 }}>Kopiera ett ackordblad (till exempel från Ultimate Guitar) och klistra in här. Appen plockar ut ackorden, delarna och capo. Texten sparas inte.</p>
        <textarea id="sheet" rows="7" placeholder=${'[Verse]\nAm   C   F\n…\n[Chorus]\nC   G   Am   F'} value=${text} onInput=${(e) => setText(e.target.value)} onChange=${() => {}}></textarea>
        <div className="row between"><span className="label">Ackord per takt</span>
          <div className="seg" role="group" aria-label="Ackord per takt">
            <button type="button" aria-pressed=${perBar === 1} onClick=${() => setPerBar(1)}>Ett</button>
            <button type="button" aria-pressed=${perBar === 2} onClick=${() => setPerBar(2)}>Två</button>
          </div></div>
        ${parsed ? html`<div className="ns-prev">
          ${parsed.parts.length ? parsed.parts.map((pt, i) => html`<div key=${i} className="ns-part"><span className="label">${pt.part}</span>
            <div className="ns-bars">${pt.bars.map((b, j) => html`<span key=${j}>${[].concat(b).map((k) => CHORD_DB[k].name).join(' | ')}</span>`)}</div></div>`)
            : html`<p className="muted">Hittade inga ackord än. Ackorden ska stå på egna rader eller inom [ ] i texten.</p>`}
          <p className="muted" style=${{ fontSize: 12 }}>${nBars} takter${parsed.capo ? ' · capo ' + parsed.capo : ''}${Object.keys(parsed.simplified).length ? ' · förenklat: ' + Object.entries(parsed.simplified).map(([a, b]) => a + '→' + b).join(', ') : ''}</p>
          ${parsed.unknown.length ? html`<p className="gh-err" style=${{ color: 'var(--text)' }}>Saknar grepp för ${parsed.unknown.join(', ')}. De hoppas över. Prova en capo-version av ackordbladet.</p>` : null}
        </div>` : null}` : html`
        <div className="row between"><span className="label">Takter (${chords.length})</span>
          <div className="row" style=${{ gap: 6 }}>
            <button type="button" className="chip" disabled=${chords.length <= 2} onClick=${() => setChords(chords.slice(0, -1))}>− Takt</button>
            <button type="button" className="chip" disabled=${chords.length >= 16} onClick=${() => setChords([...chords, chords[chords.length - 1]])}>+ Takt</button>
          </div></div>
        <div className="slots">${chords.map((c, i) => html`<select key=${i} id=${'slot' + i} value=${c} onChange=${(e) => { const u = [...chords]; u[i] = e.target.value; setChords(u); }}>
          ${CHORD_KEYS.map((k) => html`<option key=${k} value=${k}>${CHORD_DB[k].name}</option>`)}</select>`)}</div>`}
      <div className="row between"><span className="label">Tempo</span><${Bpm} value=${bpm} set=${setBpm} /></div>
      <div className="seg" role="group" aria-label="Spelsätt">
        <button type="button" aria-pressed=${feel === 'acoustic'} onClick=${() => setFeel('acoustic')}>Akustiskt komp</button>
        <button type="button" aria-pressed=${feel === 'reggae'} onClick=${() => setFeel('reggae')}>Reggae-skank</button>
      </div>
      <button type="submit" className="btn primary" disabled=${!canSave}>Spara och öppna</button>
    </form>
  </div>`;
}

ReactDOM.createRoot(document.getElementById('root')).render(html`<${App} />`);
</script>

<script>
/* Appens statusfält följer valt färgtema */
(function () {
  var meta = document.querySelector('meta[name="theme-color"]');
  var sync = function () {
    try {
      var c = getComputedStyle(document.documentElement).getPropertyValue('--bg').trim(); if (!c) return; meta.setAttribute('content', c);
      var m = /#([0-9a-f]{6})/i.exec(c), n = m ? parseInt(m[1], 16) : 0, lum = ((n >> 16) * 299 + ((n >> 8) & 255) * 587 + (n & 255) * 114) / 1000;
      // Appen ritas under status- och navigeringsfältet; bara ikonernas färg (ljus/mörk) behöver följa temat
      var SYS = NATIVE && window.Capacitor.Plugins.SystemBars;
      if (SYS && m) SYS.setStyle({ style: lum > 140 ? 'LIGHT' : 'DARK' }).catch(function () {});
    } catch (e) {}
  };
  new MutationObserver(sync).observe(document.documentElement, { attributes: true, attributeFilter: ['data-skin', 'data-jam', 'class'] });
  window.addEventListener('load', sync);
})();
/* Offline och installation */
if ('serviceWorker' in navigator && !NATIVE) {
  window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
  var hadSW = !!navigator.serviceWorker.controller, swReloaded = false;
  // Ingen automatisk omladdning: sidan hämtas alltid färsk från nätet, så nya versionen gäller nästa gång appen öppnas.
}
</script>
</body>
</html>
