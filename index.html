nue.", "Pekfingret ligger platt över de två tunnaste strängarna på band 1.": "The index finger lies flat across the two thinnest strings on fret 1.", "Pekfingret på 3:e strängen band 2, ankaret på band 3. Slå inte an de två tjockaste.": "The index finger on the 3rd string fret 2, the anchor on fret 3. Don't strum the two thickest.", "Perfekt": "Perfect", "Placera": "Place", "Pricksäker": "Sharpshooter", "Prova att lägga till": "Try adding", "Prova ditt eget ljud på 3.": "Try your own sound on 3.", "Prova när du vill": "Try whenever you like", "Pukor i slutet av takten leder in i nästa.": "Toms at the end of the bar lead into the next.", "Pukor passar som en liten upptakt i slutet av takten, på 4 e & a.": "Toms work as a little pickup at the end of the bar, on 4 e & a.", "På": "On", "På datorn: tangenten": "On the computer: the key", "På ·": "On ·", "Quiz och 1-minutsutmaningen": "Quiz and the 1-minute challenge", "Reagerar appen på ljud fast du inte spelar: välj Låg. Missar den dina slag: välj Hög.": "Does the app react to sound when you're not playing: choose Low. Does it miss your strums: choose High.", "Redan två fingrar": "Already two fingers", "Referenstoner": "Reference notes", "Refräng": "Chorus", "Reggae · skank på &": "Reggae · skank on &", "Reggae-skank": "Reggae skank", "Reggae-skank med uppslag": "Reggae skank with upstrokes", "Reggae: skank på 2 och 4": "Reggae: skank on 2 and 4", "Reggae: skank på varje &": "Reggae: skank on every &", "Reggaebas: grundton (R) på 1 och 3 och kvint (5) och oktav (8) emellan. Lämna gärna luft, tystnaden är en del av reggae.": "Reggae bass: root (R) on 1 and 3 and fifth (5) and octave (8) in between. Leave some air, silence is part of reggae.", "Reggaeföljder": "Reggae progressions", "Reggaegitarr spelar bara korta, dämpade ackord (skank, S) på 2 och 4. Lämna resten tomt.": "Reggae guitar only plays short, muted chords (skank, S) on 2 and 4. Leave the rest empty.", "Reggaeresenär": "Reggae traveller", "Reggaerytmen": "The reggae rhythm", "Reggaetriad på band 3": "Reggae triad on fret 3", "Rekommenderad nästa": "Recommended next", "Rekord:": "Record:", "Rensa takten": "Clear the bar", "Rent ackord!": "Clean chord!", "Rent stämd": "Perfectly in tune", "Ride används som en lugnare hi-hat, på varje åttondel.": "Ride is used as a calmer hi-hat, on every eighth.", "Ride på &-rutorna är ett mjukt alternativ till hi-hat.": "Ride on the & boxes is a soft alternative to hi-hat.", "Ring- och lillfinger ligger kvar på band 3 i alla fem. Används i Wonderwall och Wish You Were Here.": "Ring and little finger stay on fret 3 in all five. Used in Wonderwall and Wish You Were Here.", "Ring- och lillfingret ligger kvar på band 3 genom hela låten. Bara pek- och långfingret flyttar. Originalet har ett tätare 16-delskomp, så när detta sitter kan du lägga till fler uppslag.": "Ring and little finger stay on fret 3 through the whole song. Only the index and middle finger move. The original has a denser 16th comp, so when this sits you can add more upstrokes.", "Ringens färg och tips": "Ring colour and tips", "Rock och blues": "Rock and blues", "Rock, country och blues": "Rock, country and blues", "Rocksteady-klassikern som Blondie senare gjorde till en hit. G, C och D i en loop där C och D bara får en takt var, så förbered C-greppet redan på sista & i andra G-takten.": "The rocksteady classic that Blondie later made a hit. G, C and D in a loop where C and D only get one bar each, so prepare the C shape already on the last & of the second G bar.", "Rulla pekfingret lite": "Roll the index finger a little", "Rundan upprepades. Hela jammet var": "The round repeated. The whole jam was", "Rutorna med streckad ram passar.": "The boxes with a dashed frame fit.", "Rytmmätare": "Rhythm meter", "Rytmspel": "Rhythm game", "Räkna": "Count", "Räkna bytena": "Count the changes", "Räkna in en takt först": "Count in one bar first", "Räknar in …": "Counting in …", "Rätt!": "Correct!", "Röd = tungt slag · streckad = handen går i luften": "Red = heavy strum · dashed = the hand goes through the air", "SLÅ": "HIT", "Saknar grepp för": "Missing chord shape for", "Salvia och persika": "Sage and peach", "Samla alla": "Collect all", "Samma form som Bm, flyttad ett band upp.": "The same shape as Bm, moved up one fret.", "Samma form som E-dur, flyttad en sträng nedåt. Varm och lite vemodig.": "The same shape as E major, moved down one string. Warm and a bit wistful.", "Samma form som Em fast en sträng ner och ett finger till.": "The same shape as Em but one string down and one more finger.", "Samma former som ovan, flyttade till andra band": "The same shapes as above, moved to other frets", "Samma fyra ackord genom hela låten, två slag var: A, G, D/F# och D med capo på band 3 (det låter som C, Bb, F/A och F). Basen går nedåt för varje byte. Är D/F# krångligt tar du ett vanligt D. Ackorden är framtagna ur inspelningen, så säg till om något låter fel.": "The same four chords through the whole song, two beats each: A, G, D/F# and D with a capo on fret 3 (it sounds like C, Bb, F/A and F). The bass walks down with every change. If D/F# is tricky, take an ordinary D. The chords were taken from the recording, so tell me if something sounds wrong.", "Samma fyra ackord genom hela låten: Em, C, G och D, ett ackord per takt. Basen spelar grundton och kvint, så du kan dunsa på tjockaste strängen i varje grepp på 1 och 3. Ackorden är framtagna ur inspelningen, så säg till om något låter fel.": "The same four chords through the whole song: Em, C, G and D, one chord per bar. The bass plays root and fifth, so you can thump the thickest string of each shape on 1 and 3. The chords were taken from the recording, so tell me if something sounds wrong.", "Samma fyra ackord men i drivande tempo. Nästa steg-nivån börjar här.": "The same four chords but at a driving tempo. The Next step level starts here.", "Samma fyra takter genom hela låten: G, Am, C, G. Originalet går i A, och med capo 2 spelar du det med G-, Am- och C-greppen. Börja långsamt.": "The same four bars through the whole song: G, Am, C, G. The original is in A, and with capo 2 you play it with the G, Am and C shapes. Start slowly.", "Samma grepp som Fm, flyttat ett band upp.": "The same shape as Fm, moved up one fret.", "Samma rörelse åtta gånger per takt": "The same motion eight times per bar", "Samma rörelse, men handen går förbi strängarna på två ställen.": "The same motion, but the hand goes past the strings in two places.", "Se bytet i 3D-handen": "See the change in the 3D hand", "Se greppet": "See the shape", "Shakern fyller ut, gärna på varje åttondel som hi-hatten.": "The shaker fills out, preferably on every eighth like the hi-hat.", "Shakern på &-rutorna förstärker reggaens baktakt.": "The shaker on the & boxes strengthens reggae's offbeat.", "Sju knep för snabba byten": "Seven tricks for fast changes", "Ska ett finger stanna på samma sträng, släpp trycket och dra det längs strängen.": "If a finger should stay on the same string, release the pressure and slide it along the string.", "Skank och tjack med vågen": "Skank and chop with the wave", "Skank-skolan": "Skank school", "Skanka 8 takter i rad. Vågen visar när du ska slå.": "Skank 8 bars in a row. The wave shows when to strum.", "Skivspelare, nivå": "Record player, level", "Sköna riff": "Cool riffs", "Slag i takt i rad": "Strums in time in a row", "Släpp direkt": "Let go right away", "Släpp greppet på sista slaget i takten. Då låter de öppna strängarna en kort stund, men du landar i tid på ettan. Det låter mycket bättre än ett sent byte.": "Release the chord on the last beat of the bar. The open strings ring for a moment, but you land in time on the one. It sounds much better than a late change.", "Släpp trycket och se formen för": "Release the pressure and see the shape for", "Släpp trycket.": "Release the pressure.", "Slå an": "Strum", "Slå an alla sex strängarna, tre gånger med en paus emellan": "Strum all six strings, three times with a pause in between", "Slå an en sträng i taget. Nålen ska stå i mitten.": "Pluck one string at a time. The needle should be in the middle.", "Slå an igen för att prova en gång till": "Strum again to try once more", "Slå bara på &": "Strum only on &", "Slå inte an": "Don't strum", "Slå när slagen når linjen. Vänta på pauserna.": "Strum when the notes reach the line. Wait on the pauses.", "Slå på Nybörjargrepp uppe i hörnet. Skanket träffar ändå bara de tunnaste strängarna, så pekfingret behöver bara trycka ner två eller tre.": "Turn on Beginner chords up in the corner. The skank only hits the thinnest strings anyway, so the index finger only needs to press two or three.", "Slå på ljud": "Turn on sound", "Snabbt tempo men luftigt komp. Låt basen gå på slagen och spela korta slag på varje &. Börja på 90 BPM och öka två steg i taget.": "Fast tempo but an airy comp. Let the bass go on the beats and play short strums on every &. Start at 90 BPM and raise it two steps at a time.", "Snärta pekfingrets nagel neråt över bara G-, B- och e-strängen. Kort och bestämt, som att knäppa bort en smula.": "Flick the index fingernail down over just the G, B and e strings. Short and firm, like flicking away a crumb.", "Snärtig": "Snappy", "Som A-dur men med öppen G-sträng i mitten. Två fingrar.": "Like A major but with an open G string in the middle. Two fingers.", "Som Em, två fingrar": "Like Em, two fingers", "Som G men med pekfingret på band 2 på tunnaste strängen. Drömsk klang.": "Like G but with the index finger on fret 2 of the thinnest string. Dreamy sound.", "Som G-dur men med pekfingret på första bandet på tunnaste strängen.": "Like G major but with the index finger on the first fret of the thinnest string.", "Som G-greppet men pek- och långfingret flyttar ner en sträng var.": "Like the G shape but the index and middle finger each move down one string.", "Spansk känsla": "Spanish feel", "Spara": "Save", "Spara kompet": "Save the comp", "Spara och öppna": "Save and open", "Spara som låt": "Sa uitar follows the chords.", "Tryck på Spela för att starta": "Press Play to start", "Tryck på den stora knappen eller mellanslag i takt.": "Press the big button or space in time.", "Tryck på en sträng": "Tap a string", "Tryck på ett namn för att välja det, i en ruta för att ändra den, eller På/Av för att stänga av en del.": "Tap a name to choose it, a box to change it, or On/Off to turn off a part.", "Tryck på första takten i loopen.": "Tap the first bar of the loop.", "Tryck på sista takten i loopen.": "Tap the last bar of the loop.", "Tryck på skärmen": "Tap the screen", "Trä­kloss": "Wood­block", "Träffsäkerhet": "Accuracy", "Träkloss på ett par &-rutor.": "Woodblock on a couple of & boxes.", "Träklossen låter bra i ett mönster som 1, a, &, & och 4.": "The woodblock sounds good in a pattern like 1, a, &, & and 4.", "Träna igen": "Practise again", "Tränaren växlar ackord varje takt": "The trainer switches chords every bar", "Tummen mitt bakom halsen": "Thumb in the middle behind the neck", "Tummen vilar eller knackar lätt på tjocka E-strängen på 1, 2, 3 och 4. Det är ditt ankare i takten.": "The thumb rests or taps lightly on the thick E string on 1, 2, 3 and 4. It's your anchor in the bar.", "Två": "Two", "Två av de vanligaste ackorden i pop och reggae.": "Two of the most common chords in pop and reggae.", "Två fingrar": "Two fingers", "Två fingrar (Asus2)": "Two fingers (Asus2)", "Två fingrar (Dm7)": "Two fingers (Dm7)", "Två fingrar (Fmaj7/D)": "Two fingers (Fmaj7/D)", "Två fingrar, alla sex strängar. Låt appen lyssna under Gör jag rätt?, eller klarmarkera själv.": "Two fingers, all six strings. Let the app listen under Am I doing it right?, or mark it done yourself.", "Två veckor": "Two weeks", "Tvåackordsgung, två takter på varje": "Two-chord groove, two bars on each", "Tänk på nästa grepp redan medan du spelar det här. Bytet börjar i huvudet.": "Think about the next shape while you're still playing this one. The change starts in your head.", "Upp och ner på n, with two chords per bar at the end.", "Versen är C, G, Am, F hela vägen. I refrängen går andra halvan C, F, C, G. Det enkla Fmaj7-trappsteget låter bra på nylon.": "The verse is C, G, Am, F all the way. In the chorus the second half goes C, F, C, G. The easy Fmaj7 step sounds good on nylon.", "Vid barré sitter tummen som ett mothåll mitt på halsens baksida, rakt bakom pekfingret.": "With barre the thumb sits as a counter-hold in the middle of the back of the neck, right behind the index finger.", "Videolektioner på YouTube ↗": "Video lessons on YouTube ↗", "Viktigt i både pop och reggae. Barré över fem strängar på band 2 med en Am-form framför.": "Important in both pop and reggae. Barre across five strings on fret 2 with an Am shape in front.", "Vilket ackord hör du? Lyssna på om det låter glatt (dur) eller vemodigt (moll).": "Which chord do you hear? Listen for whether it sounds happy (major) or wistful (minor).", "Vilket ackord visar greppet?": "Which chord does the shape show?", "Vill du se en riktig gitarrist göra det?": "Want to see a real guitarist do it?", "Virveln svarar bastrumman på 2 och 4. Klappa händerna på 2 och 4 så hör du det.": "The snare answers the kick drum on 2 and 4. Clap your hands on 2 and 4 and you'll hear it.", "Visa": "Show", "Visa bara nästa steg": "Show only the next step", "Visa greppet igen": "Show the shape again", "Visning": "View", "Volym": "Volume", "Vrid pekfingret en aning mot tummen så att den hårdare, benigare sidan trycker mot strängarna.": "Twist the index finger slightly towards the thumb so the harder, bonier side presses on the strings.", "Väg": "Path", "Vägen till F": "The road to F", "Välj Dämpat om det känns svårt. Ta Am ↔ Em när det sitter.": "Choose Muted if it feels hard. Take Am ↔ Em when it sits.", "Välj ackord själv": "Choose chords yourself", "Välj en låt": "Choose a song", "Välj en låt och kör": "Choose a song and go", "Välj ett steg, ta greppet och låt appen lyssna under Gör jag rätt? När du får Rätt! bockas // Konfetti vid belöningar (egen liten motor, inga beroenden). Respekterar "minska rörelse".
function confetti(power = 1) {
  try { if (matchMedia('(prefers-reduced-motion: reduce)').matches) return; } catch (e) {}
  const cv = document.createElement('canvas'), dpr = Math.min(2, window.devicePixelRatio || 1);
  cv.className = 'confetti'; cv.width = innerWidth * dpr; cv.height = innerHeight * dpr; document.body.appendChild(cv);
  const x = cv.getContext('2d'), cs = getComputedStyle(document.documentElement);
  const cols = ['--ember', '--leaf', '--brass', '--sky'].map((v) => cs.getPropertyValue(v).trim() || '#c65');
  cols.push('#ffd23f');
  const N = Math.round(90 * power), P = [];
  for (let i = 0; i < N; i++) {
    const side = i % 2 ? 1 : -1, a = (-90 + side * (25 + Math.random() * 30)) * Math.PI / 180, v = (9 + Math.random() * 9) * dpr * (0.8 + power * 0.2);
    P.push({ x: (side < 0 ? 0.12 : 0.88) * cv.width, y: cv.height * 0.85, vx: -side * Math.abs(Math.cos(a)) * v, vy: Math.sin(a) * v, r: Math.random() * 6.28, vr: (Math.random() - 0.5) * 0.3,
      w: (6 + Math.random() * 6) * dpr, h: (3 + Math.random() * 4) * dpr, c: cols[i % cols.length] });
  }
  let t0 = performance.now();
  const step = (now) => {
    const age = (now - t0) / 1000; x.clearRect(0, 0, cv.width, cv.height);
    for (const p of P) { p.vy += 0.32 * dpr; p.vx *= 0.985; p.vy *= 0.985; p.x += p.vx; p.y += p.vy; p.r += p.vr;
      x.save(); x.globalAlpha = Math.max(0, 1 - Math.max(0, age - 1.6) / 0.8); x.translate(p.x, p.y); x.rotate(p.r); x.fillStyle = p.c; x.fillRect(-p.w / 2, -p.h / 2, p.w, p.h * Math.abs(Math.cos(p.r * 2))); x.restore(); }
    if (age < 2.4) requestAnimationFrame(step); else cv.remove();
  };
  requestAnimationFrame(step);
}

function Bpm({ value, set, min = 40, max = 200 }) {
  const taps = useRef([]);
  const tap = () => {
    const now = performance.now(); taps.current = taps.current.filter((x) => now - x < 2500); taps.current.push(now);
    if (taps.current.length >= 3) {
      const t = taps.current, iv = (t[t.length - 1] - t[0]) / (t.length - 1);
      set(Math.max(min, Math.min(max, Math.round(60000 / iv))));
    }
  };
  return html`<div className="bpm">
    <button onClick=${() => set(Math.max(min, value - 2))} aria-label="Långsammare">−</button>
    <div className="val">${value}<small>BPM</small></div>
    <button onClick=${() => set(Math.min(max, value + 2))} aria-label="Snabbare">+</button>
    <button className="tap" onClick=${tap} title="Knacka takten tre gånger">TAP</button>
  </div>`;
}

function Challenge({ easy, pair, setPair, best, onFinish, fixed = false }) {
  const [phase, setPhase] = useState('idle');
  const [cd, setCd] = useState(3);
  const [left, setLeft] = useState(60);
  const [count, setCount] = useState(0);
  const [result, setResult] = useState(null);
  const cRef = useRef(0);
  const [input, setInputS] = useState(() => { try { return localStorage.getItem('ng-chal-input') || 'tap'; } catch (e) { return 'tap'; } });
  const setInput = (v) => { setInputS(v); try { localStorage.setItem('ng-chal-input', v); } catch (e) {} };
  const [micErr, setMicErr] = useState(false);
  const micR = useRef(null), rafR = useRef(0), lvl = useRef(null), heard = useRef(null);
  const stopMic = () => { cancelAnimationFrame(rafR.current); if (micR.current) micR.current.stop(); micR.current = null; };
  useEffect(() => stopMic, []);
  // mikrofonläge: räkna ett byte varje gång appen hör nästa ackord i paret
  const listen = async () => {
    const m = new Mic(); await m.start({ aec: false }); micR.current = m;
    const cal = micCal(); let last = 0, chk = 0, streak = 0;
    const loop = (t) => {
      rafR.current = requestAnimationFrame(loop); m.read(); const r = m.rms();
      if (lvl.current) lvl.current.style.width = Math.min(100, r * 600) + '%';
      if (t - chk < 70) return; chk = t;
      if (r < cal.gate * 2) { streak = 0; return; }
      const { ch, tot } = m.chroma(); if (tot <= 0) return;
      const want = pair[(cRef.current + 1) % 2], other = pair[cRef.current % 2];
      const share = (k) => { const ps = chordPcs(k, easy); let v = 0; ch.forEach((x, pc) => { if (ps.has(pc)) v += x; }); return v / tot; };
      const a = share(want), b = share(other), need = 0.25 + chordPcs(want, easy).size * 0.07;
      // nästa ackord måste dominera två mätningar i rad
      streak = a >= need && a > b + 0.05 ? streak + 1 : 0;
      if (streak >= 2 && t - last > 300) { streak = 0; last = t; cRef.current++; setCount(cRef.current); }
    };
    rafR.current = requestAnimationFrame(loop);
  };
  const prevBest = best[pair[0] + '-' + pair[1]] || best[pair[1] + '-' + pair[0]] || 0;
  const start = async () => {
    setMicErr(false);
    if (input === 'mic') { try { await listen(); } catch (e) { setMicErr(true); return; } }
    engine.now(); setCount(0); cRef.current = 0; setResult(null); setPhase('count'); setCd(3); engine.click(engine.now(), true);
    let c = 3; const iv = setInterval(() => {
      c--; if (c > 0) { setCd(c); engine.click(engine.now(), true); return; }
      clearInterval(iv); setPhase('run'); if (input !== 'mic') engine.playChord(voicing(pair[0], easy).frets);
      const end = performance.now() + 60000;
      const t = setInterval(() => {
        const l = Math.max(0, (end - performance.now()) / 1000); setLeft(l);
        if (l <= 0) { clearInterval(t); stopMic(); setPhase('done'); const n = cRef.current; setResult({ n, rec: n > prevBest, prev: prevBest }); onFinish(n, pair); engine.click(engine.now(), true); }
      }, 100);
    }, 1000);
  };
  const tap = () => {
    if (phase !== 'run' || input === 'mic') return;
    cRef.current++; setCount(cRef.current);
    engine.strum(voicing(pair[cRef.current % 2], easy).frets, engine.now(), 'D', { vel: 0.75, stagger: 0.012 });
  };
  useEffect(() => {
    const h = (e) => { if ((e.code === 'Space' || e.code === 'Enter') && phase === 'run') { e.preventDefault(); tap(); } };
    window.addEventListener('keydown', h); return () => window.removeEventListener('keydown', h);
  });
  const curIdx = count % 2;
  return html`<section className="card" style=${{ display: 'grid', gap: 18 }}>
    ${!fixed && (phase === 'idle' || phase === 'done') ? html`<div className="row" style=${{ gap: 6 }}>
      ${PAIRS.map((p) => html`<button key=${p.join()} className=${'chip' + (p[0] === pair[0] && p[1] === pair[1] ? ' on' : '')} onClick=${() => setPair(p)}>${p[0]} ↔ ${p[1]}</button>`)}
    </div>` : null}
    ${phase === 'idle' || phase === 'done' ? html`<div className="row between"><span className="label">Räkna bytena</span>
      <div className="seg" role="group" aria-label="Räkna bytena">
        <button aria-pressed=${input === 'tap'} onClick=${() => setInput('tap')}>Jag trycker</button>
        <button aria-pressed=${input === 'mic'} onClick=${() => setInput('mic')}>Mikrofonen lyssnar</button>
      </div></div>` : null}
    ${micErr ? MIC_BLOCKED : null}
    <div className="chal">
      <div className="pair"><span className=${phase === 'run' && curIdx === 0 ? 'on' : ''}>${CHORD_DB[pair[0]].name}</span><span style=${{ padding: 0 }}>↔</span><span className=${phase === 'run' && curIdx === 1 ? 'on' : ''}>${CHORD_DB[pair[1]].name}</span></div>
      ${phase === 'idle' ? html`<p className="lead">Byt fram och tillbaka mellan greppen i en minut. Slå an ackordet och tryck på knappen (eller mellanslag) varje gång du har bytt. Ditt rekord: <strong>${prevBest}</strong> byten.</p>
        <button className="play" onClick=${start}>${I.play}Starta minuten</button>` : null}
      ${phase === 'count' ? html`<div className="count" style=${{ color: 'var(--brass)' }}>${cd}</div><p className="muted">Lägg fingrarna på ${CHORD_DB[pair[0]].name}</p>` : null}
      ${phase === 'run' ? html`<div className="timer"><div className="xpbar"><i style=${{ width: (left / 60 * 100) + '%' }}></i></div><p className="mono muted" style=${{ marginTop: 6 }}>${Math.ceil(left)} s kvar</p></div>
        <div className="count">${count}</div>
        ${input === 'mic' ? html`<div className="chal-mic"><b>Byt till ${CHORD_DB[pair[(count + 1) % 2]].name} och slå an</b><div className="gh-lvl cc-lvl" style=${{ width: '100%' }}><i ref=${lvl}></i></div><small className="muted">Appen räknar bytet när den hör rätt ackord</small></div>`
          : html`<button className="tapbtn" onClick=${tap}>Bytt! → ${CHORD_DB[pair[(count + 1) % 2]].name}</button>`}` : null}
      ${phase === 'done' && result ? html`<div className="count">${result.n}</div>
        <p className="lead">${result.rec ? 'Nytt rekord! Förra bästa var ' + result.prev + '.' : 'Ditt rekord är ' + result.prev + '. Fortsätt nöta, så kommer det.'} Gör utmaningen en gång om dagen för samma par och se siffran växa.</p>
        <button className="play" onClick=${start}>${I.play}En gång till</button>` : null}
    </div>

      ${pair.map((k, i) => html`<${Diagram} key=${k + i} k=${k} easy=${easy} selected=${phase === 'run' && curIdx === i} onClick=${() => engine.playChord(voicing(k, easy).frets)} />`)}
    </div>
  </section>`;
}

/* Fri träning: appen lyssnar medan du byter i din egen takt och ger feedback efteråt */
const fmtSec = (ms) => (ms / 1000).toFixed(1).replace('.', ',') + ' s';
function summarizePractice(recs, pair) {
  const times = recs.filter((r) => r.ms > 0 && r.ms < 8000); // längre uppehåll räknas som paus
  const mean = (l) => l.reduce((s, r) => s + r.ms, 0) / l.length;
  const dirs = [[pair[0], pair[1]], [pair[1], pair[0]]].map(([from, to]) => {
    const l = times.filter((r) => r.from === from && r.to === to);
    return { from, to, n: l.length, avg: l.length ? mean(l) : 0 };
  }).filter((d) => d.n > 0);
  const judged = recs.filter((r) => r.ok !== null), clean = judged.filter((r) => r.ok).length;
  const tipCount = {};
  judged.forEach((r) => r.tips.forEach((t) => { tipCount[t] = (tipCount[t] || 0) + 1; }));
  const tips = Object.entries(tipCount).sort((a, b) => b[1] - a[1]).slice(0, 2).map(([text, n]) => ({ text, n }));
  const slow = dirs.length === 2 && Math.abs(dirs[0].avg - dirs[1].avg) > 150 ? (dirs[0].avg > dirs[1].avg ? dirs[0] : dirs[1]) : null;
  return { hits: recs.length, changes: times.length, avg: times.length ? mean(times) : 0, best: times.length ? Math.min(...times.map((r) => r.ms)) : 0, dirs, judged: judged.length, clean, tips, slow };
}
function PracticeCoach({ easy, pair, setPair, onFinish }) {
  const [phase, setPhase] = useState('idle');

  const [sum, setSum] = useState(null);
  const [micErr, setMicErr] = useState(false);
  const micR = useRef(null), rafR = useRef(0), lvl = useRef(null), stateR = useRef(null);
  const stopMic = () => { cancelAnimationFrame(rafR.current); if (micR.current) micR.current.stop(); micR.current = null; };
  useEffect(() => stopMic, []);
  const judgeJob = (S) => {
    const j = S.job; if (!j) return; S.job = null;
    if (j.frames < 3) return; // för kort anslag för att bedöma
    const out = judgeChord(j.k, easy, j.acc);
    j.rec.ok = out.ok; j.rec.tips = out.tips;
    setLive((l) => ({ ...l, ok: out.ok, msg: out.ok ? 'Rent ackord!' : out.tips[0] }));
  };
  const start = async () => {
    setMicErr(false); setSum(null); setLive({ n: 0, ms: 0, ok: null, msg: '' });
    const m = new Mic();
    try { await m.start({ aec: false }); } catch (e) { setMicErr(true); return; }
    micR.current = m; setPhase('run');
    const cal = micCal(), S = { n: 0, lastHit: 0, chk: 0, streak: 0, job: null, recs: [] };
    stateR.current = S;
    const share = (ch, tot, k) => { const ps = chordPcs(k, easy); let v = 0; ch.forEach((x, pc) => { if (ps.has(pc)) v += x; }); return v / tot; };
    const loop = (t) => {
      rafR.current = requestAnimationFrame(loop); m.read(); const r = m.rms();
      if (lvl.current) lvl.current.style.width = Math.min(100, r * 600) + '%';
      if (S.job) {
        const age = t - S.job.t;
        if (age > 120 && age < 800) { m.notes(S.job.acc); S.job.frames++; }
        if (age >= 800) judgeJob(S);
      }
      if (t - S.chk < 70) return; S.chk = t;
      if (r < cal.gate * 2) { S.streak = 0; return; }
      const { ch, tot } = m.chroma(); if (tot <= 0) return;
      const want = pair[S.n % 2], other = pair[(S.n + 1) % 2];
      const a = share(ch, tot, want), b = share(ch, tot, other), need = 0.25 + chordPcs(want, easy).size * 0.07;
      S.streak = a >= need && a > b + 0.05 ? S.streak + 1 : 0;
      if (S.streak >= 2 && t - S.lastHit > 300) {
        judgeJob(S);
        const ms = S.lastHit ? t - S.lastHit : 0, rec = { from: other, to: want, ms, ok: null, tips: [] };
        S.recs.push(rec); S.job = { t, k: want, acc: new Array(128).fill(0), frames: 0, rec };
        S.lastHit = t; S.streak = 0; S.n++;
        setLive((l) => ({ ...l, n: S.n, ms, ok: null, msg: '' }));
      }
    };
    rafR.current = requestAnimationFrame(loop);
  };
  const finish = () => {
    const S = stateR.current; judgeJob(S); stopMic();
    const out = summarizePractice(S.recs, pair), key = 'ng-coach-' + pair.join('-');
    try { out.prev = Number(localStorage.getItem(key)) || 0; if (out.avg) localStorage.setItem(key, String(Math.round(out.avg))); } catch (e) { out.prev = 0; }
    setSum(out); setPhase('done');

  };

  return html`<section className="card" style=${{ display: 'grid', gap: 18 }}>
    ${phase !== 'run' ? html`<div className="row" style=${{ gap: 6 }}>
      ${PAIRS.map((p) => html`<button key=${p.join()} className=${'chip' + (p[0] === pair[0] && p[1] === pair[1] ? ' on' : '')} onClick=${() => setPair(p)}>${p[0]} ↔ ${p[1]}</button>`)}
    </div>` : null}
    ${micErr ? MIC_BLOCKED : null}
    <div className="chal">
      <div className="pair"><span className=${phase === 'run' && next === pair[0] ? 'on' : ''}>${CHORD_DB[pair[0]].name}</span><span style=${{ padding: 0 }}>↔</span><span className=${phase === 'run' && next === pair[1] ? 'on' : ''}>${CHORD_DB[pair[1]].name}</span></div>
      ${phase === 'idle' ? html`<p className="lead">Byt mellan ackorden i din egen takt, utan klocka. Appen lyssnar, mäter hur lång tid bytena tar och hör vilka strängar som inte klingar.</p>

// Spela med en egen inspelning: klockan följer ljudfilens slag i stället för kompbandet
let AUDIO_SYNC = null;
const AUDIO_BUF = {};
// Tidsförlängning (WSOLA): gör inspelningen långsammare utan att tonhöjden ändras.
// Varje bit av ljudet läggs om med överlapp, och placeringen finjusteras så att vågformerna hakar i varandra.
function wsolaCore(inp, rate) {
  const N = 2048, Hs = 512, tol = 384, Ha = Hs * rate, chs = inp.length, len = inp[0].length;
  const mono = chs > 1 ? Float32Array.from(inp[0], (v, i) => (v + inp[1][i]) * 0.5) : inp[0];
  const outLen = Math.ceil(len / rate) + N, out = inp.map(() => new Float32Array(outLen)), wsum = new Float32Array(outLen);
  const win = new Float32Array(N); for (let i = 0; i < N; i++) win[i] = 0.5 - 0.5 * Math.cos((2 * Math.PI * i) / N);
  let prev = 0, outPos = 0;
  for (let k = 0; ; k++, outPos += Hs) {
    const nominal = Math.round(k * Ha); if (nominal + N + tol >= len) break;
    let best = nominal;
    if (k > 0) {
      const tgt = prev + Hs; let bc = -Infinity;
      for (let d = -tol; d <= tol; d += 6) {
        const p0 = nominal + d; if (p0 < 0) continue; let cc = 0;
        for (let i = 0; i < 1024; i += 4) cc += mono[p0 + i] * mono[tgt + i];
        if (cc > bc) { bc = cc; best = p0; }
      }
    }
    for (let ch = 0; ch < chs; ch++) { const o = out[ch], src = inp[ch]; for (let i = 0; i < N; i++) o[outPos + i] += src[best + i] * win[i]; }
    for (let i = 0; i < N; i++) wsum[outPos + i] += win[i];
    prev = best;
  }
  const n = outPos + N;
  return out.map((o) => { const r = new Float32Array(n); for (let i = 0; i < n; i++) r[i] = wsum[i] > 1e-3 ? o[i] / wsum[i] : 0; return r; });
}

    try {
      const m = new Mic(); await m.start({ aec: false }); mic.current = m;
      setStep('quiet'); setCount(0);
      const t0 = performance.now(), Q = []; const P = []; let env = 0.01, last = 0, peak = 0, inHit = false, shown = false;

/* Rytmmätaren: knacka på varje & och se om du ligger före eller efter */
function RhythmMeter({ active, onHit }) {
  const [last, setLast] = useState(null);
  const [tally, setTally] = useState({ p: 0, g: 0, m: 0, streak: 0 });
  const hit = () => {
    if (!active || !engine.ctx) return;
    const now = engine.ctx.currentTime - engine.lat() * 0.5;
    const offs = engine.log.filter((x) => x.step % 2 === 1).map((x) => (now - x.t) * 1000);
    if (!offs.length) return;
    const ms = offs.reduce((a, b) => (Math.abs(b) < Math.abs(a) ? b : a));
    const grade = Math.abs(ms) < 40 ? 'p' : Math.abs(ms) < 90 ? 'g' : 'm';
    setLast({ ms, grade, id: Math.random() });
    setTally((t) => { const n = { ...t, [grade]: t[grade] + 1, streak: grade === 'm' ? 0 : t.streak + 1 }; onHit(grade, n.streak); return n; });
  };
  useEffect(() => {
    const h = (e) => { if (active && (e.code === 'Enter' || e.code === 'KeyJ')) { e.preventDefault(); hit(); } };
    window.addEventListener('keydown', h); return () => window.removeEventListener('keydown', h);
  });
  const total = tally.p + tally.g + tally.m;
  return html`<section className="card" style=${{ display: 'grid', gap: 14 }}>
    <div className="section-head" style=${{ margin: 0 }}><h3>Rytmmätare</h3><p>Starta tränaren och tryck på knappen i takt med ditt tjack på varje &.</p></div>
    <div style=${{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit,minmax(260px,1fr))', gap: 18, alignItems: 'center' }}>
      <${Needle} value=${last ? last.ms : null} range=${150} good=${last && last.grade === 'p'} unitL="för tidigt" unitR="för sent"
        label=${!last ? '–' : last.grade === 'p' ? 'Perfekt!' : last.grade === 'g' ? 'Bra' : 'Miss'}
        sub=${last ? (last.ms > 0 ? '+' : '') + Math.round(last.ms) + ' ms' : active ? 'Tryck på varje &' : 'Starta tränaren först'} />
      <div style=${{ display: 'grid', gap: 12, justifyItems: 'center' }}>
        <button className="tapbtn" disabled=${!active} style=${{ opacity: active ? 1 : 0.45 }} onPointerDown=${(e) => { e.preventDefault(); hit(); }}>TJACK</button>
        <div className="stats" style=${{ width: '100%' }}>
          <div className="stat"><b style=${{ color: 'var(--leaf)' }}>${tally.p}</b><span>Perfekt</span></div>
          <div className="stat"><b style=${{ color: 'var(--brass)' }}>${tally.g}</b><span>Bra</span></div>
          <div className="stat"><b>${total ? Math.round((tally.p + tally.g) / total * 100) : 0}%</b><span>Träffsäkerhet</span></div>
        </div>
        <p className="muted" style=${{ fontSize: 12 }}>På datorn: tangenten <span className="kbd">J</span> eller <span className="kbd">Enter</span>.</p>
      </div>
    </div>
  </section>`;
}

const RecDB = (() => {
  let dbp;
  const open = () => dbp || (dbp = new Promise((res, rej) => {
    const r = indexedDB.open('ng-rec', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('rec', { keyPath: 'id' }).createIndex('song', 'song');
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  }));
  const run = (mode, fn) => open().then((db) => new Promise((res, rej) => {
    const t = db.transaction('rec', mode), q = fn(t.objectStore('rec'));
    t.oncomplete = () => res(q ? q.result : undefined); t.onerror = () => rej(t.error);
  }));
  return { put: (r) => run('readwrite', (st) => st.put(r)), del: (id) => run('readwrite', (st) => st.delete(id)), list: (song) => run('readonly', (st) => st.index('song').getAll(song)), all: () => run('readonly', (st) => st.getAll()) };
})();

function LatencySettings() {
  const [ms, setMs] = useState(() => Math.round(engine.userLat * 1000));
  const [run, setRun] = useState(false);
  const [msg, setMsg] = useState('');
  const R = useRef(null);
  const set = (v) => { const n = Math.max(-100, Math.min(400, Math.round(v))); setMs(n); engine.setLat(n); };
  const finish = () => {
    const r = R.current; R.current = null; setRun(false); if (!r) return;
    const offs = [];
    for (const t of r.taps) { const k = Math.round((t - r.t0) / r.spb); if (k < 3 || k >= r.n) continue; const o = t - (r.t0 + k * r.spb); if (o > -0.25 && o < 0.45) offs.push(o); }
    if (offs.length < 5) { setMsg('För få knackningar. Försök igen och knacka på varje klick.'); return; }
    offs.sort((a, b) => a - b); const med = offs[offs.length >> 1], spread = offs[Math.floor(offs.length * 0.8)] - offs[Math.floor(offs.length * 0.2)];
    const rep = (engine.ctx.outputLatency || 0) * 1000, extra = med * 1000 - rep;
    set(extra);
    setMsg('Uppmätt fördröjning ' + Math.round(med * 1000) + ' ms (webbläsaren rapporterar ' + Math.round(rep) + ' ms). Justeringen är satt till ' + Math.round(Math.max(-100, Math.min(400, extra))) + ' ms.' + (spread > 0.06 ? ' Knackningarna var ganska ojämna, så gör gärna om mätningen.' : ''));
  };
  const start = () => {
    engine.init(); const c = engine.ctx, spb = 60 / 90, n = 16, t0 = c.currentTime + 0.5;
    for (let i = 0; i < n; i++) engine.click(t0 + i * spb, i % 4 === 0);
    R.current = { t0, spb, n, taps: [] }; setRun(true); setMsg('Knacka på knappen precis när du hör klicken. Börja när du hittat takten.');
    setTimeout(finish, (0.5 + n * spb + 0.6) * 1000);
  };
  const tap = (e) => {
    const r = R.current; if (!r) return;
    const lag = e && e.timeStamp ? Math.min(0.25, Math.max(0, (performance.now() - e.timeStamp) / 1000)) : 0;
    r.taps.push(engine.ctx.currentTime - lag); vib(10);
  };
  return html`<div className="set-sec"><b>Fördröjning i ljudet</b>
    <small>Om ljudet kommer efter det du ser, t.ex. med Bluetooth-hörlurar, blir spelen och takten fel. Mät med samma hörlurar eller högtalare som du brukar använda.</small>
    <div className="row">
      <button className="btn" onClick=${() => set(ms - 10)} aria-label="Minska fördröjningen">−</button>
      <b style=${{ minWidth: 70, textAlign: 'center', fontVariantNumeric: 'tabular-nums' }}>${(ms > 0 ? '+' : '') + ms} ms</b>
      <button className="btn" onClick=${() => set(ms + 10)} aria-label="Öka fördröjningen">+</button>
      ${ms ? html`<button className="btn" onClick=${() => { set(0); setMsg(''); }}>Nollställ</button>` : null}
    </div>
    ${run ? html`<button className="btn primary" style=${{ minHeight: 64, fontSize: 18, touchAction: 'manipulation' }} onPointerDown=${tap}>Knacka här i takt</button>` : html`<div className="row"><button className="btn primary" onClick=${start}>Mät med knackning</button></div>`}
    ${msg ? html`<p className="muted" style=${{ fontSize: 13 }}>${msg}</p>` : null}
  </div>`;
}

      <div className="ns-row">
        <label className="ns-f"><span className="label">Låt</span><input type="text" id="songname" required placeholder="Till exempel Often" value=${name} onInput=${(e) => setName(e.target.value)} onChange=${() => {}} /></label>
        <label className="ns-f"><span className="label">Artist</span><input type="text" id="songartist" placeholder="Till exempel Ellen Krauss" value=${artist} onInput=${(e) => setArtist(e.target.value)} onChange=${() => {}} /></label>
      </div>
      ${tab === 'file' ? html`
        <p className="muted" style=${{ fontSize: 13 }}>Välj en ljudfil, till exempel en låt du gjort i Suno. Appen räknar ut tempo, komp och ackord takt för takt, på samma sätt som i Jamma.</p>
        <label className="btn" style=${{ cursor: 'pointer', justifySelf: 'start' }}>Välj ljudfil<input type="file" accept="audio/*,.mp3,.m4a,.wav" onChange=${pickFile} style=${{ display: 'none' }} /></label>
        ${impBusy ? html`<div className="h2-week-bar"><i style=${{ width: impBusy * 100 + '%' }}></i></div><small className="muted">Lyssnar igenom låten …</small>` : null}
        ${impErr ? html`<p className="gh-err" style=${{ color: 'var(--text)' }}>${impErr}</p>` : null}
        ${imp ? html`<div className="ns-prev"><div className="ns-part"><span className="label">${imp.bars.length} takter · ${Math.round(imp.bpm)} BPM · ${imp.name}</span>
          <div className="ns-bars">${imp.bars.slice(0, 64).map((b, j) => html`<span key=${j}>${[].concat(b).map((k) => CHORD_DB[k].name).join(' | ')}</span>`)}</div></div>
          <small className="muted">Ackord i låten: ${imp.chords.slice(0, 8).map((k) => CHORD_DB[k].name).join(', ')}</small></div>` : null}`
      : tab === 'paste' ? html`
        <p className="muted" style=${{ fontSize: 13 }}>Kopiera ett ackordblad (till exempel från Ultimate Guitar) och klistra in här. Appen plockar ut ackorden, delarna och capo. Texten sparas inte.</p>
        <textarea id="sheet" rows="7" placeholder=${'[Verse]\nAm   C   F\n…\n[Chorus]\nC   G   Am   F'} value=${text} onInput=${(e) => setText(e.target.value)} onChange=${() => {}}></textarea>
        <div className="row between"><span className="label">Ackord per takt</span>
          <div className="seg" role="group" aria-label="Ackord per takt">
            <button type="button" aria-pressed=${perBar === 1} onClick=${() => setPerBar(1)}>Ett</button>
            <button type="button" aria-pressed=${perBar === 2} onClick=${() => setPerBar(2)}>Två</button>
          </div></div>
        ${parsed ? html`<div className="ns-prev">
          ${parsed.parts.length ? parsed.parts.map((pt, i) => html`<div key=${i} className="ns-part"><span className="label">${pt.part}</span>
            <div className="ns-bars">${pt.bars.map((b, j) => html`<span key=${j}>${[].concat(b).map((k) => CHORD_DB[k].name).join(' | ')}</span>`)}</div></div>`)
            : html`<p className="muted">Hittade inga ackord än. Ackorden ska stå på egna rader eller inom [ ] i texten.</p>`}
          <p className="muted" style=${{ fontSize: 12 }}>${nBars} takter${parsed.capo ? ' · capo ' + parsed.capo : ''}${Object.keys(parsed.simplified).length ? ' · förenklat: ' + Object.entries(parsed.simplified).map(([a, b]) => a + '→' + b).join(', ') : ''}</p>
          ${parsed.unknown.length ? html`<p className="gh-err" style=${{ color: 'var(--text)' }}>Saknar grepp för ${parsed.unknown.join(', ')}. De hoppas över. Prova en capo-version av ackordbladet.</p>` : null}
        </div>` : null}` : html`
        <div className="row between"><span className="label">Takter (${chords.length})</span>
          <div className="row" style=${{ gap: 6 }}>
            <button type="button" className="chip" disabled=${chords.length <= 2} onClick=${() => setChords(chords.slice(0, -1))}>− Takt</button>
            <button type="button" className="chip" disabled=${chords.length >= 16} onClick=${() => setChords([...chords, chords[chords.length - 1]])}>+ Takt</button>
          </div></div>
        <div className="slots">${chords.map((c, i) => html`<select key=${i} id=${'slot' + i} value=${c} onChange=${(e) => { const u = [...chords]; u[i] = e.target.value; setChords(u); }}>
          ${CHORD_KEYS.map((k) => html`<option key=${k} value=${k}>${CHORD_DB[k].name}</option>`)}</select>`)}</div>`}
      <div className="row between"><span className="label">Tempo</span><${Bpm} value=${bpm} set=${setBpm} /></div>
      <div className="seg" role="group" aria-label="Spelsätt">
        <button type="button" aria-pressed=${feel === 'acoustic'} onClick=${() => setFeel('acoustic')}>Akustiskt komp</button>
        <button type="button" aria-pressed=${feel === 'reggae'} onClick=${() => setFeel('reggae')}>Reggae-skank</button>
      </div>
      <button type="submit" className="btn primary" disabled=${!canSave}>Spara och öppna</button>
    </form>
  </div>`;
}

ReactDOM.createRoot(document.getElementById('root')).render(html`<${App} />`);
</script>

<script>
/* Appens statusfält följer valt färgtema */
(function () {
  var meta = document.querySelector('meta[name="theme-color"]');
  var sync = function () {
    try {
      var c = getComputedStyle(document.documentElement).getPropertyValue('--bg').trim(); if (!c) return; meta.setAttribute('content', c);
      var m = /#([0-9a-f]{6})/i.exec(c), n = m ? parseInt(m[1], 16) : 0, lum = ((n >> 16) * 299 + ((n >> 8) & 255) * 587 + (n & 255) * 114) / 1000;
      // Appen ritas under status- och navigeringsfältet; bara ikonernas färg (ljus/mörk) behöver följa temat
      var SYS = NATIVE && window.Capacitor.Plugins.SystemBars;
      if (SYS && m) SYS.setStyle({ style: lum > 140 ? 'LIGHT' : 'DARK' }).catch(function () {});
    } catch (e) {}
  };
  new MutationObserver(sync).observe(document.documentElement, { attributes: true, attributeFilter: ['data-skin', 'data-jam', 'class'] });
  window.addEventListener('load', sync);
})();
/* Offline och installation */
if ('serviceWorker' in navigator && !NATIVE) {
  window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
  var hadSW = !!navigator.serviceWorker.controller, swReloaded = false;
  // Ingen automatisk omladdning: sidan hämtas alltid färsk från nätet, så nya versionen gäller nästa gång appen öppnas.
}
</script>
</body>
</html>
